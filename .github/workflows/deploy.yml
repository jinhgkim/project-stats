name: Deploy

on:
  # 1:07am Vancouver
  schedule:
    - cron: "7 8 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag of the code to build
        default: release

permissions:
  contents: read

# Two runs at once would push over each other's databases.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    # ubuntu-latest is moving to a newer image; this one has gh installed.
    runs-on: ubuntu-24.04
    steps:
      # main moves ahead of what is live, so the site is built from release.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'release' }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: jinhgkim/project-stats-data
          token: ${{ secrets.DATA_TOKEN }}
          path: data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch new history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for config in $(python -c "import tomllib; print(*tomllib.load(open('deploy.toml', 'rb'))['projects'])"); do
            python -m projstats fetch "$config"
          done
      # Tags documents without tags, oldest first; earlier tags and the theme
      # list come from the databases. The limit caps each project's run, the
      # rest waits a day. The timeout and a failure keep the batches already
      # tagged, and must not block the site.
      - name: Tag new documents
        continue-on-error: true
        timeout-minutes: 330
        run: |
          configs=$(python -c "import tomllib; load = lambda p: tomllib.load(open(p, 'rb')); print(*[p for p in load('deploy.toml')['projects'] if load(p).get('themes', {}).get('enabled')])")
          [ -n "$configs" ] || exit 0
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.40.13 sh
          curl -fsS localhost:11434 || (nohup ollama serve > ollama.log 2>&1 &)
          until curl -fsS localhost:11434; do sleep 1; done
          for config in $configs; do
            ollama pull "$(python -c "from projstats import config; print(config.load('$config').ollama.model)")"
            python -m projstats tag "$config" --limit 500 || failed=1
          done
          exit ${failed:-0}
      # Pushes the updated databases to the private data repo.
      - name: Save the databases
        if: github.ref == 'refs/heads/main'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "databases unchanged"
          else
            git commit -m "data: update databases"
            git push
          fi
      - name: Build the site
        env:
          PROJSTATS_GA_ID: ${{ vars.PROJSTATS_GA_ID }}
        run: python -m projstats deploy
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
