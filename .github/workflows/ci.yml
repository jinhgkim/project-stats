name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -t .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.3
      - run: ruff format --check projstats tests tests_browser

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests_browser -t .

  # Needs the private data repo, which pull requests from forks cannot read.
  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: jinhgkim/project-stats-data
          token: ${{ secrets.DATA_TOKEN }}
          path: data
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m projstats deploy
      - run: PROJSTATS_SITE=site python -m unittest tests_browser.check_site
