[repo]
github = "AcademySoftwareFoundation/MaterialX"
label = "ASWF/MaterialX"   # short name shown on the page

[people]
# Extra names, emails, or logins to drop. Always dropped: logins ending in "[bot]" and
# Claude, Cursor, Codex, and Copilot (matched by email or login, see identity.py).
# People the page lets you leave out with a checkbox, as label = login (all included by default).
leave_out_option = { maintainer = "jstone-lucasfilm" }  # Jonathan Stone

[activity]
# PR or issue numbers left out of every count, along with commits linked to those PRs.
exclude_items = []

[retention]
return_gap_days = 365   # "returning" = back after at least this long away
# Segments, ranked by activity: core = the top people who together do 80% of all
# activity; regular = the next people, up to 90%; casual = everyone else with
# more than one activity; one-time = exactly one activity.
core_share = 0.80
regular_share = 0.90

[releases]
# Final release tags: v1.39.4. RCs and suffixed tags (v1.38.10-OpenPBR) don't
# match. Each major.minor's earliest match is its release.
tag_pattern = '^v(\d+)\.(\d+)\.(\d+)$'

[themes]
enabled = true
about = "MaterialX: an open standard and C++/Python/JavaScript library for describing materials and look-development content in computer graphics, exchanged across applications and renderers."
areas = "node definitions and node libraries, shader generation (GLSL, MDL, MSL, OSL, Slang), Rendering, Viewer, Graph Editor, Python bindings, JavaScript bindings, document and file format (XML, specification), color management, build system, continuous integration, documentation"
project_names = ["MaterialX", "MTLX"]
max_per_doc = 3
doc_chars = 3000
batch_docs = 8
batch_chars = 8000
registry_limit = 300
