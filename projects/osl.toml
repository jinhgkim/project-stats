[repo]
github = "AcademySoftwareFoundation/OpenShadingLanguage"
label = "ASWF/OpenShadingLanguage"   # short name shown on the page

[people]
# Extra names, emails, or logins to drop. Always dropped: logins ending in "[bot]" and
# Claude, Cursor, Codex, and Copilot (matched by email or login, see identity.py).
# People the page lets you leave out with a checkbox, as label = login (all included by default).
leave_out_option = { maintainer = "lgritz" }  # Larry Gritz

[activity]
# PR or issue numbers left out of every count, along with commits linked to those PRs.
exclude_items = []

[retention]
return_gap_days = 365   # "returning" = back after at least this long away
# Segments, ranked by activity: core = the top people who together do 80% of all
# activity; regular = the next people, up to 90%; casual = everyone else with
# more than one activity; one-time = exactly one activity.
core_share = 0.80
regular_share = 0.90

[releases]
# Final release tags: Release-1.9.9 (older) and v1.15.0.0 (newer). Betas, RCs,
# dev, and spi-* tags don't match. Each major.minor's earliest match is its release.
tag_pattern = '^(?:Release-|v)(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$'

[themes]
enabled = true
about = "OpenShadingLanguage (OSL): an advanced shading language and runtime (oslc compiler, LLVM-based shading system) for production global illumination renderers, used in VFX and animation."
areas = "oslc compiler and type checking, OSL language spec and built-in functions, standard library stdosl.h and noise, runtime optimizer, LLVM JIT backend, shading system API and renderer services (RendererServices, OSO loading, shader parameters, texture handles), batched SIMD execution, OptiX and GPU, closures and BSDF library, testshade and testrender, osltoy, OpenImageIO integration, color spaces, platform ports, build system (CMake, dependencies, compiler and Python versions), continuous integration (GitHub Actions, release workflows, coverage), testsuite, documentation (docs, CHANGES, release notes)"
project_names = ["OSL", "OpenShadingLanguage", "Open Shading Language"]
max_per_doc = 3
doc_chars = 3000
batch_docs = 8
batch_chars = 8000
registry_limit = 300
