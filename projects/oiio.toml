[repo]
github = "AcademySoftwareFoundation/OpenImageIO"

[people]
# Extra names, emails, or logins to drop. Logins ending in "[bot]" are always dropped.
bots = ["Copilot"]
# GitHub logins the page lets you leave out with a checkbox (all included by default).
leave_out_option = [
  "lgritz",  # Larry Gritz: about 62% of all activity
]

[activity]
# PR or issue numbers left out of every count, along with commits linked to those PRs.
exclude_items = [
  3905,  # "Relicense code under Apache 2.0": 78 people commented in July 2023
]

[retention]
return_gap_days = 365   # "returning" = back after at least this long away
# Segments, ranked by activity: core = the top people who together do 80% of all
# activity; regular = the next people, up to 90%; casual = everyone else with
# more than one activity; one-time = exactly one activity.
core_share = 0.80
regular_share = 0.90

[releases]
# Final release tags: Release-1.2.0 (older) and v3.2.1.0 (newer). Betas, RCs,
# and spi-* tags don't match. Each major.minor's earliest match is its release.
tag_pattern = '^(?:Release-|v)(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$'

[ollama]
host = "http://localhost:11434"
model = "ornith-1.5:9b"
timeout = 600   # seconds per request
context = 32768 # tokens the model can see per request (prompt + answer)
think = false   # let the model reason first: slower, sometimes more careful

[themes]
about = "OpenImageIO: a C++/Python library and tools (oiiotool, iv, maketx) for reading, writing, and processing images in many formats, used in VFX and animation."
max_per_doc = 3       # themes per document
doc_chars = 1500      # each document's text is cut here (90% of documents are shorter)
batch_docs = 8        # documents per model call...
batch_chars = 8000    # ...or fewer, if their text adds up to this
registry_limit = 300  # existing themes listed in the prompt, most used first
