[repo]
github = "AcademySoftwareFoundation/dna"
label = "ASWF/dna"   # short name shown on the page

[people]
# Extra names, emails, or logins to drop. Always dropped: logins ending in "[bot]" and
# Claude, Cursor, Codex, and Copilot (matched by email or login, see identity.py).
# People the page lets you leave out with a checkbox, as label = login (all included by default).

[activity]
# PR or issue numbers left out of every count, along with commits linked to those PRs.
exclude_items = []

[retention]
return_gap_days = 365   # "returning" = back after at least this long away
# Segments, ranked by activity: core = the top people who together do 80% of all
# activity; regular = the next people, up to 90%; casual = everyone else with
# more than one activity; one-time = exactly one activity.
core_share = 0.80
regular_share = 0.90

[releases]
# Final release tags: v0.1.0 through v0.3.4. Each major.minor's earliest match is its release.
tag_pattern = '^v(\d+)\.(\d+)\.(\d+)$'

[themes]
enabled = false
