[repo]
github = "AcademySoftwareFoundation/openexr"
label = "ASWF/OpenEXR"   # short name shown on the page

[people]
# Extra names, emails, or logins to drop. Always dropped: logins ending in "[bot]" and
# Claude, Cursor, Codex, and Copilot (matched by email or login, see identity.py).
# People the page lets you leave out with a checkbox, as label = login (all included by default).
leave_out_option = { maintainer = "cary-ilm" }  # Cary Phillips

[activity]
# PR or issue numbers left out of every count, along with commits linked to those PRs.
exclude_items = []

[retention]
return_gap_days = 365   # "returning" = back after at least this long away
# Segments, ranked by activity: core = the top people who together do 80% of all
# activity; regular = the next people, up to 90%; casual = everyone else with
# more than one activity; one-time = exactly one activity.
core_share = 0.80
regular_share = 0.90

[releases]
# Final release tags: v1.7.1 through v3.5.3. Betas, RCs, and older OPENEXR_1_* tags
# don't match. Each major.minor's earliest match is its release.
tag_pattern = '^v(\d+)\.(\d+)\.(\d+)$'

[themes]
enabled = true
about = "OpenEXR: the specification and reference implementation of the EXR image file format used in motion picture production, with a C++ library, a C core library, command-line tools, and Python bindings."
areas = "compression codecs (each codec is its own area: RLE, ZIP, PIZ, PXR24, B44, DWA (DWAA and DWAB), ZSTD, HTJ2K), deep images, multipart and multiview files, tiled and mipmapped images, command-line tools, Python bindings, security and hardening (CVE fixes, fuzzing, malformed input, SECURITY.md), build system, continuous integration, performance, API changes and deprecations, documentation and website"
project_names = ["OpenEXR", "EXR"]
max_per_doc = 3
doc_chars = 3000
batch_docs = 8
batch_chars = 8000
registry_limit = 300
