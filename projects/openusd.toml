[repo]
github = "PixarAnimationStudios/OpenUSD"
label = "OpenUSD"   # short name shown on the page

[people]
# Extra names, emails, or logins to drop. Always dropped: logins ending in "[bot]" and
# Claude, Cursor, Codex, and Copilot (matched by email or login, see identity.py).
# People the page lets you leave out with a checkbox, as label = login (all included by default).

[activity]
# PR or issue numbers left out of every count, along with commits linked to those PRs.
exclude_items = []

[retention]
return_gap_days = 365   # "returning" = back after at least this long away
# Segments, ranked by activity: core = the top people who together do 80% of all
# activity; regular = the next people, up to 90%; casual = everyone else with
# more than one activity; one-time = exactly one activity.
core_share = 0.80
regular_share = 0.90

[releases]
# Final release tags: v18.09 through v26.11.1, plus v0.7.0 through v0.8.5. Some tags
# have a patch number (v25.05.01, v26.11.0), so the patch group is optional. Letter
# suffixes (v22.05a, v25.02a, v0.8.5a) don't match. Each major.minor's earliest match
# is its release.
tag_pattern = '^v(\d+)\.(\d+)(?:\.(\d+))?$'

[themes]
enabled = true
about = "OpenUSD: Universal Scene Description, a system for authoring, reading, and streaming time-sampled scene description for interchange between graphics applications."
areas = "USD core and layers (Sdf, Pcp, Usd), schemas (UsdGeom, UsdShade, UsdLux, UsdSkel, UsdPhysics, UsdVol, UsdRender), Hydra rendering framework (Hd, HdSt, Hdx), graphics APIs (Hgi, OpenGL, Metal, Vulkan), usdview and USD imaging, base libraries (Tf, Vt, Gf, Plug, Work, Trace), asset resolution (Ar), OpenExec computation, MaterialX integration, file format plugins (Alembic, OpenVDB, usdz), validation, Python bindings, build system (CMake, build_scripts), continuous integration, Windows, macOS and Linux platform support, performance, documentation and tutorials"
project_names = ["OpenUSD", "USD"]
max_per_doc = 3
doc_chars = 3000
batch_docs = 8
batch_chars = 8000
registry_limit = 300
