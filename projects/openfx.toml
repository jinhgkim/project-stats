[repo]
github = "AcademySoftwareFoundation/openfx"
label = "ASWF/OpenFX"   # short name shown on the page

[people]
# Extra names, emails, or logins to drop. Always dropped: logins ending in "[bot]" and
# Claude, Cursor, Codex, and Copilot (matched by email or login, see identity.py).
# People the page lets you leave out with a checkbox, as label = login (all included by default).
leave_out_option = { maintainer = "garyo" }  # Gary Oberbrunner: about 36% of all activity
# People GitHub never linked to their commit email: one login and the emails (after
# .mailmap) that are the same person. Add only when the evidence is clear. Authors
# with no email (the CVS-era commits) appear as "<name>@no-email.invalid".
same_person = [
  # CVS user brunonicoletti, then "BrunoNicoletti" and "Bruno Nicoletti <Bruno>" at The Foundry
  { login = "bruno-j-nicoletti", emails = ["brunonicoletti@no-email.invalid", "bruno@thefoundry.co.uk", "bruno"] },
  # CVS user philfoundry, later Phil Barrett at FilmLight (confirmed by the maintainer)
  { login = "barretpj", emails = ["philfoundry@no-email.invalid"] },
  # GitHub name Alexandre Gauthier, here as Alexandre Gauthier-Foichat at Left Angle (Natron)
  { login = "MrKepzie", emails = ["alexandre.gauthier@left-angle.com"] },
  # Pierre Jasmin of RE:Vision Effects, also the revisionfx account (confirmed by the maintainer)
  { login = "revisionfx", emails = ["rd@revisionfx.com"] },
  { login = "PierreJasmin", emails = ["jasmin@revisionfx.com"] },
]

[activity]
# PR or issue numbers left out of every count, along with commits linked to those PRs.
exclude_items = []

[retention]
return_gap_days = 365   # "returning" = back after at least this long away
# Segments, ranked by activity: core = the top people who together do 80% of all
# activity; regular = the next people, up to 90%; casual = everyone else with
# more than one activity; one-time = exactly one activity.
core_share = 0.80
regular_share = 0.90

[releases]
# Final release tags: OFX_Release_1_0_TAG through OFX_Release_1.5.1. Most have
# no patch number (OFX_Release_1_4_TAG, OFX_Release_1.5), so the patch group is
# optional. Drafts (1_0D1), RCs (1_0_RC6), and OFX_Release_1.5s don't match.
# Each major.minor's earliest match is its release.
tag_pattern = '^OFX_Release_(\d+)[._](\d+)(?:[._](\d+))?(?:_TAG)?$'

[themes]
enabled = false
