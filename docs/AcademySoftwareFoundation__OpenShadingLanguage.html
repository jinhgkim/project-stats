<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenShadingLanguage Project Analytics</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --wash: rgba(11, 11, 11, 0.05);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --kind-code: #e87ba4;
    --kind-discussion: #6250d6;
    --series-1-faint: #86b6ef;
    /* One-hue blue ramps: seq-* for the theme heatmap (top three take the
       inverse ink), ord-* for timeline marks (lightest still clears 2:1). */
    --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec;
    --seq-4: #256abf; --seq-5: #184f95; --seq-6: #0d366b;
    --seq-ink-inverse: #ffffff;
    --ord-1: #86b6ef; --ord-2: #3987e5; --ord-3: #1c5cab; --ord-4: #0d366b;
    --critical: #d03b3b;
    --good: #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface-1: #1a1a19;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.06);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --kind-code: #d55181;
      --kind-discussion: #9085e9;
      --series-1-faint: #184f95;
      --seq-1: #0d366b; --seq-2: #184f95; --seq-3: #256abf;
      --seq-4: #6da7ec; --seq-5: #9ec5f4; --seq-6: #cde2fb;
      --seq-ink-inverse: #0b0b0b;
      --ord-1: #184f95; --ord-2: #2a78d6; --ord-3: #6da7ec; --ord-4: #b7d3f6;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.06);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --kind-code: #d55181;
    --kind-discussion: #9085e9;
    --series-1-faint: #184f95;
    --seq-1: #0d366b; --seq-2: #184f95; --seq-3: #256abf;
    --seq-4: #6da7ec; --seq-5: #9ec5f4; --seq-6: #cde2fb;
    --seq-ink-inverse: #0b0b0b;
    --ord-1: #184f95; --ord-2: #2a78d6; --ord-3: #6da7ec; --ord-4: #b7d3f6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header, #filter-inner, #views, #check-panel, #about { max-width: 1440px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 20px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 20px; font-weight: 600; margin: 0; }
  /* The project name in the title: a dim box with an arrow on the right (drawn
     here so it matches the More filters arrow). */
  .project-pick { position: relative; display: inline-block; margin-left: 8px; }
  .project-pick::before {
    content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
    border: solid var(--text-secondary); border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg); pointer-events: none;
  }
  #project {
    cursor: pointer; background-image: none;
    background-color: var(--wash); padding: 2px 28px 2px 10px;
  }
  #project:hover { border-color: var(--text-muted); }
  #theme {
    margin-left: auto; align-self: center; display: grid; place-items: center;
    width: 34px; height: 34px; padding: 0; border-radius: 999px; color: var(--text-secondary);
  }
  #theme:hover { color: var(--text-primary); }
  #about { color: var(--text-secondary); font-size: 13px; padding-top: 14px; padding-bottom: 40px; border-top: 1px solid var(--grid); }
  #about a { color: inherit; }
  button, select, input {
    font: inherit; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
  }
  button { cursor: pointer; }
  /* One drawn arrow on every select (a native one sits tight against the edge):
     two thin diagonals forming a chevron, the same shape as the More filters one. */
  select {
    appearance: none; -webkit-appearance: none; padding-right: 28px;
    background-image:
      linear-gradient(to top right, transparent calc(50% - 0.75px), var(--text-muted) calc(50% - 0.75px),
        var(--text-muted) calc(50% + 0.75px), transparent calc(50% + 0.75px)),
      linear-gradient(to top left, transparent calc(50% - 0.75px), var(--text-muted) calc(50% - 0.75px),
        var(--text-muted) calc(50% + 0.75px), transparent calc(50% + 0.75px));
    background-repeat: no-repeat; background-size: 5px 5px; background-position: right 15px center, right 10px center;
  }
  button:hover { background: var(--wash); }
  button[aria-pressed="true"], button[aria-checked="true"] { border-color: var(--text-secondary); font-weight: 600; }
  /* Toggles reserve their bold width (data-label repeats the text), so pressing one doesn't resize it. */
  button[data-label] { display: inline-grid; justify-items: center; }
  button[data-label]::after { content: attr(data-label); font-weight: 600; height: 0; overflow: hidden; visibility: hidden; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
  /* The top bar holds the filters that change every view; it stays pinned
     while scrolling, except on narrow screens where it would cover too much. */
  #filters {
    position: sticky; top: 0; z-index: 5; margin-top: 12px;
    background: var(--page); border-bottom: 1px solid var(--grid);
  }
  @media (max-width: 700px) { #filters { position: static; } }
  #filter-controls, #filter-more { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
  #filter-more { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--grid); }
  #more-toggle { display: inline-flex; gap: 6px; align-items: center; }
  .badge {
    min-width: 18px; padding: 0 5px; border-radius: 999px; text-align: center;
    font-size: 11px; line-height: 18px; background: var(--series-1); color: #fff;
  }
  .chev {
    width: 6px; height: 6px; margin: -3px 2px 0; border: solid var(--text-muted);
    border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); transition: transform 0.15s;
  }
  button[aria-expanded="true"] .chev, .chev.up { margin-top: 3px; transform: rotate(-135deg); }
  button.sort { display: inline-flex; gap: 6px; align-items: center; border: none; background: none; padding: 0; font-weight: 600; color: inherit; }
  button.sort:hover { background: none; color: var(--text-primary); }
  /* A sortable column that isn't the sorted one: an up and a down arrow side by side,
     faded, a different shape from the single chevron that shows the direction. */
  .sort-none { flex: none; opacity: 0.55; color: var(--text-muted); font-size: 12px; font-weight: 400; line-height: 1; }
  .sort-none::before { content: "\2191\2193"; letter-spacing: -1px; }
  button.sort:hover .sort-none, button.sort:focus-visible .sort-none { opacity: 1; }
  .menu { position: relative; display: inline-block; }
  .menu-button { display: inline-flex; gap: 10px; align-items: center; justify-content: space-between; min-width: 170px; }
  .menu-list {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 10; display: grid; gap: 1px;
    width: max-content; min-width: 100%; max-width: 360px; max-height: 320px; overflow-y: auto;
    padding: 6px; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  }
  .menu-list .option {
    display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center;
    padding: 3px 6px; border-radius: 4px; cursor: pointer;
  }
  .menu-list .option:hover { background: var(--wash); }
  .menu-list input { margin: 0; width: 16px; height: 16px; accent-color: var(--series-1); }
  .menu-list .count { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  #filter-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 8px; }
  #filter-chips .label { color: var(--text-muted); margin-right: 2px; }
  .chip {
    display: inline-flex; align-items: center; padding: 1px 3px 1px 10px;
    border-radius: 999px; background: var(--wash); border: 1px solid var(--border);
  }
  .chip button {
    border: none; background: none; padding: 0 6px; border-radius: 999px;
    color: var(--text-secondary); font-size: 16px; line-height: 1.2;
  }
  .chip button:hover { color: var(--text-primary); background: var(--wash); }
  #filter-chips button.link {
    border: none; background: none; margin-left: auto; padding: 2px 4px;
    color: var(--text-secondary); text-decoration: underline;
  }
  #filter-chips button.link:hover { color: var(--text-primary); }
  #filter-inner { padding-top: 10px; }
  #tabs { display: flex; gap: 4px; margin-top: 10px; }
  #tabs .tab {
    border: none; border-radius: 6px 6px 0 0; background: none; padding: 8px 14px 7px;
    color: var(--text-secondary); font-size: 15px; border-bottom: 3px solid transparent;
  }
  #tabs .tab:hover { color: var(--text-primary); background: var(--wash); }
  #tabs .tab[aria-selected="true"] { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--series-1); }
  section.panel { padding-top: 14px; }
  figure.view, .details { scroll-margin-top: calc(var(--bar-h, 0px) + 12px); }
  .plot .hit.clickable { cursor: pointer; }
  .details .table-wrap { max-height: 440px; margin-top: 8px; }
  .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1100px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid > figure.view { grid-column: 1 / -1; }
  }
  .filter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .filter > .label { color: var(--text-secondary); margin-right: 2px; }
  .choice { display: inline-flex; gap: 6px; }
  .filter label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .filter label.check input { margin: 0; width: 16px; height: 16px; accent-color: var(--series-1); }
  #views { padding-bottom: 40px; }
  figure.view {
    margin: 0; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; min-width: 0;
  }
  figure.view .head { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  figure.view h3 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; min-width: 200px; }
  figure.view .subtitle { color: var(--text-primary); margin: 4px 0 6px; max-width: 80ch; }
  figure.view.bare { background: none; border: none; padding: 0; }
  details.howto { color: var(--text-secondary); margin: 0 0 8px; max-width: 80ch; }
  details.howto summary { cursor: pointer; color: var(--text-muted); width: fit-content; }
  details.howto ul { margin: 6px 0 4px; padding-left: 18px; }
  details.howto li { margin: 2px 0; }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .tile {
    text-align: left; padding: 12px 14px; border-radius: 10px; background: var(--surface-1);
    border: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px;
  }
  .tile .value { font-size: 26px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .tile .what { color: var(--text-secondary); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--text-secondary); margin: 4px 0 8px; }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { display: block; }
  .legend .unit { margin-left: auto; }
  .legend .total { color: var(--text-primary); font-weight: 600; }
  .plot { position: relative; width: 100%; }
  .plot svg { display: block; width: 100%; overflow: visible; }
  .plot text { fill: var(--text-muted); font-size: 11px; }
  .plot .grid line { stroke: var(--grid); }
  .plot .axis path, .plot .axis line { stroke: var(--axis); }
  .plot .label { fill: var(--text-secondary); font-size: 12px; }
  .plot .halo { paint-order: stroke; stroke: var(--surface-1); stroke-width: 3px; stroke-linejoin: round; }
  .plot .marker line { stroke: var(--text-muted); }
  .plot .hit { fill: transparent; outline: none; }
  .plot .hit:hover, .plot .hit:focus { fill: var(--wash); }
  .plot .hit:focus-visible { stroke: var(--series-1); stroke-width: 2px; }
  .empty { color: var(--text-secondary); padding: 24px 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 8px; }
  .controls:empty { display: none; }
  .controls > .label { color: var(--text-secondary); margin-right: 2px; }
  input.short { width: 4.5em; }
  .filter .error { color: var(--critical); }
  .filter .error:empty { display: none; }
  .plot .name { fill: var(--text-secondary); font-size: 13px; }
  .plot .name.current { fill: var(--text-primary); font-weight: 600; }
  .plot .cell-ink { fill: var(--text-primary); font-size: 12px; }
  .plot .cell-ink-inverse { fill: var(--seq-ink-inverse); font-size: 12px; }
  .plot .scroll { max-height: 480px; overflow-y: auto; }
  .plot .label.current { fill: var(--text-primary); font-weight: 600; }
  .filter .note { color: var(--text-muted); }
  table.data.themes th, table.data.themes td { text-align: left; vertical-align: top; }
  /* Fixed column widths, as shares of the table; narrow screens scroll sideways. */
  table.data.themes { table-layout: fixed; min-width: 900px; }
  table.data.themes th:nth-child(1) { width: 20%; }
  table.data.themes th:nth-child(2) { width: 10%; }
  table.data.themes th:nth-child(3), table.data.themes th:nth-child(4) { width: 9%; }
  table.data.themes th:nth-child(5) { width: 13%; }
  table.data.themes td:first-child, table.data.themes td:first-child .link-button { white-space: nowrap; }
  table.data.themes td.nowrap { white-space: nowrap; }
  table.data.themes td.people { color: var(--text-secondary); }
  table.themes tr.selected td { background: var(--wash); }
  .link-button { border: none; background: none; padding: 0; color: var(--series-1); font-weight: 600; text-align: left; }
  .link-button:hover { background: none; text-decoration: underline; }
  .link-button[aria-expanded="true"] { text-decoration: underline; }
  .details { margin-top: 12px; border-top: 1px solid var(--grid); padding-top: 12px; }
  .details-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .details-head h3 { font-size: 15px; margin: 0; flex: 1; min-width: 200px; }
  .details .meta { color: var(--text-secondary); }
  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 8px; }
  .groups h4 { margin: 0 0 4px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .groups ul { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
  .groups li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--grid); }
  .groups .count { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .groups .empty { margin: 0; padding: 3px 0; }
  table.data { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data th { color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; background: var(--surface-1); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .status {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
    border: 1.5px solid var(--text-muted); vertical-align: 1px; box-sizing: border-box;
  }
  .status.on { background: var(--series-1); border-color: var(--series-1); }
  .status-key { margin: 6px 0 0; color: var(--text-secondary); font-size: 13px; }
  .status-key .status { margin-left: 2px; margin-right: 5px; }
  .status-key .status:not(:first-child) { margin-left: 14px; }
  table.data.activity th, table.data.activity td { text-align: left; }
  /* Fixed widths, so the columns stay put when a sort changes which rows are shown. */
  table.data.activity { table-layout: fixed; }
  table.data.activity th:nth-child(1) { width: 130px; }
  table.data.activity th:nth-child(2) { width: 170px; }
  table.data.activity.with-person th:nth-child(3) { width: 200px; }
  table.data.activity.with-person td:nth-child(3) { overflow: hidden; text-overflow: ellipsis; }
  table.data.activity td:nth-child(-n+2) { white-space: nowrap; color: var(--text-secondary); padding-right: 20px; }
  table.data.activity.with-person td:nth-child(3) { white-space: nowrap; color: var(--text-secondary); padding-right: 20px; }
  table.data.activity td a { color: var(--text-primary); }
  .legend .key .status { margin-right: 0; }
  table.data.activity th:first-child, table.data.activity td:first-child { padding-left: 0; }
  figure[id*="activity"] .table-wrap { max-height: min(60vh, 520px); }
  table.data.people th.left, table.data.people td.left { text-align: left; }
  table.data.people td:first-child { white-space: nowrap; }
  .cellbar { display: flex; align-items: center; gap: 8px; }
  .cellbar .num { min-width: 6ch; text-align: right; }
  .cellbar .track { flex: 0 1 120px; min-width: 40px; height: 10px; }
  .cellbar .bar { display: block; height: 100%; min-width: 1px; background: var(--series-1); border-radius: 0 2px 2px 0; }
  /* Positioned, so the absolutely placed .sr-only text inside is clipped and scrolls with the box
     instead of stretching the page. */
  .table-wrap { max-height: 420px; overflow: auto; position: relative; }
  #tooltip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); min-width: 160px;
  }
  #tooltip .title { color: var(--text-secondary); margin-bottom: 4px; }
  #tooltip .title:only-child { margin-bottom: 0; max-width: 300px; }
  .has-tip select:disabled { pointer-events: none; }
  #tooltip .row { display: flex; align-items: center; gap: 8px; }
  #tooltip .row .value { font-weight: 600; min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
  #tooltip .row .name { color: var(--text-secondary); }
  #check-panel:empty { display: none; }
  #check-panel .box { margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface-1); }
  #check-panel .ok { color: var(--good); font-weight: 600; }
  #check-panel .bad { color: var(--critical); font-weight: 600; }
  #check-panel pre { white-space: pre-wrap; margin: 6px 0 0; color: var(--text-secondary); }
</style>
</head>
<body>
<header>
  <h1 id="title">OpenShadingLanguage Project Analytics</h1>
  <select id="project" aria-label="Project" hidden></select>
  <button id="theme" type="button"></button>
</header>
<div id="check-panel"></div>
<div id="filters" role="region" aria-label="Filters">
  <div id="filter-inner">
    <div id="filter-controls" role="toolbar" aria-label="Filters for every tab"></div>
    <div id="filter-more" hidden></div>
    <div id="filter-chips" hidden></div>
    <div id="tabs" role="tablist" aria-label="Views"></div>
  </div>
</div>
<main id="views"></main>

e FlexLexer.h included from the same place as the flex binary.  This solves problems when users have multiple incompatible versions of flex on their system.","Implement == and != for all types","Implement &, |, ^, <<, >>","\"uniform if\" working","Got \"varying if\" working.","File comments.","Got cos working.  Which should serve as a model for another couple dozen simple math functions.","Move tests up a directory","Finished moving tests up a directory","Even more template magic to get most unary function shadeops down to 4 lines!","Improve comments.","Implement constructors for point, vector, normal.  At least, the 3-float versions.  The ones with space names are still not finished.","Fix the ifdef guards for header inclusion -- ensure that all start with \"OSL\" so they are less likely to conflict with anything else on somebody's system.","Implementation of vector operations.","Allow the whole library to be wrapped in a (potentially versioned) custom namespace to be determined at compile time with 'make NAMESPACE=foo'. By default, no such enclosing namespace is used.","adding sin() operation to OSL","Make our own export.h.  Including OpenImageIO/export.h will surely end in tears.","Fix copyright, I accidentally left it as it was in OIIO.","Break off several configuration options and compile-time type definitions into oslconfig.h.","Checkpoint: start to mock up 'RendererServices' through which the client supplies the ShadingSystem with callbacks for all the things the renderer needs to do for the shading system.  Also, make geterror() thread-safe.","committing safe acos() operator","adding tan() operation to math library","adding asin() operator","minor codestyle clean-ups","adding atan() operator","adding cosh() operator","adding sinh() operator","adding tanh() operator","adding log() operator","adding log2() operator","adding log10() operator","adding exp() operator","adding exp2() operator","adding expm1() operator","adding logb() operator to compiler","adding ol scoping of the 'for' statement, so its initializer can   declare variables local to the for loop (a la C/C++). * Fixed a bug with \"if\" where it wasn't properly recognizing varying   conditions that were nonetheless all the same value (and therefore   taking the uniform quick path, even though not technically uniform).   The logic was just wrong.","- adding atan2() function - added generic binary function template: T = func(T, T)   (used by atan2())","fixing typo in the error message for the binary-function template","Implementation of do...while loops.  Works for both uniform and varying conditions, though not yet properly in the presence of break/continue.","adding isinf(), isnan(), and isfinite() functions","adding sign() function","clean-up for isnan(), isinf(), and isfinite()","- fix parser: pow() function must take 2 arguments - added pow() function","adding clamp() function","adding min() and max() functions","removing error checks inside clamp() -- caveat emptor!","removing unused member variable in Clamp operator","fixing typo with ternary-function template","adding mix() function","adding step() function","adding erf() and erfc() error functions","adding hypot() function","adding smoothstep() function","- fmod() is now an alias for mod() - mod() has been updated to work with:       int = mod(int,int),  float = mod(float,float)       vec = mod(vec,float), vec = mod(vec,vec) - fmod() is the same as mod() but it doesn't permit:       int = fmod(int, int) - mod() now reports errors if the 2nd argument is zero       and also returns 0.  The error message refers to       mod() even if fmod() were the function called.","Fix embarrassing bug where TypeSpec::elementtype() just didn't work.","Try to clarify comments about how adjust_varying works.","Implementation of arrays.  Reference (foo = array[i]) and assignment (array[i] = foo) work now, including subtle cases such as colorarray[index][component] = float.  Still to do: arrayindex(), make individual array + component work for matrices (e.g. marray[i][r][c] = x).","Have svn ignore temp files that the tests leave behind.","Implemented arraylength().  Required a compiler bug fix in check_arglist.","More array work: implemented the dreaded matrixarray[index][row][column] (both reference and assignment).","Minor fix to get initializers of array parameters working properly.","adding reflect() and refract() functions","- refract() returns (0,0,0) in the case of total internal reflection - refract() doesn't normalize the returned vector","- adding fresnel() function - fixed fresnel() specification in compiler","Fix typo in DASSERT.","Allow more recent Boost.  We don't really use boost::program_options, so remove it.","Docs: Clarify what reflect() does.","Classes used for internal representation of radiance closures. Manipulation of them by the OSL interpreter will be a separate checkin.","Make closure primitives self-registering via the base class constructor. No need for the renderer to register them, it's enough to just create one instance of each closure primitive.","Fix compiler errors on gcc 4.2 on Snow Leopard.","Checkpoint progress on closure math.","Upgrade TBB to 2.2 (matches the OIIO upgrade of TBB, also).","Add tangent & binormal parameters to BSDF eval & sample.  Implement the default sample routine to be cosine-weighted hemisphere.  Implement lambertian closure.","Lot of closure work: We now bind correctly (lay out space in the shader execution area), assign, manipulate, print results.  Lots of infrastructure to support this.","Big overhaul of the implementation of ClosureColor.  Highlights: * Greatly simplified data structure.  No more separate ClosureColorComponent   class at all, just a teeny struct defined locally to ClosureColor. * Add 'pdf()' method. * Remove lots of params such as P, N, T, B from the BSDF methods. * Simplified way of storing, getting, and setting parameters of the   closures.  No more endless std::vector's in every component, just one   block of memory for a closure. * Build-in BSDF's such as diffuse() now take N explicitly as a parameter,   and it's not handled as a special case at all.","Infrastructure for derivatives, and allegedly correct derivative propagation in assignment.","Revert a few lines from the last checkin -- they were from a previous implementation that's ancient, \"so three days ago\".","Make all shadeops \"derivative-safe\".  That means that they at least assign something to the derivs, though as a placeholder, they are always zeroing them out.  We'll gradually replace these with routines that compute the correct derivatives.","Simplify the adjust_varying calls in fresnel -- no need to check variable pairs for aliasing if they are not of the same type (for example, a vector and a float CANNOT be aliases of the same variable).","Implement the Dx() and Dy() shadeops that extract derivs.","A bunch of additional infrastructure for derivatives.","Fix buglet from the last checkin, where assignment copied the wrong number of bytes for one case.","Add a deriv test in the testsuite.","Make testshade set up derivs of P, u, v, and make the shading system know what to do about that.","Typo gave compile error with older OIIO versions.","Augment the arithmetic test with mixed float/int math.","Generate extra int->float conversion code for mixed int/float arithmetic, to ease the burden on the runtime for supporting so many mixed type arithmetic expressions.","Get derivs working for '+'.","Propagate derivs through subtraction and multiplication.","Big renaming -- make unary_op and binary_op templates be the ones that understand derivatives, unary_op_noderivs and binary_op_noderivs be the ones that punt and just set derivs to zero.  This makes it easier to spot which shadeops are not yet computing derivatives properly.","Change all the unary, binary, and ternary functors from result = func (a), result = func (a,b), result = func (a,b,c) to func (result, a), func (result, a, b), and func (result, a, b, c), respectively.  For many functions, I think this will let us avoid unnecessary copies.","Got negation and division working with proper derivatives.  Also some opportunistic cleanup.","Left out some deriv cases for sub and div.","Add some 'const &' as should always have been.","Derivs: sin, cos.","Adjusting svn:ignore for build outputs and project settings","Make user functions work in OSL compiler.  I'd been putting this off, but obviously it's key to making OSL usable.  Works fine now except for two cases: (1) output params that are passed as individual vec/col components or array elements (they need extra code generated to write the results to the correct place), and (2) functions that return conditionally, which generate the right code now but won't execute properly until break/continue are implemented properly.","Subtle bug fix: When we were selecting a single vec/color/matrix component, we botched the generation of the new type that described the component by correctly setting its aggregateness to SCALAR but forgetting to clear any vector semantics (should have set to NOXFORM but instead would leave it as COLORXFORM or POINTXFORM or whatever).  This was a mostly silent error, except that then this incorrectly-constructed scalar would not compare properly to a \"real\" scalar.","Make function calls work properly in the case where output params are passed as individual triple/matrix components or array elements.  Now their return values are put in the right place.  (It's correct now, but for maximum efficiency I want to come back to this issue and only do the extra work for function arguments that are actually writeable.)","svn ignore test output","Add the ability to have \"site\" extra make settings, use it to get clean compiles at SPI.  Also fix other little things in the code leading to compilation errors on Linux at SPI. References: trac#1  http://reviewboard/r/458","Add -Wall and -Werror to compile flags (trac#8) Fixed associated warnings","For SPI, grab OIIO from SpComp2 if the IMAGEIOHOME env variable is not set.","Refactor ClosurePrimitive: make CP the base class, with BSDFClosure and EmissiveClosure subclasses. References: trac#9  http://reviewboard/r/464/","fix for boost problem due to  compiler warnings","adding user-definable OpenImageIO namespace","Bug fix -- wasn't initializing the 'false' case runflags for varying 'if'.","In all the testsuite run.py scripts, change exit() to sys.exit().  Older versions of Python crashed the old way.  Also eliminate redundant (but surely harmless) imports of sys.","Change prim_map from statically-constructed to a pointer.  This solves construction-order madness.","Improvements to the closure API Implemented the diffuse, transparent and phong closure primitives Added opcodes to handle the creation of transparent and phong closures Added unit tests for phong and transparent","Add ClosureColor methods that allow access to the individual primitive component data.  See http://reviewboard/r/475/","Have ShadingSystem ctr take an ErrorHandler* (which, if the default NULL is passed, will just use the default EH that echoes to console as it always did).  All stdout and sterr from ShadingSystem has been converted to go through the EH.  This should allow Arnold to subclass EH in a way that forwards the messages to the appropriate Arnold error logging routines, and pass that handler into the ShadingSystem. See: trac#10  http://reviewboard/r/469/","Refactor emissive closure API to match BSDF closure conventions Add basic closure for uniform emission Add \"emission()\" keyword and opcode to compiler / interpreter Add unit tests to make sure new keyword is working","Some minor compiler fixes: avoid unnecessary copies for typecasts, better selection of polymorphic functions by return type, fix problem with arg lists of texture operations.","When testsuite outputs are images, compare their pixels with idiff, not their bytes with diff (which is awful for images, since dates or other metadata may be different).","adding OSL_NAMESPACE to this file","Implementing cellnoise opcode (trac#14) Testsuite now looks at IMAGEIOHOME when running idiff","Add slash for those of us whose IMAGEIOHOME doesn't contain a trailing slash","Implement texture() op.","oslc: better error message when shader parameter does not have a default initializer. References: trac#17  http://reviewboard.spimageworks.com/r/486/","First pass at implementing noise and snoise operators (trac#14)","Fixup svn:ignore property for these new tests and remove accidently committed files","Texture: add optional wrap/swrap/twrap, firstchannel, fill arguments.","Adjust svn:ignore","Update noise and snoise to compute derivatives when needed (trac#14) Optimize gradient hash for color noise to split a 32 bit hash among the three components instead of hashing three times Update color noise reference images from the hash change","texture(): add support for optional \"alpha\" parameter. References: trac#12, http://reviewboard/r/492/","Cleanup binary_op guts and clarify the comments on how derivatives are supported","Supress multiple (per point) empty texture error messages. References:  trac#24   http://reviewboard/r/495/","Implement pnoise and psnoise with derivative support (trac#14)","Corrected reflection bug in PhongClosure","Have the shader-setting routines (Shader, ConnectShaders, ShaderGroupBegin, ShaderGroupEnd, Parameter) all return a bool for error status, and beef up a few of their error messages.","Update the scaling of the perlin noises to return values in [-1,+1] (trac#14)","Apply Chris Foster's recent OIIO enhancement to the Makefile -- faster trivial rebuilds because it doesn't have cmake unnecessarily rebuild the make files.","Rename params of 'assignable' to make it more self-documenting.","Reduce unnecessary console output to only happen in DEBUG mode.","Comment out global shader var that don't look like we'll be using them.","changing default namespace for OSL (trac#1574)","Adding ward, microfacet_ggx and microfacet_beckmann closures (trac#3) Added some helper functions to compute fresnel coefficients","Fix handedness issue that would flip the meaning of T when building the orthogonal vectors","Get rid of the 'deltau' and 'deltav' functions.  We're sticking to Dx, Dy for our main derivative routines.","Check in a built version of the OSL language spec.  Also modify the build so that this file is copied to the dist/ARCH/doc area.","Implement ConnectShaders. Also add --layer and --connect options to testshade so we can easily test it. Refs: trac#13   http://reviewboard.spimageworks.com/r/503/","Add pdf to svn:ignore","Get basic shader layer connections working in bind().  Doesn't handle partial connections yet (element to element or component to component), but \"whole\" connections appear to work! References:  trac#13    http://reviewboard.spimageworks.com/r/507/","Implement calculatenormal, area, and filterwidth opcodes (trac#30)","Set up directory for \"standard\" OSL shaders, rules for compiling them and copying them to the distro.","Oops, bad cut and paste error","Automatically find flex binary that works Never build against the OpenImageIO SpComp2","svn:ignore","At shader load time, have the master take note of the symbol indices for P and N.  Add simple public method to ShadingExecution that lets a shadeop retrieve a pointer to these symbols without any searching. We can augment this later for other globals, as needed.","adding oslconfig.h and export.h to the distributables list","Matte shader was missing Cs","Fix little typo that was preventing the beckmann closure from working","fixing compiling problems for 'debug' builds","Allow testsuite to set shader param values, using new --fparam, --iparam, --vparam, --sparam options. Also a variety of fixes to bugs and unimplemented bits in processing shader parameters. References: trac#33  http://reviewboard.spimageworks.com/r/515/","Adding emissive shader to the base set","Added a spot-like capa rently.","Avoid possible assertion inside is_floatbased() introduced in r359","Get derivs working correctly for compassign and compref. trac#51  http://reviewboard/r/555/","Bug fix: wasn't allocating the right amount of heap space for shader params that have derivs.  http://reviewboard/r/562/","adding more trigonometric derivatives","Preventing the sqrt() of a negative number in Ward that was causing #52","Bug fixes -- botched arg order on several memset calls. http://reviewboard/r/565/","Implement derivative computations for triple(a,b,c) and for vectriple(space,a,b,c). trac#51  http://reviewboard/r/566/","Closure labels class and API updates","Add shaders/stdosl.h, auto-include it when parsing osl input, put all the math constants described in the spec here. Refs: trac#56  http://reviewboard/r/563/","Forgot to check in new ref output.","Avoid oslc warnings during tests by copying the stdosl.h to build/ARCH/shaders","Remove extra files generated by tests, if the test passes.  If the test fails, leave them around for postmortem analysis.","fixing compile problem with older versions of boost","Removing dNdx and dNdy from the shader globals (arnold trac http://softboss/trac/arnold/ticket/1596)","Added isTransparent method to BSDF closures","Full implementation of &&, ||, and !, including short-circuiting. trac#57  http://reviewboard/r/573/","Added an additional label for transparency","Add texture derivatives (trac#22)","Remove Oi (trac#65)","Replace ParamRef with OIIO's ParamValueList so that pending params are copied rather than just recording pointers.  This makes calling ShadingSystem::Parameter() truly \"fire and forget\". trac#64  http://reviewboard/r/580/","Remove Oi references from the non-discussion parts of the spec document.","Implemented format, concat, error. http://reviewboard.spimageworks.com/r/595/","Implement basic reflection, refraction and dielectric closures (trac#3) Add basic glass shader","Implementation of gettextureinfo().  Also fix compiler-side type checking thereof.  See trac#67  http://reviewboard/r/607/","This patch allows you to assign =0 or =0.0 to a closure color and make it legal and understood to mean \"clear the closure\".  Also make sure we don't crash in various ways for closure params. Related to trac#68 http://reviewboard/r/611/","Allow and make use of \"triple constants.\"  Also, with respect to trac#70, make sure that shader params that are triples and constructed from 3 float literals are intialized properly rather than strictly needing \"init ops.\" http://reviewboard/r/612/","Update spec: bring it in line with the closures we actually implemented.","adding the following derivative operators:    log(x), log(x,y), log2(x), log10(x), exp(x), exp2(x),    expm1(x), pow(x,y), erf(x), erfc(x), sqrt(x), inversesqrt(x),    atan2(y,x), min(), max(), mix(), clamp(), hypot(x,y) and    hypot(x,y,z)","Adding ray differential support to closures (trac#69)","Switched back to only returning SINGULAR label from Transparent","Added the BACKGROUND label and changed TRANSPARENCY label to STRAIGHT","adding smoothstep derivative","Use more precision when outputting float literals to .oso files.","Implement the version of texture() that is passed explicit derivatives rather than implicitly taking them of s,t. trac#20  http://reviewboard/r/620/","Update refs after recent precision improvement.","adding derivative support for the following vector ops:   dot(), cross(), length(), normalize(), and distance()","Renaming leftHanded to flipHandedness in the globals","Move the guts of write_oso_formal_default (now gone) has into ASTvariable_declaration::param_default_literals, because we needed the same logic in multiple places.  We then use this to figure out which shader params can get away with constant/literal initializers, and suppress output of initialization ops for those params. Refs: trac#78  http://reviewboard.spimageworks.com/r/630","Switch to new labels representation","Implementation of transform(space,t d/r/699/","Fix microfacet closures (trac#101)","Change fresnel term in reflective closures to use the dielectric formula, parameterized by IOR (trac#105) Remove fresnel_schlick helper function to avoid confusion","Add derived files to svn:ignore for recently added tests","Refresh docs with explanations of getattribute for array elements, and new eta parameter to certain BSDFs (replacing Shlick R0).","First steps of struct implementation.  This gets us as far as declaring structs, assigning to their member fields, retrieving from their member fields, and assigning one whole struct to another (of identical type). Refs:  trac#55  http://reviewboard/r/707/","westin retroreflector and ashikimin shirely microfacet velvet models","trying to undo my swift commit before going thru code review","Reverting accidental commits","Part 2 of OSL support of struct: We can now declare struct parameters to the shader, and properly initialize them with { } syntax (like in C).","Add new global 'Ps', helpful for light attenuators. trac#106  http://reviewboard.spimageworks.com/r/726/","Implementing support for two sided closures (eval only for now) (trac#96)","Change all #include <ImathStuff.h> to #include <OpenEXR/ImathStuff.h>.","Fix failing type constructor 'int (int)'. http://reviewboard.spimageworks.com/r/728/","Beef up struct tests -- turns out that the code already works to pass individual struct elements to functions as arguments, even output args.","Make sidedness work for indirect rays (trac#96) Improved warnings for typos in token/value lists for closures and texture","adding support for user-data on geometry user-data (trac#115)","Adding translucent closure (trac#96)","Add derived files to svn:ignore for recently added tests","Add support for custom labels","Fixes necessary to pass whole structs as arguments to user functions in OSL. (trac#55) Clean up inconsistencies in the way I was mangling the names of struct fields.  Fix copy-construction \"Astruct a; Astruct b=a;\".  Also, address trac#110 by type-checking user functions when they are created, not when they are called. http://reviewboard.spimageworks.com/r/737/","Change the name mangling convention for structure fields to actually use '.'. http://reviewboard.spimageworks.com/r/741/","Added background closure","Added forgotten background.cpp file","struct -- make it work with liboslquery / oslinfo. http://reviewboard.spimageworks.com/r/745","struct -- get ConnectShaders working with whole struct parameters as well as individual fields.  Yay! trac#55 http://reviewboard.spimageworks.com/r/751/","Fix problem where struct fields that were closures could not be initialized using the \"=0\" convention. trac#117   http://reviewboard.spimageworks.com/r/752","Added swap method to ClosureColor (stl semantics)","Change transparent typecheck line to accept labels","fixing crash with rebinding shaders (trac#39 and trac#63)","Fix static initialization fiasco problem with TypeSpec::m_structs. trac#120  http://reviewboard.spimageworks.com/r/762/","fix for user-data barfing all over neighboring symbols in the symbol table (trac#122)","Add derived files to svn:ignore for recently added tests","restrict search-range to valid layers when looking up a symbol","cleaner solution to r467 (trac#123)","Removed surface label from Labels","this fixes a previous fix (r465) for trac#122","Update ref image... something changed recently that flipped LSBs in two pixels.  Harmless.","Renaming and lots of comments make \"rebindable\" logic more clear. http://reviewboard/r/768/","Adding BSSRDF closure type (trac#6) Adding a simple cubic BSSRDF which matches Arnold's original subsurface implementation","Fix crashes that occurred during ConnectShaders that happened if the layers mentioned named shaders that were never found. http://reviewboard/r/776/","Revamp the whole \"rebindable\" issue, which we decided had a latent thread safety bug.  Now we don't consider the dangling pointers at all, but rather have a globally unique ID in the instance, which we compare. http://reviewboard/r/768/","Ensure thread safety for the lazy calculation of heap size in ShaderInstance and ShadingAttribs.  This is responsible for the multithread bugs of trac#124, possibly others. http://reviewboard/r/777/","One additional fix forgotten by the last commit -- address multithread bugs in heap size computation.  http://reviewboard.spimageworks.com/r/784","Add OBJECT label (needed by SSS)","Properly track that the optional \"alpha\" parameter to texture routines are WRITTEN.  Trac#100.  http://reviewboard.spimageworks.com/r/796/","Typo","westin velvet and ashikhmin velvet closures","Touch up the spec before mailing out to some folks who've been asking for it.","Added the new function surfacearea()","Hair diffuse and specular closures","Document the new surfacearea() function and how it should be used in conjunction with emission(). Modify the emitter.osl shader to remove parameter Ke and instead have a \"power\" parameter. http://reviewboard.spimageworks.com/r/805/","Changed hair_specular to take phong like exponent","Add derivative support to the absolute value opcode (trac#137)","Ternary ops (such as clamp(a,b,c)) could sometimes loose the derivatives in the result (trac#131)","Derivative tracking, part 1: compiler side. * In typechecking calls to built-in functions, make note of which args will   have their derivs taken inside the shadeops. * When generating the code for those ops, mark the opcode with this info. * Dependency analysis figures out which symbols depend on which other symbols. * For each symbol, output %derivparam to mark parameters that we know need   derivatives, based on what's in this shader. * For each global or param, output %inputdep to list all the other   globls & params that it depends on.  This will be used by the runtime   to backpropagate derivativeness -- if our output X is used as an input   to another shader node's input Y, and Y needs derivatives taken, the   runtime will infer that our X (and all its dependencies) also need derivs. Refs: trac#128   http://reviewboard.spimageworks.com/r/808/","Add #include that was needed for older gcc.","Coalesce temporaries.  Also miscellaneous fixes to variable lifetime analysis (where loops are concerned) and which dependencies we need to report for derivs. trac#127   http://reviewboard.spimageworks.com/r/814/","Comment","Refactor closure eval method to indicate which side the surface is being viewed from (trac#139) This allows us to remove the absolute values from the BSDF evaluations which were creating problems with high bump values","Adding derivatives to luminance() (trac#140)","Bug fix: aref was asserting exact type matches, but in light of temporary coalescing, it needs to be just an equivalence test. trac#141  http://reviewboard.spimageworks.com/r/844/","Make derivs propagate correctly with aref and aassign. trac#143  http://reviewboard/r/851","Evaluate shader layers within the group lazily -- only run the shader layers that write to global vars.  Extra \"useparam\" ops are inserted by the compiler before use of params, and the implementation of that op is to execute earlier layers as needed if that parameter is a connection. trac#121  http://reviewboard/r/848/","- add extra warnings when setting parameters through the   ShadingSystem interface - prevernt assingment of output closure parameters trac#148","Optimizations: (1) Smartly replacing the memset that clears shader mem with only the byte count we actually need (not the biggest mem ever) is a big speedup -- 5-8x or more!  (2) Replace the vector copy with a memcpy (which is safe, and faster). Also add a bunch of stats a la trac#146.  Not everything is added yet, but this is a start. http://reviewboard.spimageworks.com/r/858/","Bug fix to run_connected_layer -- was using the number of allocated exec layers instead of the number being used. Also refactored bind_connections/bind_connection to remove redundant looping.","checking in first attempt at cloth BSDF","Fix warning about uninitialized variable","Split westin_velvet into westin_sheen and westin_backscatter (trac#144) Normalized the energy response of the westin_* closures Normalized the energy response of the ashikmin_velvet closure","No longer zero out shader heap memory by default.  Instead, it's optional, set by attribute(\"clearmemory\",int), and defaults to 0.  This speeds up by 2x on some tests! http://reviewboard/r/863/ There's a corresponding Arnold change to expose this option.","Fix incorrect DASSERT -- there are really 4 args (including return value) to substr.","Added phong_ramp closure","Refactor and beef up the ASTvariable_declaration typecheck and codegen methods (and some auxiliary fixes to support this). This allows the full range of operations involving structs that have elements which are themselves arrays.  In particular, nested {} compound initializers can initialize array elements within a structure field. Also added new tests to more thoroughly test this as well as error checking for illegal activities related to structures. Refs:  trac#129  http://reviewboard/r/867/","Add #defines in oslconfig.h that establish version numbers for the library and (separately) for the .oso format.  Make oslc output the oso version on the first line (replacing a FIXME) and in a comment say which version of oslc compiled it, and make liboslexec correctly parse this and stash the major and minor versions in the oso loader.","Fix OSL_MAKE_VERSION_STRING2 -- shouldn't have the parens.  Wasn't broken yet, but clearly will be wrong for some uses.","Implement setmessage & getmessage. Refs:  trac#61   http://reviewboard.spimageworks.com/r/871/","Be careful not to output dependency hints that include long lists of temporaries that, due to temp coalescing, didn't even exist any more. This was causing bloated oso files that took too long to parse. http://reviewboard/r/872/","latest cloth closure updates","Fix OS X compiler warnings about unused vars in compute_AC.","Add missing copyright and license to the bsdf_cloth source files.","Change all refs to environment variable $IMAGEIOHOME to $OPENIMAGEHOME.","Enhance docs before open source release.","testing commit email","testing commit notification","commit messages work now, reverting file back to original state","Make setmessage/getmessage work for closures, which were previously not allowed to be messages.","Fix bug introduced with r507 when I overhauled compound initializers in ASTvariable_declaration.  Forgot one place where they needed to be handled. http://codereview.appspot.com/189060","Everyplace else we switched the code label for the main shader to \"___main___\". Here was one holdout that didn't match.","Fix spelling typos in the docs.","Beef up 'message' testsuite to verify that array messages work properly (as suggested by Chris in an earlier review).","Added figures for light path expression whitepaper.","Make mod() compute derivatives.","Fixed typo in 'metadatum' grammar node that used an uninitialized value.","Typo fixes in docs. Patch by: blair","Added derivatives for I in shader globals","Implement microfacet_ggx_refraction() and microfacet_beckmann_refraction closures (issue 38)","Implement isshadowray() and iscameraray(). Review: http://codereview.appspot.com/186244/show","Error message for an illegal connection type, not an assertion. Review by: Chris Kulla","Clearing closures must still keep them varying (http://codereview.appspot.com/194062/show) Removed unused uniform codepath from closure clear and assign","Legal says we should use the \"Inc\" in the company name on the BSD license copyright notice.","Left out initialization of 'surfacearea' shader global.  Add it so that 'testshade' may be used to test shaders that call it.","One more copyright notice to fix the company name.","Replace boost::starts_with, which seemed to attract spurious crashes when debugging, with my own implementation that doesn't crash.  It's possible that the boost crash was a symptom of a stack corruption elsewhere, not really anything wrong with starts_with, but I'm just tired of spinning my wheels on this red herring. Review by: ckulla","Bug fix: we never set the master's \"maincodebegin\" and \"maincodeend\" members, unless there actually was main code.  The occasional shader that just shuffles input parameters to output parameters, and has no \"main\" code, could result in all sorts of chaos. http://codereview.appspot.com/193098/show Review by: ckulla","Refraction and dielectric closures were missing varargs for custom labels (http://codereview.appspot.com/193099/show)","Refactor \"bind\" to simplify the handling of globals, and set up infrastructure for eventual \"rebind\" optimization, including tracking the statistics on it and allowing an option to enable/disable. Also bug fix (exec.cpp:309) -- zero out local strings, the one place where uninitialized values in the heap can crash the renderer. http://codereview.appspot.com/195042/show Review by: ckulla","Fix a very subtle bug in shaders that have params whose default values are expressions that need to be evaluated at runtime (\"init ops\") -- because we ran the init ops when binding, the lazy execution of layers was setting the uniform/varyingness of the downstream connection BEFORE the upstream value was assigned (which could change it from uniform to varying).","If you called context->execute() with a \"sparse\" set of runflags (such as if you were picking the subset of a set of rays that hit objects with the same shaders), it would use those runflags for any unconditionally-run layers, but lazy layer evaluation was done with all points on, which is very wasteful for sparse run sets.  This change records the top-level original runflags passed in, and uses those runflags when running upstream layers lazily. http://codereview.appspot.com/194117/show Review by: aconty Review by: ckulla","Bug fix: we weren't marking the conditional state argument to while/dowhile as read-only, so we would get a \"can't write to a constant\" error when doing something totally reasonable such as 'do {...} while(0);'","Fixed a missing sqrtf in beckman's sample function","This change allows a debug mode (set by attribute(\"debugnan\",1)) that checks every value written by each instruction, and if any nan or inf values are found, issues a warning pointing to exactly which shader source line it happened on.  It's quite expensive, nobody should use it for ordinary rendering, but it's real helpful if you are trying to debug NaNs in your renderer, this will quickly narrow it down to the particular instruction. http://codereview.appspot.com/194142/show Review by: ckulla","Improve the warning issued when nans are discovered -- include the shader affected, not just the source line (since code in headers may be used in many shaders).","Fixed pdf's for westin closures","Expand \"debugnan\" checking to include the binding step, to catch any bad values passed into the shading system or interpolated on the geometry. http://codereview.appspot.com/196066/show Review by: ckulla","Patch to NaN checking -- was incorrectly checking closures.","microfacet_ggx_refraction was missing the \".\" for varargs support","adding runflags to RenderServices::has_userdata() callback","This change introduces a new option \"lazyglobals\" (default=false), that if true means that writing to global variables is not enough to force unconditional execution of a shader layer.  Also, instead of just the last layer being run unconditionally, any layer that is a \"root\" node (having no connections to downstream layers) will be executed unconditionally.","Extend the inf/nan checking to also check (and print specific messages for) derivatives.  Also, fixed two bugs: for arrays, would only have checked the first element for inf/nan; when checking in bind, do NOT check (uninitialized) local and temp values. http://codereview.appspot.com/199063/show Review by: ckulla","Bug fix: In several string ops, I used a local var that just told whether any of the arguments were varying, to determine whether to assign to just the first element of Result, or all of them.  I should really have been checking whether Result itself was varying.  They could differ because the adjust_varying(Result) will make it varying even if none of the args are varying, if the instruction is itself inside a varying conditional. http://codereview.appspot.com/198076/show Review by: ckulla","Fix bug in getmessage when all args are varying but the op occurs in a varying conditional.","Fixed a bad reference to closure messages","Add '-E' option to oslc -- just echo preprocessor output. Issue: http://code.google.com/p/openshadinglanguage/issues/detail?id=32 Review: http://codereview.appspot.com/201057/show Review by: ckulla","Change the closure ops to use asserts instead of adjust_varying since all closures are forced to be varying","Force set/getmessage to be varying all the time","cloth specular bsdf and related files","adjust_varying was maladapted to \"sparse batches\" that naturally occur with secondary rays, using !all_points_on() to force varyingness even for uniform operands.  But this is incorrect, what we really care about is whether the original top-level run state has diverged (regardless of whether it ever was in an all-point-on state.  This fix directly tracks whether the conditional state has caused divergence, and bases the test on that.  With it, we are seeing at least a 25% speed improvement in rendering overall, and new stats we added to reveal the workings of adjust_varying confirm that we are keeping (or making) things uniform much more often than before. http://codereview.appspot.com/204046/show Review by: ckulla Review by: solomon.boulos","Fix off-by-one error in check_nan Report which symbol and which point are nan after opcode checks Avoid giving a valid heap address to symbols that should not be used (such as struct symbols)","Bug fix: print error if user passes the wrong type to a function output parameter (for output params, function argument type coercion is not ok). http://code.google.com/p/openshadinglanguage/issues/detail?id=51 http://codereview.appspot.com/204076/show Review by: ckulla","Document sincos()","Typo","Add sincos opcode (code review: http://codereview.appspot.com/205045/show)","Fix order-of-arguments problem that could cause crash -- need to test 'form' before accessing form->blah.","Fix a potential bug with array assign operator: the derivatives of the entire array could be cleared even when writing to only a single entry","Hair closures need to return Both from get_light_side for backlighting to work correctly","This change makes binding just as lazy as execution.  We had already been executing shader layers lazily (only as params are \"pulled\" from downstream shaders), but we started by binding all layers up front. Profiles were showing that bind time was very significant.","adding spline operation and associated tests","Fix compiler warnings and bug, as suggested by c42f and crunchvfx. http://codereview.appspot.com/193074 http://codereview.appspot.com/209049 http://code.google.com/p/openshadinglanguage/issues/detail?id=55 Review by: c42f","Bind parameters individually as they are needed (as revealed by the 'useparam' instruction), which is even more efficient than binding when the shader is run, since some params (and hence their init ops or geom lookups) won't ever be used, depending on the code path taken.  This seems to speed up our production scenes by about 10%.  This optimization was suggested by Chris Kulla.","Massive change to replace runflags with a compile-time choice (in oslconfig.h) between runflags, individual indices, and index spans.  We really, really thought that indices or spans would be much faster than runflags, but I've been unable to demonstrate that on real production frames now that I'm able to try all three -- they all take the same time (within experimental accuracy).  I don't , f/i, i/f, v/f, f/v) * Make neg constant fold for int as well as float * Folding for assign -- turn A=C into nop if A is known to already have   the same value as C at that spot. * Array reference a[i] can be constant folded even if i is not a constant   in cases were all elements of a[...] are known to be the same value. * Move the code that optimizes component assignment into its own   constant-folding routine (this necessitates passing block_aliases to all   CF routines). * bug fix (line 1498): mark as not connected when we do this operation   that potentially removes connections. * Separate the invalidation of block aliases for written args from the   de-aliasing of read args.  In particular, the invalidation should happen   after the constant folding, not before.  This oversight was preventing   A=A+C (and similar constructs) from constant folding, because the FIRST   thing it did is (prematurely) decide it didn't know A's value.","Refactor cluttered runtime optimization into a RuntimeOptimizer class. http://codereview.appspot.com/1088041/show Review by: ckulla","New runtime optimization: Track which messages are set by setmessage(), including if a non-constant named message is ever set (could be anything).  Then for getmessage() of a known name, if it couldn't possibly have been set, turn the getmessage into simply an assignment of 0 to the result (not found).","testshade should properly initialize dPdu and dPdv.","This patch is analogous to r1502 submitted to the OpenImageIO project:   - move build and distribution definitions in the makefile so that     the 'platform' variable can be set inside a site specific     Makefile-bits.  We (SPI) find this handy so that developers can     have multiple builds for different linux platforms in one OSL     checkout directory.","A few things for us SPI folk:    - give different linux setups here at SPI different      'platform' names (rhel40m64 and spinux1) so that we      can have multiple builds in a single OSL checkout      directory.    - some clean-ups","pow() beef up to handle overflow without generating Inf. Review by: ckulla http://codereview.appspot.com/1123041/show","Build fixes for SPI: the changing of expected OIIO and OSL namespaces should only happen on Linux. http://codereview.appspot.com/1176042/show Review by: ckulla","Runtime optimization: constant folding of pow(). http://codereview.appspot.com/1124041/show Review by: ckulla","Additional runtime optimizations and bug fixes.","Added light expression support (issue#1158042)","Compile fixes for gcc on linux in LPexps","Fix broken build with gcc 4.4+","Initialized merge tracking via \"svnmerge\" with revisions \"1-637\" from https://openshadinglanguage.googlecode.com/svn/branches/TRY-llvm","Merged revisions 669 via svnmerge from https://openshadinglanguage.googlecode.com/svn/branches/TRY-llvm","Never documented warning()","Implement the ternary operator (?:) long-lost codegen for oslc. http://codereview.appspot.com/1701044/show Review by: ckulla","Updated ref output that's been broken for some time (but just the ref; the functionality was fine).","Alter the OSL grammar slightly to allow function prototypes.","Switch to single opcode closures (issue1667054)","Added genclosure.h to public headers","Merged revisions 638-668,672-678,680-687,690-726,728-730,733-744,746-747,749-753,755-784 via svnmerge from https://openshadinglanguage.googlecode.com/svn/branches/TRY-llvm","fix a minor bug which prevented OSL from building on systems without LLVM installed","Fix displacement broken by the recent merge by copying out P and N correctly for the interpreter, as we do for the LLVM path, so that the renderer on the other end can count on it working the same whichever way is in effect.","Important bug fix from the displacement fix -- when not in LLVM mode, unbound layers could dereference null instance pointer.","Update ref outputs.","Closure merging for external ones (issue#1876042)","Bug fix copying displacement values (again) -- only find the symbol if the layer was bound.  Bound implies a valid shader instance pointer, but not the other way around. Review by: cstein","Component indexing wasn't creating the necessary temporary if the types didn't match.  This caused the wrong code to be emitted for something like this:  \"int i = (int)P[0];\" Review by: ckulla","Update path to LLVM for spinux (spi only) Disable LLVM on centos (spi only) Hardcode path to llvm binaries (llvm-g++, etc ...) to be inside ${LLVM_DIRECTORY}/bin","New arrangement of LLVM optimization passes that approximately doubles performance of the resulting code.  This is still a work in progress, so it's pretty sloppy looking.","Removed the sidedness tag from closures (issue#1854047)","Ensure that the testsuite gets run with the OPENIMAGEIOHOME environment variable set so that idiff can be run to compare images","Revert back to a set of optimizations that no longer crashes.  We will start building up again from here.","Fix arg types mismatch in noise call (issue1976041)","Re-enable the doInitialization/doFinalization on pass managers, and also remove the (allegedly?) redundant optimization of the last function in the group.  This combination appears to squash some intermittent crashes we were seeing, or at the very least seems to make them significantly more rare (going from crashing in about 1/20 of testsuite tests, not the same ones every time of course, to running a few hundred tests without a crash).","fixing Hermite basis and updating the spine-test image files","To fix apparent safety issues with reusing LLVM Module/ExecutionEngine for multiple shading groups (crashes inside the generated code), we now share a module but create a new EE to JIT each shader group separately.  Just let them leak for now. More explanation at http://codereview.appspot.com/1981043/","Minor cosmetic fixes to the OSL stats","Minor LLVM-related fixes: Some more things I noticed during debugging, just cleaning up: some new assertions; things ingRef's in the TextureOptions to function-local (in the helper routine -- wrong level, too ephemeral!) memory, instead we need to use pointers to where the values really live more permanently. Review by: ckulla","Merge bind and execute methods on ShadingContext","Add hooks for client applications to manage their own \"thread_info\" objects to avoid the overhead of thread_specific_ptr and to be able to persist these objects across the creation and destruction of threads","Expose a version of ShadingSystemImpl::execute() that directly takes a SingleShaderGlobal rather than copying things around.  Only works when shading a single point, and with LLVM.  But for that case, avoids a lot of extra copying of shader globals, resulting in about 2-4% speedup in our renderer. http://codereview.appspot.com/2149041/ Review by: ckulla","Remove tracking of execution counts from release builds","Replace std::vector in ClosureColor (issue#2159045)","Replacing osl_memzero and osl_memcpy with the LLVM intrinsics.","Leaving a note about how this declaration will change in LLVM-2.8 (as we may cross that bridge in only a few weeks)","Some minor debugging scaffolding to support future work: when llvm_debug >= 2, dump the resulting bitcode for each group so it's easy to look at and analyze. Also some new optimizations: * Constant folding of min, max. * Move the code that set the \"this layer has run\" flag out of the layer   function and into the caller.  This lets us optimize some of the   layers down to nothing. * Make another runtime optimization pass, this time BACKWARDS (last   layer to first), which gives additional opportunity for optimizations   because when we're looking at a layer we already know if the   subsequent downstream layers have been optimized in such a way that   our layer's results are no longer needed. * Skip setting initial values of unused parameters. This results in a modest additional speedup, but mostly it's WIP as I clean up and optimize the result IR.","Always print an info message when reading an oso file for the first time (along with timing information)","Minor timer class cleanups","Modify code generation for \"result=closurefunc()*scale\" and \"result=closure1+closure2\" to avoid extra temporaries, copies, and clears.","A collection of minor optimizations and refactors to our runtime optimization and LLVM code generation: * Take many opportunities to discover when a layer can be elided -- if   it already was marked to run lazily and no longer has any outgoing   connections that are used -- and skip further processing on that   layer.  We stop doing runtime optimization passes on it, generate no   IR for it, etc. * The array that stores the flags for whether each layer in the group   has been run is changed from int32 to int8 (change to a bool), we only   store flags for layers that may possibly run (not those elided away),   and we do the initial clear with a memset intrinsic rather than   setting the flags individually. * Eliminated the need to store and initialize most constant values as   separate symbols, instead using their values directly, or in the rare   cases where a pointer is needed, using the raw pointer to those values   in the instance rather than copying it onto the stack. * Many times during runtime optimization of LLVM IR generation, we   looped over all symbols in an instance, only caring about parameters.   I've changed those loops to traverse only between firstparam and   lastparam, not the whole symbol table.nnn * No longer clear all the closures up front before executing the shader   group -- instead, clear each one individually inside   osl_closure_allot.  That at least ensures that a layer's closures are   never wastefully cleared if the layer turns out not to execute. * Improved some debugging messages and changed them from #ifdef DEBUG to   happening anytime llvm_debug >= 2. * Refactored the tricky memset/memcpy code into their own functions,   which will make it easier to adapt to the upcoming LLVM 2.8 changes.","Bug fix to llvm_load_value: Forgot to handle matrix constants properly.","Tree based closures (issue#2205041)","FOREACH_PARAM replaces more awkward idiom repeated many times.","Bug fix with the way we set up firstparam/lastparam. Aside: now we have lastparam as \"one past the last\", so it works in the usual STL-like way.","Minor cleanups:   * avoid printing %depends metadata in oso files as these can be quite large for big shaders and are recomputed during runtime specialization anyway   * avoid counting the number of closure symbols required by a shader group as this information is no longer used Code review by Larry Gritz: http://codereview.appspot.com/2182044/","Added holdout and debug closures","Make closure params optional","Refactor recent closure changes to make more C++ like and add comments. http://codereview.appspot.com/2226044/","Use static ustrings to speedup track_variable_lifetimes.","Replacing std::map usage with hash maps to remove ustring::compare calls at lookup.","Move closure declarations to stdosl.h (issue#2221043)","Add key attributes to ClosureComponent (issue#2216048)","Make shaders depend on stdosl.h and install it along with the shader source and objects.","Fix recursive invocations of make to pass through options like -j correctly","Removing old interpreter","Updates to build with either LLVM-2.7 or LLVM-2.8","Fix uninitialized fields in FunctionSymbol.  Was leading to incorrect oso generation on Linux (but, oddly, not OSX). Review by: aconty","Further simplification of the API now that the interpreter is gone: Removed the batch oriented globals in favor of SingleShaderGlobal which has been renamed to ShaderGlobal Avoid double user-data lookups in LLVM queries Modify testshade to work a single point at a time avoid take advantage of the thread_context pointer","Fixing warnings found by clang in OSL's \"exposed\" headers including making boost::regex a forward decl only.","Fix functions that should be returning voi tant folding of format, for the special case of just one \"%s\". * Improved or clarified comments. * Lots of debug output going to cerr that weren't really errors, now   going to cout.  That makes it easier to redirect/tee when looking at   the debugging help.","Refactor ShadingSystem::getattribute, fix the type for the \"searchpath:shader\", and make it so that the most helpful statistics can be retrieved directly with getattribute.","Runtime constant folding: dot, floor, ceil, i=fconst, triple=other_triple_const. Extend 'step()' to handle triple-typed arguments. Add .gitignore. Beef up comments. http://codereview.appspot.com/4092046/ Review by ckulla","Runtime optimization work: * Constant folding of int+int, int-int, int*int. * Constant folding of format, for the special case of just one \"%s\". * Improved or clarified comments. * Lots of debug output going to cerr that weren't really errors, now   going to cout.  That makes it easier to redirect/tee when looking at   the debugging help. http://codereview.appspot.com/4092046/ Review by ckulla","Wrong return type for this one.","Changes to adapt to recent OIIO class refactoring.","In case OSL does not have a matching datatype for a particular renderer attribute, then allow the user to pass in an array of values which the renderer would fill in appropriately.","Extend llvm_assign_zero and llvm_zero_derivs to handle arrays.","Rewrite llvm_assign_zero and llvm_zero_derivs in terms of llvm_memset, much simpler.  (Thanks for the suggestion, ckulla.)","Implement environment().  Depends on corresponding changes to OIIO. Also, we change the RendererServices to use single-point texture protocols.","Record when a ShaderGroup has collapsed into a does_nothing function.","Fixes to get clean windows compilation, courtesy of Brecht Van Lommel.",".gitignore additions to ignore temp files in testsuite","Add missing osl_texture_set_rwrap. Patch by: Brecht Van Lommel","Add missing docs for pointcloud_search","Miscelaneous typos, in
