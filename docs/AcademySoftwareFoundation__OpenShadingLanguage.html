// Orders activity rows by a table column (`key`: date, activity, person, or
// item) and `dir` ("asc" or "desc"). Ties go newest first.
PS.activityOrder = ({key, dir}) => {
  const {activity: A, kinds, docs} = PS.data;
  const text = {
    activity: i => KIND_LABELS[kinds[A.kind[i]]] || kinds[A.kind[i]],
    person: i => PS.personName(A.person[i]),
    item: i => (A.doc[i] < 0 ? "" : docs.title[A.doc[i]]),
  }[key];
  const sign = dir === "asc" ? 1 : -1;
  return (a, b) => sign * (text ? text(a).localeCompare(text(b)) : A.day[a] - A.day[b]) ||
    A.day[b] - A.day[a] || a - b;
};

// The sort after a click on column `key`: the same column flips; another starts
// with the largest or newest first when `descFirst` (Date by default), else A to Z.
PS.nextSort = (sort, key, descFirst = key === "date") => ({
  key, dir: sort.key === key ? (sort.dir === "asc" ? "desc" : "asc") : descFirst ? "desc" : "asc",
});

// The Date / Activity / Item table for activity rows, already ordered by `sort`
// ({key, dir}) and cut to length. A click on a header calls `onSort(key)`;
// `people` adds a Person column, for lists that mix several people. `groups`
// colors the dots.
PS.activityTable = (rows, {sort, onSort, people = false, groups = GROUPS}) => {
  const {activity: A, kinds, docs} = PS.data;
  const item = i => {
    const d = A.doc[i];
    return d < 0 ? "–" : PS.el("a", {href: PS.docUrl(d)}, docs.title[d]);
  };
  return PS.charts.listTable(rows, {
    sort, onSort, className: people ? "data activity with-person" : "data activity",
    columns: [
      {key: "date", label: "Date", order: "date", cell: i => PS.dayToText(A.day[i])},
      {key: "activity", label: "Activity",
       cell: i => [dot(groupOf(kinds[A.kind[i]], groups)), KIND_LABELS[kinds[A.kind[i]]] || kinds[A.kind[i]]]},
      people ? {key: "person", label: "Person", cell: i => PS.personName(A.person[i])} : null,
      {key: "item", label: "Item", cell: item},
    ].filter(Boolean),
  });
};

// The pane under a theme view: the activity behind a theme, or one of its heatmap
// cells, as a title with buttons, the total and keys, and a sortable table.
// Returns the nodes for `figure.details`. The sort and "Show all" live on `figure`;
// `extra` are buttons placed before Close, `rerender` redraws the view.
PS.themeActivity = (figure, {title, rows, extra = [], onClose, rerender}) => {
  if (!figure.sort) figure.sort = {key: "date", dir: "desc"};
  const mine = rows.slice().sort(PS.activityOrder(figure.sort));
  const limit = 50;
  const close = PS.el("button", {type: "button"}, "Close");
  close.onclick = onClose;
  const toggle = mine.length > limit ? PS.el("button", {type: "button"},
    figure.showAll ? "Show less" : `Show all ${mine.length.toLocaleString("en-US")}`) : null;
  if (toggle) {
    toggle.onclick = () => {
      figure.showAll = !figure.showAll;
      rerender();
    };
  }
  return [
    PS.el("div", {class: "details-head"}, PS.el("h3", {}, title), toggle, ...extra, close),
    PS.el("div", {class: "legend"}, PS.activitySummary(mine)),
    mine.length ? PS.activityTable(figure.showAll ? mine : mine.slice(0, limit), {
      sort: figure.sort,
      people: true,
      onSort: key => {
        figure.sort = PS.nextSort(figure.sort, key);
        rerender();
      },
    }) : PS.el("p", {class: "empty"}, "No activity matches the current filters."),
  ].filter(Boolean);
};

// `inPeriod`: the Overview's pane, limited to the open column. Otherwise the
// People tab's, whose rows ignore the left-out filter like its list does.
const pane = inPeriod => ({
  id: `${inPeriod ? "" : "people-"}activity`,
  title: "Activity",
  tab: inPeriod ? undefined : "people",
  order: inPeriod ? 20 : 30,
  noTable: true,
  projectKeys: [inPeriod ? "who" : "pwho"],
  render(figure, ctx) {
    const {data, state, set} = ctx;
    const rows = inPeriod ? ctx.rows : ctx.rowsExcept("people");
    const A = data.activity;
    const key = inPeriod ? "who" : "pwho";
    const person = PS.whoPick(state, key);
    const [kind, pickKey] = (state.pick || "").split(":");
    figure.root.hidden = person === undefined || (inPeriod && (kind !== state.period || !/^\d+$/.test(pickKey)));
    if (figure.root.hidden) return;

    const scheme = inPeriod ? PS.periodScheme(kind) : null;
    if (!figure.sort) figure.sort = {key: "date", dir: "desc"};
    const mine = rows
      .filter(i => A.person[i] === person && (!scheme || scheme.key(A.day[i]) === Number(pickKey)))
      .sort(PS.activityOrder(figure.sort));

    figure.root.querySelector(".head h3").replaceChildren(PS.personLink(person));
    const num = n => n.toLocaleString("en-US");
    figure.subtitle.textContent = scheme ? scheme.label(Number(pickKey)) : "";
    figure.subtitle.hidden = !scheme;
    figure.legend.hidden = false;
    figure.legend.replaceChildren(...PS.activitySummary(mine));

    const id = `${person}|${inPeriod ? state.pick : ""}`;
    if (figure.shownFor !== id) {
      figure.shownFor = id;
      figure.showAll = false;
    }
    if (!figure.close) {
      figure.toggle = PS.el("button", {type: "button"});
      figure.close = PS.el("button", {type: "button"}, "Close");
      figure.root.querySelector(".head").append(figure.toggle, figure.close);
    }
    figure.close.onclick = () => set(PS.whoToggle(state, person, key));
    figure.toggle.hidden = mine.length <= LIMIT;
    figure.toggle.textContent = figure.showAll ? "Show less" : `Show all ${num(mine.length)}`;
    figure.toggle.onclick = () => {
      figure.showAll = !figure.showAll;
      this.render(figure, ctx);
    };
    if (!mine.length) {
      figure.plot.replaceChildren(PS.el("p", {class: "empty"}, "No activity matches the current filters."));
      return;
    }
    figure.plot.replaceChildren(PS.activityTable(figure.showAll ? mine : mine.slice(0, LIMIT), {
      sort: figure.sort,
      onSort: key => {
        figure.sort = PS.nextSort(figure.sort, key);
        this.render(figure, ctx);
      },
    }));
  },
});

PS.registerView(pane(true));
PS.registerView(pane(false));

</script>
<script>
/* views/merge_times.js */
// View: time to merge. Stacked columns of the PRs merged each period, by how
// long they waited after being opened. Choosing a column lists its PRs,
// slowest first.

const MERGE_LIST_LIMIT = 50;

PS.registerView({
  id: "merge-times",
  title: "Time to merge",
  tab: "overview",
  order: 30,
  render(figure, {data, rowsExcept, state, set}) {
    const scheme = PS.periodScheme(state.period);
    const series = PS.metrics.MERGE_BUCKETS.map((b, i) => ({...b, index: i, color: `var(--ord-${i + 1})`}));
    // The date range picks PRs by the day they were merged.
    const lo = state.from ? PS.dateToDay(state.from) : -Infinity;
    const hi = state.to ? PS.dateToDay(state.to) : Infinity;
    const periods = PS.metrics.mergeTimes(rowsExcept("dates"), data, scheme, day => day >= lo && day <= hi);
    PS.markRangeCuts(periods, scheme, state);
    const faded = p => p.partial || p.cut;
    const nameOf = p => `${p.label}${faded(p) ? " (partial)" : ""}`;
    const days = v => (v === null ? "–" : `${v} ${v === 1 ? "day" : "days"}`);
    // Choosing a column lists only its slowest bucket's PRs (30+ days).
    const slow = series[series.length - 1];

    figure.subtitle.textContent = "How long do PRs wait before they're merged?";
    PS.fillHowto(figure, [
      `Each column: the PRs merged in that ${scheme.name}, by how long they waited after being opened, ` +
        "in whole days (UTC).",
      "The date range picks PRs by the day they were merged. PRs by bots, and PRs the project config " +
        "leaves out, aren't counted.",
      `Choose a column to list its PRs that took ${slow.name}.`,
    ]);
    PS.fillLegend(figure, series.map(s => ({...s, shape: "rect"})));
    PS.fillTable(figure, [
      {name: scheme.name[0].toUpperCase() + scheme.name.slice(1), value: nameOf},
      {name: "Merged", value: p => p.merged},
      ...series.map(s => ({name: s.name, value: p => p.counts[s.index]})),
      {name: "Median days", value: p => p.median},
    ], periods);

    // The open column is `mpick` in the URL, as `<period>:<key>`, so changing
    // the period closes it.
    const picked = periods.find(p => state.mpick === `${scheme.kind}:${p.key}`) || null;
    figure.details.hidden = picked === null;
    const toggle = p => set({mpick: picked === p ? undefined : `${scheme.kind}:${p.key}`});

    if (!PS.selectedKinds().includes("pr")) {
      figure.details.hidden = true;
      PS.charts.empty(figure, "PRs count as code activity; choose All or Code under Activity to see this.");
      return;
    }
    if (!periods.length) {
      PS.charts.empty(figure, "No merged PRs match the filters.");
      return;
    }

    const last = periods[periods.length - 1];
    const byKey = new Map(periods.map(p => [p.key, p]));
    PS.charts.columns(figure, {
      items: periods,
      key: p => p.key,
      tick: k => byKey.get(k).short,
      series,
      value: (p, s) => p.counts[s.index],
      total: p => p.merged,
      faded,
      labelSuffix: last.cut ? " (partial)" : last.partial && scheme.soFar ? " (so far)" : "",
      label: `Time to merge per ${scheme.name}. Arrow keys move between periods; the Table button shows the numbers.`,
      itemLabel: p => `${nameOf(p)}: ${p.merged} PRs merged, median ${days(p.median)}; ` +
        series.map(s => `${p.counts[s.index]} ${s.name.toLowerCase()}`).join(", ") +
        `. Press Enter to ${p === picked ? "close the list" : `list the PRs that took ${slow.name}`}.`,
      tooltip: (p, anchor) => PS.showTooltip(anchor, nameOf(p), [
        {name: "merged", value: p.merged},
        {name: "median", value: days(p.median)},
        ...series.map(s => ({name: s.name.toLowerCase(), value: p.counts[s.index], color: s.color})),
      ]),
      activate: toggle,
      picked,
    });

    if (picked === null) return;
    // The column's slow PRs, laid out like the activity panes: the title row,
    // a summary line with every bucket's count, and a sortable list (slowest
    // first) of the PRs in the slowest bucket.
    const A = data.activity;
    const rerender = () => this.render(figure, {data, rowsExcept, state, set});
    if (!figure.sort) figure.sort = {key: "days", dir: "desc"};
    const merged = p => A.day[p.row] + p.days;
    const text = {person: p => PS.personName(A.person[p.row]), item: p => data.docs.title[p.doc]};
    const number = {days: p => p.days, date: merged};
    const {key, dir} = figure.sort;
    const sign = dir === "asc" ? 1 : -1;
    const prs = picked.prs.filter(p => p.days >= slow.fewest).sort((a, b) =>
      sign * (text[key] ? text[key](a).localeCompare(text[key](b)) : number[key](a) - number[key](b)) ||
      b.days - a.days || a.doc - b.doc);
    if (figure.shownFor !== state.mpick) {
      figure.shownFor = state.mpick;
      figure.showAll = false;
    }
    const num = n => n.toLocaleString("en-US");
    const more = prs.length > MERGE_LIST_LIMIT ? PS.el("button", {type: "button"},
      figure.showAll ? "Show less" : `Show all ${num(prs.length)}`) : null;
    if (more) {
      more.onclick = () => {
        figure.showAll = !figure.showAll;
        rerender();
      };
    }
    const colorOf = p => series[PS.metrics.bucketOf(p.days)].color;
    figure.details.replaceChildren(
      PS.charts.detailsHead(`PRs that took ${slow.name} · ${nameOf(picked)}`, () => set({mpick: undefined}),
        more ? [more] : []),
      PS.el("div", {class: "legend"},
        PS.el("span", {class: "total"}, `${num(picked.merged)} ${picked.merged === 1 ? "PR" : "PRs"} · median ${days(picked.median)}`),
        series.filter(s => picked.counts[s.index]).map(s =>
          PS.el("span", {class: "key"}, PS.charts.dot(s.color), `${s.name} ${num(picked.counts[s.index])}`))),
      prs.length ? PS.charts.listTable(figure.showAll ? prs : prs.slice(0, MERGE_LIST_LIMIT), {
        sort: figure.sort,
        className: "data activity with-person",
        onSort: k => {
          figure.sort = PS.nextSort(figure.sort, k, k === "date" || k === "days");
          rerender();
        },
        columns: [
          {key: "date", label: "Merged", order: "date", cell: p => PS.dayToText(merged(p))},
          {key: "days", label: "Days", order: "count", cell: p => [PS.charts.dot(colorOf(p)), num(p.days)]},
          {key: "person", label: "Person", cell: p => PS.personName(A.person[p.row])},
          {key: "item", label: "PR", cell: p => PS.el("a", {href: PS.docUrl(p.doc)}, data.docs.title[p.doc])},
        ],
      }) : PS.el("p", {class: "empty"}, `No PRs took ${slow.name} in this ${scheme.name}.`));
  },
});

</script>
<script>
/* views/period_counts.js */
// View: contributors per period. Stacked columns of new / returning /
// continuing people (together: everyone active). Choosing a column lists its
// people under those three groups.

PS.registerView({
  id: "period-counts",
  title: "Contributors per period",
  tab: "overview",
  order: 10,
  render(figure, {data, rows, state, set}) {
    const gap = data.settings.return_gap_days;
    const scheme = PS.periodScheme(state.period);
    const periods = PS.metrics.periodCounts(rows, data, scheme, gap);
    PS.markRangeCuts(periods, scheme, state);
    const partial = p => p.partial || p.cut;
    const ranged = Boolean(state.from || state.to);

    figure.subtitle.textContent =
      `How many people contribute each ${scheme.name}, and are they newcomers, returners, or regulars?`;
    PS.fillHowto(figure, [
      `New: first activity${ranged ? " within the selected dates" : ""}. ` +
        `Returning: back after ${gap}+ days away. Continuing: everyone else.`,
      `Last seen (hover, table): people whose final activity is in that ${scheme.name}; ` +
        `unknown for the last ${gap} days, since recent people may return.`,
    ]);

    const series = [
      {id: "new", name: "New", color: "var(--series-1)"},
      {id: "returning", name: "Returning", color: "var(--series-2)"},
      {id: "continuing", name: "Continuing", color: "var(--series-3)"},
    ];
    PS.fillLegend(figure, series.map(s => ({...s, shape: "rect"})));
    PS.fillTable(figure, [
      {name: scheme.name[0].toUpperCase() + scheme.name.slice(1),
       value: p => p.label + (partial(p) ? " (partial)" : "")},
      {name: "Active", value: p => p.active},
      ...series.map(s => ({name: s.name, value: p => p[s.id]})),
      {name: "Last seen", value: p => p.lastSeen},
      {name: "Activity", value: p => p.activity},
    ], periods);

    // The open column is `pick` in the URL, as `<period>:<key>`, so changing
    // the period closes it.
    const picked = periods.find(p => state.pick === `${scheme.kind}:${p.key}`) || null;
    figure.details.hidden = picked === null;
    const toggle = p => set({pick: picked === p ? undefined : `${scheme.kind}:${p.key}`, who: undefined});

    if (!periods.length) {
      PS.charts.empty(figure, "No activity matches the filters.");
      return;
    }

    const last = periods[periods.length - 1];
    const byKey = new Map(periods.map(p => [p.key, p]));
    PS.charts.columns(figure, {
      items: periods,
      key: p => p.key,
      tick: k => byKey.get(k).short,
      series,
      value: (p, s) => p[s.id],
      total: p => p.active,
      faded: partial,
      labelSuffix: last.cut ? " (partial)" : last.partial && scheme.soFar ? " (so far)" : "",
      // Data-source markers: where an included kind's data starts.
      markers: PS.sourceMarkers(PS.selectedKinds())
        .map(m => ({...m, key: scheme.key(m.day)}))
        .filter(m => byKey.has(m.key) && m.key !== periods[0].key),
      label: `Contributors per ${scheme.name}. Arrow keys move between periods; the Table button shows the numbers.`,
      itemLabel: p => `${p.label}${partial(p) ? " (partial)" : ""}: ${p.active} active, ` +
        `${p.new} new, ${p.returning} returning, ${p.continuing} continuing, ` +
        `last seen ${p.lastSeen === null ? "not known yet" : p.lastSeen}. ` +
        `Press Enter to ${p === picked ? "close the list" : "list them"}.`,
      tooltip: (p, anchor) => PS.showTooltip(anchor, `${p.label}${partial(p) ? " (partial)" : ""}`, [
        {name: "active", value: p.active},
        ...series.map(s => ({name: s.name.toLowerCase(), value: p[s.id], color: s.color})),
        {name: "last seen", value: p.lastSeen === null ? "not known yet" : p.lastSeen},
        {name: "activity", value: p.activity},
      ]),
      activate: toggle,
      picked,
    });

    if (picked === null) return;
    const name = `${picked.label}${partial(picked) ? " (partial)" : ""}`;
    const group = s => {
      const members = picked.people.filter(m => m.kind === s.id)
        .sort((a, b) => b.activity - a.activity || PS.personName(a.person).localeCompare(PS.personName(b.person)));
      return PS.el("section", {class: "group"},
        PS.el("h4", {}, PS.swatch({color: s.color, shape: "rect"}), `${s.name} · ${members.length}`),
        members.length
          ? PS.el("ul", {}, members.map(m => PS.el("li", {},
            PS.personButton(m.person, state),
            PS.el("span", {class: "count"}, m.activity.toLocaleString("en-US")))))
          : PS.el("p", {class: "empty"}, "No one"));
    };
    figure.details.replaceChildren(
      PS.charts.detailsHead(`${name} · ${picked.active} ${picked.active === 1 ? "person" : "people"}`,
        () => set({pick: undefined, who: undefined})),
      PS.el("p", {class: "meta"}, "Most active first; the number is each person's activity in this " + scheme.name + "."),
      PS.el("div", {class: "groups"}, series.map(group)));
  },
});

</script>
<script>
/* views/segments.js */
// View: how concentrated the activity is. People ranked by activity along the
// bottom, the share of all activity they add up to on the left, and the
// segments (core, regular, casual, one-time) as zones along the curve.
// Choosing a zone lists its people; the Overview tiles also open lists here.

PS.registerView({
  id: "segments",
  title: "Segments",
  tab: "people",
  order: 20,
  render(figure, {data, rows, rowsExcept, state, set}) {
    const gap = data.settings.return_gap_days;
    const rules = PS.segmentRules(state);
    const {stats, dataEnd} = PS.metrics.personStats(rows, data, rules, gap, rowsExcept("people"));
    const pctOf = v => `${Math.round(v * 100)}%`;
    const names = {core: "Core", regular: "Regular", casual: "Casual", "one-time": "One-time"};
    const zoneColor = {
      core: "var(--seq-3)", regular: "var(--seq-2)", casual: "var(--seq-1)", "one-time": "var(--wash)",
    };
    const total = stats.reduce((sum, s) => sum + s.activity, 0);
    const segments = PS.metrics.SEGMENTS.map(id => {
      const members = stats.filter(s => s.segment === id);
      const activity = members.reduce((sum, s) => sum + s.activity, 0);
      return {
        id, name: names[id], people: members.length,
        current: members.filter(s => s.current).length,
        activity, share: total ? activity / total : 0,
      };
    });

    const core = segments[0];
    const leftOut = PS.leftOutLabels(state).join(", ");
    figure.subtitle.textContent = core.people
      ? `How concentrated is the work? ${core.people} ${core.people === 1 ? "person does" : "people do"} ` +
        `${Math.round(core.share * 100)}% of the activity${leftOut ? `, not counting the ${leftOut}` : ""}.`
      : "How concentrated is the work, and how many people help out now and then?";
    PS.fillHowto(figure, [
      `Core: the fewest top people who reach ${pctOf(rules.core)}. Regular: the next, up to ${pctOf(rules.regular)}. ` +
        "Casual: everyone else with more than one activity. One-time: exactly one.",
      leftOut ? `The ${leftOut} is left out of the counts, but the groups are still drawn with everyone counted, ` +
        "so the same people stay in each one and the shares are of the activity that remains." : null,
    ].filter(Boolean));
    PS.fillLegend(figure, PS.metrics.SEGMENTS.map(id => ({name: names[id], color: zoneColor[id], shape: "rect"})));
    const pct = v => `${(v * 100).toFixed(1)}%`;
    PS.fillTable(figure, [
      {name: "Segment", value: s => s.name},
      {name: "People", value: s => s.people},
      {name: "Active now", value: s => s.current},
      {name: "Activity", value: s => s.activity},
      {name: "Share of activity", value: s => pct(s.share)},
    ], segments);

    // People lists, chosen in the URL as `list`: a segment, or the active-now
    // and new people the Overview tiles count.
    const lists = {
      ...Object.fromEntries(segments.map(x => [x.id, {title: x.name, test: p => p.segment === x.id}])),
      active: {title: `Active in the last ${gap} days`, test: p => p.current},
      new: {title: `New in the last ${gap} days`, test: p => dataEnd - p.first < gap},
    };
    // The core list is open unless the person closed it (`list=none`).
    const wanted = state.list === undefined ? "core" : state.list;
    const listId = stats.length && lists[wanted] ? wanted : null;
    figure.details.hidden = listId === null;
    const toggleList = id => set({list: listId === id ? "none" : id === "core" ? undefined : id});

    if (!stats.length) {
      PS.charts.empty(figure, "No activity matches the filters.");
      return;
    }

    const width = PS.charts.width(figure);
    const height = 300;
    const margin = {top: 40, right: 16, bottom: 46, left: 56};
    const {svg, g, innerW, innerH} = PS.charts.frame(width, height, margin,
      "Segments. Arrow keys move between zones; the Table button shows the numbers.");
    const n = stats.length;
    // Rank r sits at x(r) and spans x(r - 0.5) to x(r + 0.5).
    const x = d3.scaleLog([0.5, n + 0.5], [0, innerW]);
    const y = d3.scaleLinear([0, 1], [innerH, 0]);
    let running = 0;
    const cum = stats.map(p => { running += p.activity; return total ? running / total : 0; });
    const zones = segments.map(sg => {
      const lo = stats.findIndex(p => p.segment === sg.id);
      return {...sg, lo, hi: lo < 0 ? -1 : stats.findLastIndex(p => p.segment === sg.id)};
    }).filter(z => z.people > 0);
    const zoneX0 = z => x(z.lo + 0.5);
    const zoneW = z => x(z.hi + 1.5) - x(z.lo + 0.5);

    zones.forEach(z => g.append("rect").attr("x", zoneX0(z)).attr("y", 0).attr("width", zoneW(z))
      .attr("height", innerH).attr("fill", zoneColor[z.id]));
    PS.charts.yAxis(g, y, innerW, {values: [0, 0.25, 0.5, 0.75, 1], format: d3.format(".0%")});
    const xTicks = [1, 3, 10, 30, 100, 300, 1000, 3000].filter(t => t <= n);
    g.append("g").attr("class", "axis").attr("transform", `translate(0,${innerH})`)
      .call(d3.axisBottom(x).tickValues(xTicks.length ? xTicks : [1]).tickFormat(v => String(v)).tickSize(0).tickPadding(8));
    g.append("text").attr("class", "label").attr("x", innerW / 2).attr("y", innerH + 38)
      .attr("text-anchor", "middle").text("People, most active first");
    g.append("text").attr("class", "label").attr("transform", "rotate(-90)")
      .attr("x", -innerH / 2).attr("y", -44).attr("text-anchor", "middle").text("Share of all activity");

    // Zone names above the plot, as many as fit.
    zones.forEach(z => {
      const cx = zoneX0(z) + zoneW(z) / 2;
      const count = `${z.people} ${z.people === 1 ? "person" : "people"}`;
      const room = zoneW(z) - 2;
      if (PS.textWidth(z.name, 12) > room) return;
      g.append("text").attr("class", z.id === listId ? "label current" : "label")
        .attr("x", cx).attr("y", -24).attr("text-anchor", "middle").text(z.name);
      if (PS.textWidth(count, 11) <= room) {
        g.append("text").attr("x", cx).attr("y", -10).attr("text-anchor", "middle").text(count);
      }
    });

    // The curve: 0 people reach 0%; each person adds their own activity.
    const points = [[0, 0], ...stats.map((p, i) => [x(i + 1), cum[i]])];
    g.append("path").datum(points)
      .attr("fill", "none").attr("stroke", "var(--text-primary)").attr("stroke-width", 2)
      .attr("stroke-linejoin", "round").attr("stroke-linecap", "round")
      .attr("d", d3.line().x(d => d[0]).y(d => y(d[1])));

    // Where core and regular end: how many people it took, and the total share.
    zones.filter(z => z.id === "core" || z.id === "regular").forEach(z => {
      const rank = z.hi + 1;
      const cx = x(rank), cy = y(cum[z.hi]);
      g.append("circle").attr("cx", cx).attr("cy", cy).attr("r", 4)
        .attr("fill", "var(--text-primary)").attr("stroke", "var(--surface-1)").attr("stroke-width", 2);
      const text = `${rank} ${rank === 1 ? "person" : "people"}: ${pct(cum[z.hi])}`;
      const w = PS.textWidth(text, 12);
      const right = cx + 8 + w <= innerW;
      g.append("text").attr("class", "label halo").attr("x", right ? cx + 8 : cx - 8).attr("y", cy + 16)
        .attr("text-anchor", right ? "start" : "end").text(text);
    });

    const picked = zones.find(z => z.id === listId);
    if (picked) PS.charts.outline(g, {x: zoneX0(picked), y: 0, width: zoneW(picked), height: innerH});

    const refocus = PS.charts.hits(figure, zones.map(z => g.append("rect").attr("class", "hit clickable")
      .attr("x", zoneX0(z)).attr("y", 0).attr("width", zoneW(z)).attr("height", innerH)), {
      keys: ["ArrowLeft", "ArrowRight"],
      current: Math.min(figure.focusRow || 0, zones.length - 1),
      label: i => {
        const z = zones[i];
        return `${z.name}: ${z.people} people, ${z.current} active now, ` +
          `${pct(z.share)} of activity. Press Enter to ${z.id === listId ? "close the list" : "list them"}.`;
      },
      show: (i, anchor) => {
        const z = zones[i];
        PS.showTooltip(anchor, z.name, [
          {name: "people", value: z.people},
          {name: "active now", value: z.current},
          {name: "activity", value: z.activity},
          {name: "share of activity", value: pct(z.share)},
        ]);
      },
      activate: i => toggleList(zones[i].id),
      onFocus: i => { figure.focusRow = i; },
    });
    figure.plot.replaceChildren(svg.node());
    refocus();

    if (listId === null) return;
    const list = lists[listId];
    const people = stats.filter(list.test);
    const listShare = total ? people.reduce((sum, p) => sum + p.activity, 0) / total : 0;
    const showSegment = !PS.metrics.SEGMENTS.includes(listId);
    // Active now is a filled dot before the name (hollow when not); activity
    // is a bar on one scale for the whole list, with the share beside it.
    const head = [["Person", "left"], ...(showSegment ? [["Segment", "left"]] : []), ["Activity", "left"],
      ["Share"], ["First"], ["Last"]];
    const day = d => PS.dayToText(d);
    const most = Math.max(1, ...people.map(p => p.activity));
    const status = on => PS.el("span", {class: on ? "status on" : "status", title: on ? "active now" : "not active now"},
      PS.el("span", {class: "sr-only"}, on ? "active now: " : "not active now: "));
    const body = people.map(p => {
      const share = pct(total ? p.activity / total : 0);
      return PS.el("tr", {},
        PS.el("td", {}, status(p.current), PS.personButton(p.person, state, "people-")),
        showSegment ? PS.el("td", {class: "left"}, p.segment) : null,
        PS.el("td", {class: "left"},
          PS.el("div", {class: "cellbar"},
            PS.el("span", {class: "num"}, p.activity.toLocaleString("en-US")),
            PS.el("span", {class: "track"},
              PS.el("span", {class: "bar", style: `width: ${(p.activity / most) * 100}%`})))),
        PS.el("td", {}, share),
        PS.el("td", {}, day(p.first)),
        PS.el("td", {}, day(p.last)));
    });
    const key = PS.el("p", {class: "status-key"},
      PS.el("span", {class: "status on", "aria-hidden": "true"}), `active in the last ${gap} days`,
      PS.el("span", {class: "status", "aria-hidden": "true"}), "not");
    figure.details.replaceChildren(
      PS.charts.detailsHead(`${list.title} · ${people.length} ${people.length === 1 ? "person" : "people"} · ` +
        `${pct(listShare)} of activity`, () => set({list: "none"})),
      key,
      people.length
        ? PS.el("div", {class: "table-wrap"},
          PS.el("table", {class: "data people"}, PS.el("thead", {}, PS.el("tr", {}, head.map(([h, cls]) => PS.el("th", {scope: "col", class: cls}, h)))),
            PS.el("tbody", {}, body)))
        : PS.el("p", {class: "empty"}, "No one matches."));
  },
});

</script>
<script>
/* views/summary.js */
// View: headline numbers at the top of the page, from the same filtered rows
// as the views below. Each tile opens the list of those people (in Segments).

PS.registerView({
  id: "summary",
  title: "Summary",
  tab: "overview",
  bare: true,
  order: 0,
  render(figure, {data, rows, rowsExcept, state}) {
    const gap = data.settings.return_gap_days;
    const rules = PS.segmentRules(state);
    const {stats, dataEnd} = PS.metrics.personStats(rows, data, rules, gap, rowsExcept("people"));
    const tile = (value, what, target) => {
      const button = PS.el("button", {type: "button", class: "tile"},
        PS.el("span", {class: "value"}, value),
        PS.el("span", {class: "what"}, what));
      button.onclick = () => PS.jumpTo(...target);
      return button;
    };
    if (!stats.length) {
      figure.plot.replaceChildren(PS.el("p", {class: "empty"}, "No activity matches the filters."));
      return;
    }
    const fmt = n => n.toLocaleString("en-US");
    const active = stats.filter(s => s.current).length;
    const fresh = stats.filter(s => dataEnd - s.first < gap).length;
    const core = stats.filter(s => s.segment === "core");
    const total = stats.reduce((sum, s) => sum + s.activity, 0);
    const coreShare = total ? core.reduce((sum, s) => sum + s.activity, 0) / total : 0;
    const tiles = [
      tile(fmt(active), `active in the last ${gap} days`, ["details-segments", {list: "active"}]),
      tile(fmt(fresh), `new in the last ${gap} days`, ["details-segments", {list: "new"}]),
      tile(fmt(core.length), `people do ${Math.round(coreShare * 100)}% of the activity`,
        ["details-segments", {list: "core"}]),
    ];

    figure.plot.replaceChildren(PS.el("div", {class: "tiles"}, tiles));
  },
});

</script>
<script>
/* views/theme_table.js */
// View: one row per theme (share now vs earlier, documents, first and last
// seen, peak period, top contributors). A theme's name opens the list of its commits,
// PRs, and issues, with GitHub links.

PS.registerView({
  id: "theme-table",
  title: "Theme details",
  tab: "themes",
  feature: "themes",
  order: 60,
  noTable: true,
  render(figure, {data, rowsExcept, state, set}) {
    if (!data.themes.name.length) {
      figure.plot.replaceChildren(PS.el("p", {class: "empty"}, "No themes yet; run projstats tag."));
      figure.details.hidden = true;
      return;
    }
    const kind = PS.themePeriod(state);
    const scheme = PS.periodScheme(kind);
    const rows = rowsExcept("theme");
    const r = PS.metrics.themeTrends(rows, data, scheme, {skipInProgress: kind === "release"});
    const cols = r.periods.filter(p => p.covered && p.activity > 0);
    const name = t => data.themes.name[t];
    const pct = v => `${(v * 100).toFixed(1)}%`;
    const day = d => PS.dayToText(d);

    // Documents per theme, within the date range.
    const lo = state.from ? PS.dateToDay(state.from) : -Infinity;
    const hi = state.to ? PS.dateToDay(state.to) : Infinity;
    const docsOf = new Map();
    data.themes.doc.forEach((d, k) => {
      const t = data.themes.theme[k];
      if (data.docs.day[d] < lo || data.docs.day[d] > hi) return;
      if (!docsOf.has(t)) docsOf.set(t, []);
      docsOf.get(t).push(d);
    });

    const themes = r.present.filter(t => docsOf.has(t) || r.lastDay[t] !== null).map(t => {
      const docs = (docsOf.get(t) || []).sort((a, b) => data.docs.day[b] - data.docs.day[a] || b - a);
      let peak = null;
      for (const p of cols) {
        const s = p.themes.find(x => x.theme === t);
        if (s && s.share > 0 && (!peak || s.share > peak.share)) {
          peak = {label: p.partial && scheme.soFar ? `${p.label} so far` : p.label, share: s.share};
        }
      }
      return {
        t, docs, peak, trend: r.trends.get(t), contributors: r.contributors.get(t) || [],
        first: docs.length ? data.docs.day[docs[docs.length - 1]] : null, last: r.lastDay[t],
      };
    }).sort((a, b) => (b.trend ? b.trend.recentShare : 0) - (a.trend ? a.trend.recentShare : 0) ||
      b.docs.length - a.docs.length || name(a.t).localeCompare(name(b.t)));
    // Documents is the only sortable column; a third click restores the order above.
    if (figure.docSort) {
      const sign = figure.docSort === "asc" ? 1 : -1;
      themes.sort((a, b) => sign * (a.docs.length - b.docs.length) || name(a.t).localeCompare(name(b.t)));
    }

    figure.subtitle.textContent = "What's in each theme, and who works on it? Choose a theme to see the activity on it.";
    PS.fillHowto(figure, [
      `Documents: commits, PRs, and issues tagged with the theme${state.from || state.to ? " within the selected dates" : ""}.`,
      `Peak: the ${scheme.name} with the theme's largest share, and that share, as in Themes over time.`,
      "Top people: most activity on the theme's documents; the list below shows five.",
    ]);

    if (!themes.length) {
      figure.plot.replaceChildren(PS.el("p", {class: "empty"}, "No themed activity matches the filters."));
      figure.details.hidden = true;
      return;
    }

    const selected = PS.selectedThemes(state);
    if (figure.open === undefined) figure.open = selected.length ? selected[0] : null;
    const sortButton = PS.el("button", {
      type: "button", class: "sort",
      "aria-label": figure.docSort
        ? `Documents, ${figure.docSort === "asc" ? "fewest" : "most"} first. ` +
          `Click to ${figure.docSort === "asc" ? "restore the default order" : "reverse"}.`
        : "Sort by Documents",
    }, "Documents", PS.el("span", {
      class: figure.docSort ? (figure.docSort === "asc" ? "chev up" : "chev") : "sort-none", "aria-hidden": "true",
    }));
    sortButton.onclick = () => {
      figure.docSort = figure.docSort === undefined ? "desc" : figure.docSort === "desc" ? "asc" : undefined;
      this.render(figure, {data, rowsExcept, state, set});
    };
    const head = PS.el("tr", {}, ["Theme", "Documents", "First seen", "Last seen",
      "Peak", "Top people"].map(h => h === "Documents"
      ? PS.el("th", {scope: "col", "aria-sort": figure.docSort ? (figure.docSort === "asc" ? "ascending" : "descending") : "none"}, sortButton)
      : PS.el("th", {scope: "col"}, h)));
    const body = themes.map(x => {
      const button = PS.el("button", {
        type: "button", class: "link-button", "aria-expanded": String(figure.open === x.t),
      }, name(x.t));
      button.onclick = () => {
        figure.open = figure.open === x.t ? null : x.t;
        figure.showAll = false;
        this.render(figure, {data, rowsExcept, state, set});
        if (figure.open !== null) figure.details.scrollIntoView({block: "nearest"});
      };
      return PS.el("tr", {class: selected.includes(x.t) ? "selected" : null},
        PS.el("td", {}, button),
        PS.el("td", {}, x.docs.length),
        PS.el("td", {class: "nowrap"}, x.first === null ? "–" : day(x.first)),
        PS.el("td", {class: "nowrap"}, x.last === null ? "–" : day(x.last)),
        PS.el("td", {class: "nowrap"}, x.peak ? `${x.peak.label} · ${pct(x.peak.share)}` : "–"),
        PS.el("td", {class: "people"}, x.contributors.slice(0, 3)
          .map(c => `${PS.personName(c.person)} ${c.code + c.discussion}`).join(", ") || "–"));
    });
    figure.plot.replaceChildren(PS.el("div", {class: "table-wrap"},
      PS.el("table", {class: "data themes"}, PS.el("thead", {}, head), PS.el("tbody", {}, body))));

    const open = themes.find(x => x.t === figure.open);
    figure.details.hidden = !open;
    if (!open) return;
    const filtered = selected.includes(open.t);
    const filterButton = PS.el("button", {type: "button"},
      filtered ? (selected.length === 1 ? "Show all themes on the page" : "Remove this theme from the filter")
        : selected.length ? "Add this theme to the filter" : "Filter the page to this theme");
    filterButton.onclick = () => set(PS.themePatch(
      filtered ? selected.filter(t => t !== open.t) : [...selected, open.t]));
    // The theme's activity over the whole range, after the filters other than Theme.
    const {themesOf, tagged} = PS.metrics.themeIndex(data);
    const A = data.activity;
    const mine = rows.filter(i => {
      const d = A.doc[i];
      return d >= 0 && tagged[d] && (themesOf.get(d) || []).includes(open.t);
    });
    figure.details.replaceChildren(...PS.themeActivity(figure, {
      title: name(open.t),
      rows: mine,
      extra: [filterButton],
      onClose: () => {
        figure.open = null;
        this.render(figure, {data, rowsExcept, state, set});
      },
      rerender: () => this.render(figure, {data, rowsExcept, state, set}),
    }));
  },
});

</script>
<script>
/* views/themes_over_time.js */
// View: each theme's share of activity per release cycle, as a heatmap. Only
// periods that are mostly tagged get columns. Hovering a theme shows its latest
// share and how it compares with earlier ones. A cell opens, in the pane below,
// the activity its share is made of, listed like the People tab's pane.

// The theme views' period: release cycles, or years when a project has no
// releases. Theme counts per month or quarter are too small to compare, so
// these views don't follow Group by.
PS.themePeriod = () => (PS.data.releases.day.length ? "release" : "year");

PS.registerView({
  id: "themes-over-time",
  title: "Themes over time",
  tab: "themes",
  feature: "themes",
  order: 50,
  render(figure, args) {
    const {data, rowsExcept, state} = args;
    figure.details.hidden = true;
    if (!data.themes.name.length) {
      figure.plot.replaceChildren(PS.el("p", {class: "empty"}, "No themes yet; run projstats tag."));
      return;
    }
    const kind = PS.themePeriod(state);
    const scheme = PS.periodScheme(kind);
    // Every theme is shown even when the theme filter picks some; those are marked.
    const rows = rowsExcept("theme");
    const r = PS.metrics.themeTrends(rows, data, scheme, {skipInProgress: kind === "release"});
    const selected = PS.selectedThemes(state);
    const cols = r.periods.filter(p => p.covered && p.activity > 0);
    const untagged = r.periods.filter(p => !p.covered && p.activity > 0).length;

    const name = t => data.themes.name[t];
    const shareOf = (p, t) => {
      const s = p.themes.find(x => x.theme === t);
      return s ? s : null;
    };
    // Largest share first, in the period trends are measured on (the latest
    // complete one), or else the latest period shown.
    const ranked = r.recent !== null ? r.periods[r.recent] : cols[cols.length - 1];
    const rankShare = t => (ranked && shareOf(ranked, t) ? shareOf(ranked, t).share || 0 : 0);
    const themes = r.present.filter(t => cols.some(p => shareOf(p, t)))
      .sort((a, b) => rankShare(b) - rankShare(a) || name(a).localeCompare(name(b)));

    const compared = r.recent === null || !r.earlier.length ? null
      : `Hover a theme to compare its share in ${r.periods[r.recent].label} with ${r.earlier.length === 1 ? r.periods[r.earlier[0]].label
        : `all ${r.earlier.length} earlier ${scheme.name}s combined`}.`;
    figure.subtitle.textContent = "Which areas of work are getting more attention, and which less?";
    PS.fillHowto(figure, [
      `Each cell: activity on the theme's documents / all activity on tagged documents, in that ${scheme.name}, as a percent. A blank cell means no activity.`,
      "A PR's reviews, comments, and linked commits count toward its themes; a document with two themes counts for both.",
      `Documents in the tooltip: the PRs opened, issues opened, and commits not tied to a PR in that ${scheme.name} that are tagged with the theme.`,
      compared,
      untagged ? `${untagged} earlier ${scheme.name}${untagged === 1 ? " isn't" : "s aren't"} tagged yet, so ` +
        `${untagged === 1 ? "it's" : "they're"} left out.` : null,
    ].filter(Boolean));

    const BINS = [0.01, 0.03, 0.06, 0.10, 0.15];
    const binOf = v => BINS.filter(t => v >= t).length;
    PS.fillLegend(figure, ["under 1%", "1–3%", "3–6%", "6–10%", "10–15%", "15%+"]
      .map((n, i) => ({name: n, color: `var(--seq-${i + 1})`, shape: "rect"})));
    const unit = "Share of activity, in %";
    figure.legend.append(PS.el("span", {class: "unit"}, unit));
    const shareNum = v => (v * 100).toFixed(1);
    const pct = v => (v === null || v === undefined ? "–" : `${shareNum(v)}%`);
    PS.fillTable(figure, [
      {name: "Theme", value: t => name(t)},
      ...cols.map(p => ({
        name: p.label + (p.partial && scheme.soFar ? " (so far)" : ""),
        value: t => (shareOf(p, t) ? shareNum(shareOf(p, t).share) : "–"),
      })),
    ], themes, unit);

    if (!cols.length) {
      const days = data.themes.tagged.map(d => data.docs.day[d]);
      figure.plot.replaceChildren(PS.el("p", {class: "empty"},
        `No tagged ${scheme.name}s match the filters.` +
        (days.length ? ` Theme tags cover documents from ${PS.dayToText(Math.min(...days))}.` : "")));
      return;
    }

    // The chosen cell is kept as a theme and a period key, so it survives
    // other filters; it is dropped when the filters remove the cell.
    const pickedCol = figure.pick ? cols.findIndex(p => p.key === figure.pick.key) : -1;
    const picked = pickedCol >= 0 && themes.includes(figure.pick.t) && shareOf(cols[pickedCol], figure.pick.t)
      ? figure.pick : null;
    if (!picked) figure.pick = null;

    // The latest column's share, for a row's label and its tooltip off the cells.
    const latest = t => cols.slice(-1).map(p => ({
      name: p.label + (p.partial && scheme.soFar ? " so far" : ""),
      value: shareOf(p, t) ? pct(shareOf(p, t).share) : "–",
    }));
    PS.charts.heatmap(figure, {
      rows: themes,
      cols,
      rowLabel: i => name(themes[i]),
      rowCurrent: i => selected.includes(themes[i]),
      colLabel: k => cols[k].short,
      colNote: k => (cols[k].partial && scheme.soFar ? "so far" : null),
      cell: (i, k) => {
        const p = cols[k];
        const s = p && shareOf(p, themes[i]);
        return s ? {text: shareNum(s.share), bin: binOf(s.share), faded: p.partial} : null;
      },
      label: `Themes over time by ${scheme.name}. Up and down arrows move between themes, left and right ` +
        `between ${scheme.name}s, and Enter lists the activity; the Table button shows the numbers.`,
      rowLabelAria: i => `${name(themes[i])}: ` +
        latest(themes[i]).map(a => `${a.name} ${a.value}`).join(", ") +
        `. Left and right arrows choose a ${scheme.name}; Enter lists its activity.`,
      tooltip: (i, k, anchor) => {
        const t = themes[i];
        const trend = r.trends.get(t);
        const p = cols[k];
        const s = p && shareOf(p, t);
        const all = latest(t);
        const lines = s ? [
          {name: `share in ${p.label}`, value: pct(s.share)},
          {name: "documents", value: s.docs},
          {name: "commits", value: s.commits},
          {name: "discussion", value: s.discussion},
          {name: "people", value: s.people},
        ] : all;
        PS.showTooltip(anchor, name(t), trend && lines === all
          ? [...lines, {name: `${r.periods[r.recent].label} vs earlier`, value: `${pct(trend.recentShare)} vs ${pct(trend.earlierShare)}`}]
          : lines);
      },
      onPick: (i, k) => {
        const t = themes[i];
        const p = cols[k];
        const same = picked && picked.t === t && picked.key === p.key;
        figure.pick = same ? null : {t, key: p.key};
        figure.showAll = false;
        this.render(figure, args);
        if (figure.pick) figure.details.scrollIntoView({behavior: "smooth", block: "nearest"});
      },
      picked: picked && {row: themes.indexOf(picked.t), col: pickedCol},
      focusRow: Math.max(0, themes.indexOf(selected[0])),
    });

    if (!picked) return;
    const cell = cols[pickedCol];
    const period = cell.label + (cell.partial && scheme.soFar ? " so far" : "") + (kind === "release" && !/\bdev\b/.test(cell.label) ? " release" : "");
    // The activity the cell's share is made of: on documents tagged with the
    // theme, in this period, after the other filters.
    const index = r.periods.indexOf(cell);
    const {themesOf, tagged} = PS.metrics.themeIndex(data);
    const A = data.activity;
    const mine = rows.filter(i => {
      const d = A.doc[i];
      return d >= 0 && tagged[d] && r.periodOf(A.day[i]) === index && (themesOf.get(d) || []).includes(picked.t);
    });
    figure.details.hidden = false;
    figure.details.replaceChildren(...PS.themeActivity(figure, {
      title: `${name(picked.t)} · ${period}`,
      rows: mine,
      onClose: () => {
        figure.pick = null;
        this.render(figure, args);
      },
      rerender: () => this.render(figure, args),
    }));
  },
});

</script>
<script>
/* views/timeline.js */
// View: one row per person, ordered by first activity, with a mark for each
// period they were active in. One segment at a time is listed.

const NAME_SIZE = 13;  // px; keep in step with `.plot .name` in template.html

PS.registerView({
  id: "timeline",
  title: "Timeline per person",
  tab: "people",
  order: 40,
  render(figure, {data, rows, rowsExcept, state, set}) {
    const gap = data.settings.return_gap_days;
    const rules = PS.segmentRules(state);
    const scheme = PS.periodScheme(state.period);
    const {stats} = PS.metrics.personStats(rows, data, rules, gap, rowsExcept("people"));
    const ids = PS.metrics.SEGMENTS;
    // One segment, core by default. Older links may list several: the first counts.
    const picked = (state.tl || "").split(",").find(s => ids.includes(s)) || "core";
    const counts = Object.fromEntries(ids.map(id => [id, stats.filter(s => s.segment === id).length]));

    // One choice of segment, built once and kept in step with the state. Arrow
    // keys move and select, like a radio group.
    const names = {core: "Core", regular: "Regular", casual: "Casual", "one-time": "One-time"};
    if (!figure.toggles) {
      figure.toggles = ids.map(id => {
        const button = PS.el("button", {type: "button", role: "radio"});
        const choose = () => { if (figure.picked !== id) set({tl: id === "core" ? undefined : id}); };
        button.onclick = choose;
        button.onfocus = choose;
        return button;
      });
      PS.rovingFocus(figure.toggles, 0, "ArrowLeft", "ArrowRight");
      figure.controls.append(PS.el("span", {class: "label", id: "timeline-show"}, "Show"),
        PS.el("span", {class: "choice", role: "radiogroup", "aria-labelledby": "timeline-show"}, ...figure.toggles));
    }
    figure.picked = picked;
    figure.toggles.forEach((button, i) => {
      const label = `${names[ids[i]]} ${counts[ids[i]]}`;
      button.textContent = label;
      button.setAttribute("data-label", label);
      button.setAttribute("aria-checked", String(ids[i] === picked));
      button.setAttribute("tabindex", ids[i] === picked ? 0 : -1);
    });

    const people = stats.filter(s => s.segment === picked)
      .sort((a, b) => a.first - b.first || PS.personName(a.person).localeCompare(PS.personName(b.person)));

    figure.subtitle.textContent = "When was each person active, and who is still around?";
    PS.fillHowto(figure, [
      `Bold names: active in the last ${gap} days of data.`,
    ]);
    const BINS = [2, 6, 21];
    const binOf = n => BINS.filter(t => n >= t).length;
    PS.fillLegend(figure, ["1 activity", "2–5", "6–20", "21+"]
      .map((name, i) => ({name, color: `var(--ord-${i + 1})`, shape: "rect"})));
    const dayText = d => PS.dayToText(d);
    PS.fillTable(figure, [
      {name: "Person", value: s => PS.personButton(s.person, state, "people-")},
      {name: "Segment", value: s => s.segment},
      {name: "First", value: s => dayText(s.first)},
      {name: "Last", value: s => dayText(s.last)},
      {name: "Activity", value: s => s.activity},
      {name: "Active quarters", value: s => s.quarters},
      {name: "Returns", value: s => s.returns},
      {name: "Active now", value: s => (s.current ? "yes" : "no")},
    ], people);

    if (!people.length) {
      PS.charts.empty(figure, stats.length ? "No one in the chosen segments." : "No activity matches the filters.");
      return;
    }

    // Activity per person per period, for the people shown.
    const A = data.activity;
    const wanted = new Set(people.map(s => s.person));
    const perPerson = new Map(people.map(s => [s.person, new Map()]));
    let minKey = Infinity, maxKey = -Infinity;
    for (const i of rows) {
      const key = scheme.key(A.day[i]);
      if (key < minKey) minKey = key;
      if (key > maxKey) maxKey = key;
      if (!wanted.has(A.person[i])) continue;
      const m = perPerson.get(A.person[i]);
      m.set(key, (m.get(key) || 0) + 1);
    }
    const keys = d3.range(minKey, maxKey + 1);

    const width = PS.charts.width(figure);
    const maxNameW = Math.min(220, Math.round(width * 0.38));
    const short = name => PS.fitText(name, NAME_SIZE, maxNameW - 12);
    const nameW = Math.min(maxNameW, 12 + Math.max(...people.map(s => PS.textWidth(short(PS.personName(s.person)), NAME_SIZE))));
    const innerW = width - nameW - 8;
    const x = d3.scaleBand(keys, [0, innerW]);
    const markW = x.step() >= 4 ? x.step() - 1 : x.step();
    const rowH = 22, markH = 14;
    const headH = 24 + 14 * PS.sourceMarkers(PS.selectedKinds()).length;

    // Header: period labels and data-source marker labels; it stays put
    // while the rows scroll.
    const header = PS.charts.svg(width, headH, null);
    const every = PS.charts.labelEvery(x.step());
    const hg = header.append("g").attr("transform", `translate(${nameW},0)`);
    keys.forEach((k, i) => {
      if (i % every || x(k) + PS.textWidth(scheme.short(k), 11) > innerW + 8) return;
      hg.append("text").attr("x", x(k)).attr("y", headH - 6).text(scheme.short(k));
    });
    const markers = PS.sourceMarkers(PS.selectedKinds())
      .map(m => ({...m, key: scheme.key(m.day)}))
      .filter(m => m.key > minKey && m.key <= maxKey);
    PS.markerLabels(hg, markers, x, 10, -nameW, innerW + 8);

    // Body: one row per person.
    const height = people.length * rowH;
    const body = PS.charts.svg(width, height,
      "Timeline per person. Arrow keys move between people; the Table button lists them.");
    // Every other row shaded, and light gridlines at the labeled periods, so
    // a row is easy to follow across.
    people.forEach((_, row) => {
      if (row % 2) body.append("rect").attr("x", 0).attr("y", row * rowH).attr("width", width)
        .attr("height", rowH).attr("fill", "var(--wash)");
    });
    const bg = body.append("g").attr("transform", `translate(${nameW},0)`);
    bg.append("g").attr("class", "grid").selectAll("line")
      .data(keys.filter((k, i) => i % every === 0)).join("line")
      .attr("x1", k => x(k)).attr("x2", k => x(k)).attr("y1", 0).attr("y2", height);
    const markerG = bg.append("g").attr("class", "marker");
    for (const m of markers) {
      markerG.append("line").attr("x1", x(m.key)).attr("x2", x(m.key)).attr("y1", 0).attr("y2", height);
    }
    const targets = [];
    people.forEach((s, row) => {
      const y = row * rowH;
      const name = PS.personName(s.person);
      body.append("text").attr("class", s.current ? "name current" : "name")
        .attr("x", 0).attr("y", y + rowH / 2).attr("dominant-baseline", "middle").text(short(name));
      const active = perPerson.get(s.person);
      for (const [key, n] of active) {
        bg.append("rect").attr("x", x(key)).attr("y", y + (rowH - markH) / 2)
          .attr("width", Math.max(1, markW)).attr("height", markH).attr("rx", Math.min(2, markW / 2))
          .attr("fill", `var(--ord-${binOf(n) + 1})`);
      }
      const summary = [
        {name: "segment", value: s.segment},
        {name: "first", value: dayText(s.first)},
        {name: "last", value: dayText(s.last)},
        {name: "activity", value: s.activity},
        {name: "active quarters", value: s.quarters},
        {name: "returns", value: s.returns},
      ];
      const login = data.people.login[s.person];
      const title = `${name}${login && login !== name ? ` (${login})` : ""}${s.current ? " · active now" : ""}`;
      const show = event => {
        const lines = [...summary];
        if (event instanceof Event && "clientX" in event) {
          const [px] = d3.pointer(event, bg.node());
          const key = keys[Math.floor(px / x.step())];
          if (key !== undefined) lines.unshift({name: `in ${scheme.label(key)}`, value: active.get(key) || 0});
        }
        PS.showTooltip(event, title, lines);
      };
      targets.push({
        node: body.append("rect").attr("class", "hit")
          .attr("x", 0).attr("y", y).attr("width", width).attr("height", rowH),
        label: `${name}: ${s.segment}, ${dayText(s.first)} to ${dayText(s.last)}, ` +
          `${s.activity} activity in ${s.quarters} quarters${s.current ? ", active now" : ""}`,
        show,
      });
    });
    PS.charts.hits(figure, targets.map(t => t.node), {
      keys: ["ArrowUp", "ArrowDown"],
      current: 0,
      label: i => targets[i].label,
      show: (i, anchor) => targets[i].show(anchor),
    });

    PS.charts.scrollArea(figure, header, body);
  },
});

</script>
<script>
/* check.js */
// #check: recompute Python's reference numbers in the browser and list any
// mismatch. Open the page with "#check" in the address to run it.

PS.onStart(() => {
  if (!PS.state.check) return;
  const data = PS.data;
  const ref = data.reference;
  const gap = data.settings.return_gap_days;
  const rules = {core: data.settings.core_share, regular: data.settings.regular_share};
  const results = [];

  function rowsOf(kinds) {
    const allowed = data.kinds.map(k => !kinds || kinds.includes(k));
    const rows = [];
    for (let i = 0; i < data.activity.kind.length; i++) if (allowed[data.activity.kind[i]]) rows.push(i);
    return rows;
  }

  // got, want: lists of rows, compared as JSON one row at a time.
  function compare(name, got, want) {
    const diffs = [];
    for (let i = 0; i < Math.max(got.length, want.length); i++) {
      const a = JSON.stringify(got[i]);
      const b = JSON.stringify(want[i]);
      if (a !== b) diffs.push(`  page   ${a}\n  python ${b}`);
    }
    results.push({name, ok: diffs.length === 0, detail: diffs.slice(0, 5).join("\n")});
  }

  const kindsName = kinds => (kinds ? kinds.join("+") : "all kinds");

  for (const want of ref.period_counts) {
    const got = PS.metrics.periodCounts(rowsOf(want.kinds), data, PS.periodScheme(want.period), gap)
      .map(r => [r.label, r.active, r.new, r.returning, r.continuing, r.lastSeen, r.activity, r.partial]);
    compare(`period counts: ${kindsName(want.kinds)} by ${want.period}`, got, want.rows);
  }

  for (const want of ref.segments) {
    const {stats} = PS.metrics.personStats(rowsOf(want.kinds), data, rules, gap);
    const counts = {};
    for (const s of stats) {
      const [n, current] = counts[s.segment] || [0, 0];
      counts[s.segment] = [n + 1, current + (s.current ? 1 : 0)];
    }
    const sorted = Object.keys(counts).sort().map(k => [k, ...counts[k]]);
    const expected = Object.keys(want.segments).sort().map(k => [k, ...want.segments[k]]);
    compare(`segments: ${kindsName(want.kinds)}`, sorted, expected);
  }

  // Theme shares per covered release cycle (to 6 decimals, as exported) and
  // trend labels.
  if (ref.theme_trends) {
    const r = PS.metrics.themeTrends(rowsOf(null), data, PS.periodScheme("release"), {skipInProgress: true});
    const name = t => data.themes.name[t];
    const round = v => Math.round(v * 1e6) / 1e6;
    const close = (a, b) => Math.abs(a - b) < 2e-6;
    const got = r.periods.filter(p => p.covered).map(p => [p.label,
      p.themes.map(s => [name(s.theme), s.share]).sort((a, b) => a[0].localeCompare(b[0]))]);
    const want = ref.theme_trends.periods.map(p => [p.label,
      Object.entries(p.shares).sort((a, b) => a[0].localeCompare(b[0]))]);
    // Shares were rounded in Python; equal within rounding counts as a match.
    for (let i = 0; i < Math.min(got.length, want.length); i++) {
      if (got[i][0] !== want[i][0] || got[i][1].length !== want[i][1].length) continue;
      got[i][1] = got[i][1].map(([t, s], k) => [t, close(s, want[i][1][k][1]) ? want[i][1][k][1] : round(s)]);
    }
    compare("theme shares by release", got, want);
    const labels = [...r.trends].map(([t, x]) => [name(t), x.label]).sort((a, b) => a[0].localeCompare(b[0]));
    compare("theme trend labels", labels,
      Object.entries(ref.theme_trends.labels).sort((a, b) => a[0].localeCompare(b[0])));
  }

  for (const want of ref.merge_times || []) {
    const got = PS.metrics.mergeTimes(rowsOf(null), data, PS.periodScheme(want.period))
      .map(r => [r.label, ...r.counts, r.median, r.partial]);
    compare(`time to merge by ${want.period}`, got, want.rows);
  }

  const passed = results.filter(r => r.ok).length;
  const box = PS.el("div", {class: "box"},
    PS.el("span", {class: passed === results.length ? "ok" : "bad"},
      `#check: ${passed} of ${results.length} match Python`),
    ...results.map(r => PS.el("div", {},
      `${r.ok ? "match" : "MISMATCH"}: ${r.name}`,
      r.ok ? null : PS.el("pre", {}, r.detail))));
  document.getElementById("check-panel").replaceChildren(box);
  console.log(`#check: ${passed} of ${results.length} match`, results);
});

</script>
<script>PS.start();</script>
</body>
