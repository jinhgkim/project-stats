<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaterialX Project Analytics</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --wash: rgba(11, 11, 11, 0.05);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --kind-code: #e87ba4;
    --kind-discussion: #6250d6;
    --series-1-faint: #86b6ef;
    /* One-hue blue ramps: seq-* for the theme heatmap (top three take the
       inverse ink), ord-* for timeline marks (lightest still clears 2:1). */
    --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec;
    --seq-4: #256abf; --seq-5: #184f95; --seq-6: #0d366b;
    --seq-ink-inverse: #ffffff;
    --ord-1: #86b6ef; --ord-2: #3987e5; --ord-3: #1c5cab; --ord-4: #0d366b;
    --critical: #d03b3b;
    --good: #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface-1: #1a1a19;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.06);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --kind-code: #d55181;
      --kind-discussion: #9085e9;
      --series-1-faint: #184f95;
      --seq-1: #0d366b; --seq-2: #184f95; --seq-3: #256abf;
      --seq-4: #6da7ec; --seq-5: #9ec5f4; --seq-6: #cde2fb;
      --seq-ink-inverse: #0b0b0b;
      --ord-1: #184f95; --ord-2: #2a78d6; --ord-3: #6da7ec; --ord-4: #b7d3f6;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.06);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --kind-code: #d55181;
    --kind-discussion: #9085e9;
    --series-1-faint: #184f95;
    --seq-1: #0d366b; --seq-2: #184f95; --seq-3: #256abf;
    --seq-4: #6da7ec; --seq-5: #9ec5f4; --seq-6: #cde2fb;
    --seq-ink-inverse: #0b0b0b;
    --ord-1: #184f95; --ord-2: #2a78d6; --ord-3: #6da7ec; --ord-4: #b7d3f6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header, #filter-inner, #views, #check-panel, #about { max-width: 1440px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 20px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 20px; font-weight: 600; margin: 0; }
  /* The project name in the title: a dim box with an arrow on the right (drawn
     here so it matches the More filters arrow). */
  .project-pick { position: relative; display: inline-block; margin-left: 8px; }
  .project-pick::before {
    content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
    border: solid var(--text-secondary); border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg); pointer-events: none;
  }
  #project {
    cursor: pointer; background-image: none;
    background-color: var(--wash); padding: 2px 28px 2px 10px;
  }
  #project:hover { border-color: var(--text-muted); }
  #theme {
    margin-left: auto; align-self: center; display: grid; place-items: center;
    width: 34px; height: 34px; padding: 0; border-radius: 999px; color: var(--text-secondary);
  }
  #theme:hover { color: var(--text-primary); }
  #about { color: var(--text-secondary); font-size: 13px; padding-top: 14px; padding-bottom: 40px; border-top: 1px solid var(--grid); }
  #about a { color: inherit; }
  button, select, input {
    font: inherit; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
  }
  button { cursor: pointer; }
  /* One drawn arrow on every select (a native one sits tight against the edge):
     two thin diagonals forming a chevron, the same shape as the More filters one. */
  select {
    appearance: none; -webkit-appearance: none; padding-right: 28px;
    background-image:
      linear-gradient(to top right, transparent calc(50% - 0.75px), var(--text-muted) calc(50% - 0.75px),
        var(--text-muted) calc(50% + 0.75px), transparent calc(50% + 0.75px)),
      linear-gradient(to top left, transparent calc(50% - 0.75px), var(--text-muted) calc(50% - 0.75px),
        var(--text-muted) calc(50% + 0.75px), transparent calc(50% + 0.75px));
    background-repeat: no-repeat; background-size: 5px 5px; background-position: right 15px center, right 10px center;
  }
  button:hover { background: var(--wash); }
  button[aria-pressed="true"], button[aria-checked="true"] { border-color: var(--text-secondary); font-weight: 600; }
  /* Toggles reserve their bold width (data-label repeats the text), so pressing one doesn't resize it. */
  button[data-label] { display: inline-grid; justify-items: center; }
  button[data-label]::after { content: attr(data-label); font-weight: 600; height: 0; overflow: hidden; visibility: hidden; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
  /* The top bar holds the filters that change every view; it stays pinned
     while scrolling, except on narrow screens where it would cover too much. */
  #filters {
    position: sticky; top: 0; z-index: 5; margin-top: 12px;
    background: var(--page); border-bottom: 1px solid var(--grid);
  }
  @media (max-width: 700px) { #filters { position: static; } }
  #filter-controls, #filter-more { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
  #filter-more { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--grid); }
  #more-toggle { display: inline-flex; gap: 6px; align-items: center; }
  .badge {
    min-width: 18px; padding: 0 5px; border-radius: 999px; text-align: center;
    font-size: 11px; line-height: 18px; background: var(--series-1); color: #fff;
  }
  .chev {
    width: 6px; height: 6px; margin: -3px 2px 0; border: solid var(--text-muted);
    border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); transition: transform 0.15s;
  }
  button[aria-expanded="true"] .chev, .chev.up { margin-top: 3px; transform: rotate(-135deg); }
  button.sort { display: inline-flex; gap: 6px; align-items: center; border: none; background: none; padding: 0; font-weight: 600; color: inherit; }
  button.sort:hover { background: none; color: var(--text-primary); }
  .menu { position: relative; display: inline-block; }
  .menu-button { display: inline-flex; gap: 10px; align-items: center; justify-content: space-between; min-width: 170px; }
  .menu-list {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 10; display: grid; gap: 1px;
    width: max-content; min-width: 100%; max-width: 360px; max-height: 320px; overflow-y: auto;
    padding: 6px; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  }
  .menu-list .option {
    display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center;
    padding: 3px 6px; border-radius: 4px; cursor: pointer;
  }
  .menu-list .option:hover { background: var(--wash); }
  .menu-list input { margin: 0; width: 16px; height: 16px; accent-color: var(--series-1); }
  .menu-list .count { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  #filter-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 8px; }
  #filter-chips .label { color: var(--text-muted); margin-right: 2px; }
  .chip {
    display: inline-flex; align-items: center; padding: 1px 3px 1px 10px;
    border-radius: 999px; background: var(--wash); border: 1px solid var(--border);
  }
  .chip button {
    border: none; background: none; padding: 0 6px; border-radius: 999px;
    color: var(--text-secondary); font-size: 16px; line-height: 1.2;
  }
  .chip button:hover { color: var(--text-primary); background: var(--wash); }
  #filter-chips button.link {
    border: none; background: none; margin-left: auto; padding: 2px 4px;
    color: var(--text-secondary); text-decoration: underline;
  }
  #filter-chips button.link:hover { color: var(--text-primary); }
  #filter-inner { padding-top: 10px; }
  #tabs { display: flex; gap: 4px; margin-top: 10px; }
  #tabs .tab {
    border: none; border-radius: 6px 6px 0 0; background: none; padding: 8px 14px 7px;
    color: var(--text-secondary); font-size: 15px; border-bottom: 3px solid transparent;
  }
  #tabs .tab:hover { color: var(--text-primary); background: var(--wash); }
  #tabs .tab[aria-selected="true"] { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--series-1); }
  section.panel { padding-top: 14px; }
  figure.view, .details { scroll-margin-top: calc(var(--bar-h, 0px) + 12px); }
  .plot .hit.clickable { cursor: pointer; }
  .details .table-wrap { max-height: 440px; margin-top: 8px; }
  .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1100px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid > figure.view { grid-column: 1 / -1; }
    .grid > figure.view.half { grid-column: auto; }
  }
  .filter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .filter > .label { color: var(--text-secondary); margin-right: 2px; }
  .choice { display: inline-flex; gap: 6px; }
  .filter label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .filter label.check input { margin: 0; width: 16px; height: 16px; accent-color: var(--series-1); }
  #views { padding-bottom: 40px; }
  figure.view {
    margin: 0; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; min-width: 0;
  }
  figure.view .head { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  figure.view h3 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; min-width: 200px; }
  figure.view .subtitle { color: var(--text-primary); margin: 4px 0 6px; max-width: 80ch; }
  figure.view.bare { background: none; border: none; padding: 0; }
  details.howto { color: var(--text-secondary); margin: 0 0 8px; max-width: 80ch; }
  details.howto summary { cursor: pointer; color: var(--text-muted); width: fit-content; }
  details.howto ul { margin: 6px 0 4px; padding-left: 18px; }
  details.howto li { margin: 2px 0; }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .tile {
    text-align: left; padding: 12px 14px; border-radius: 10px; background: var(--surface-1);
    border: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px;
  }
  .tile .value { font-size: 26px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .tile .what { color: var(--text-secondary); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--text-secondary); margin: 4px 0 8px; }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { display: block; }
  .plot { position: relative; width: 100%; }
  .plot svg { display: block; width: 100%; overflow: visible; }
  .plot text { fill: var(--text-muted); font-size: 11px; }
  .plot .grid line { stroke: var(--grid); }
  .plot .axis path, .plot .axis line { stroke: var(--axis); }
  .plot .label { fill: var(--text-secondary); font-size: 12px; }
  .plot .halo { paint-order: stroke; stroke: var(--surface-1); stroke-width: 3px; stroke-linejoin: round; }
  .plot .marker line { stroke: var(--text-muted); }
  .plot .hit { fill: transparent; outline: none; }
  .plot .hit:hover, .plot .hit:focus { fill: var(--wash); }
  .plot .hit:focus-visible { stroke: var(--series-1); stroke-width: 2px; }
  .empty { color: var(--text-secondary); padding: 24px 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 8px; }
  .controls:empty { display: none; }
  .controls > .label { color: var(--text-secondary); margin-right: 2px; }
  input.short { width: 4.5em; }
  .filter .error { color: var(--critical); }
  .filter .error:empty { display: none; }
  .plot .name { fill: var(--text-secondary); font-size: 13px; }
  .plot .name.current { fill: var(--text-primary); font-weight: 600; }
  .plot .cell-ink { fill: var(--text-primary); font-size: 12px; }
  .plot .cell-ink-inverse { fill: var(--seq-ink-inverse); font-size: 12px; }
  .plot .scroll { max-height: 480px; overflow-y: auto; }
  .plot .label.current { fill: var(--text-primary); font-weight: 600; }
  .filter .note { color: var(--text-muted); }
  table.data.themes th, table.data.themes td { text-align: left; vertical-align: top; }
  /* Fixed column widths, as shares of the table; narrow screens scroll sideways. */
  table.data.themes { table-layout: fixed; min-width: 900px; }
  table.data.themes th:nth-child(1) { width: 20%; }
  table.data.themes th:nth-child(2) { width: 8%; }
  table.data.themes th:nth-child(3), table.data.themes th:nth-child(4) { width: 9%; }
  table.data.themes th:nth-child(5) { width: 7%; }
  table.data.themes th:nth-child(6) { width: 8%; }
  table.data.themes td:first-child, table.data.themes td:first-child .link-button { white-space: nowrap; }
  table.data.themes td.nowrap { white-space: nowrap; }
  table.data.themes td.people { color: var(--text-secondary); }
  table.themes tr.selected td { background: var(--wash); }
  .link-button { border: none; background: none; padding: 0; color: var(--series-1); font-weight: 600; text-align: left; }
  .link-button:hover { background: none; text-decoration: underline; }
  .link-button[aria-expanded="true"] { text-decoration: underline; }
  .details { margin-top: 12px; border-top: 1px solid var(--grid); padding-top: 12px; }
  .details-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .details-head h3 { font-size: 15px; margin: 0; flex: 1; min-width: 200px; }
  .details .meta { color: var(--text-secondary); }
  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 8px; }
  .groups h4 { margin: 0 0 4px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .groups ul { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
  .groups li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--grid); }
  .groups .count { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .groups .empty { margin: 0; padding: 3px 0; }
  .doc-list { list-style: none; padding: 0; margin: 8px 0; max-height: 480px; overflow-y: auto; }
  .doc-list li { padding: 4px 0; border-bottom: 1px solid var(--grid); display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .doc-list a { color: var(--text-primary); }
  table.data { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data th { color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; background: var(--surface-1); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .status {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
    border: 1.5px solid var(--text-muted); vertical-align: 1px; box-sizing: border-box;
  }
  .status.on { background: var(--series-1); border-color: var(--series-1); }
  .status-key { margin: 6px 0 0; color: var(--text-secondary); font-size: 13px; }
  .status-key .status { margin-left: 2px; margin-right: 5px; }
  .status-key .status:not(:first-child) { margin-left: 14px; }
  table.data.activity th, table.data.activity td { text-align: left; }
  table.data.activity td:nth-child(-n+2) { white-space: nowrap; color: var(--text-secondary); padding-right: 20px; }
  table.data.activity td a { color: var(--text-primary); }
  .legend .key .status { margin-right: 0; }
  table.data.activity th:first-child, table.data.activity td:first-child { padding-left: 0; }
  figure[id*="activity"] .table-wrap { max-height: min(60vh, 520px); }
  table.data.people th.left, table.data.people td.left { text-align: left; }
  table.data.people td:first-child { white-space: nowrap; }
  .cellbar { display: flex; align-items: center; gap: 8px; }
  .cellbar .num { min-width: 6ch; text-align: right; }
  .cellbar .track { flex: 0 1 120px; min-width: 40px; height: 10px; }
  .cellbar .bar { display: block; height: 100%; min-width: 1px; background: var(--series-1); border-radius: 0 2px 2px 0; }
  /* Positioned, so the absolutely placed .sr-only text inside is clipped and scrolls with the box
     instead of stretching the page. */
  .table-wrap { max-height: 420px; overflow: auto; position: relative; }
  #tooltip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); min-width: 160px;
  }
  #tooltip .title { color: var(--text-secondary); margin-bottom: 4px; }
  #tooltip .title:only-child { margin-bottom: 0; max-width: 300px; }
  .has-tip select:disabled { pointer-events: none; }
  #tooltip .row { display: flex; align-items: center; gap: 8px; }
  #tooltip .row .value { font-weight: 600; min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
  #tooltip .row .name { color: var(--text-secondary); }
  #check-panel:empty { display: none; }
  #check-panel .box { margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface-1); }
  #check-panel .ok { color: var(--good); font-weight: 600; }
  #check-panel .bad { color: var(--critical); font-weight: 600; }
  #check-panel pre { white-space: pre-wrap; margin: 6px 0 0; color: var(--text-secondary); }
</style>
</head>
<body>
<header>
  <h1 id="title">MaterialX Project Analytics</h1>
  <select id="project" aria-label="Project" hidden></select>
  <button id="theme" type="button"></button>
</header>
<div id="check-panel"></div>
<div id="filters" role="region" aria-label="Filters">
  <div id="filter-inner">
    <div id="filter-controls" role="toolbar" aria-label="Filters for every tab"></div>
    <div id="filter-more" hidden></div>
    <div id="filter-chips" hidden></div>
    <div id="tabs" role="tablist" aria-label="Views"></div>
  </div>
</div>
<main id="views"></main>

<script>
/* core.js */
// Page core: the data, state kept in the URL hash, the filter/view registry,
// and helpers every view shares (periods, data-source markers, tooltip, DOM).
// Filters and views are separate files that call PS.registerFilter/View.

const PS = (() => {
  const data = JSON.parse(document.getElementById("data").textContent);
  const DAY_MS = 86400000;
  const FLAGS = new Set(["check"]);  // hash keys without a value
  const filters = [];
  const views = [];
  const startHooks = [];
  let state = {};

  // ---- state in the URL hash: #kinds=commit,pr&period=year&check -------------

  function readHash() {
    const out = {};
    for (const part of location.hash.replace(/^#/, "").split("&")) {
      if (!part) continue;
      const [key, value = ""] = part.split("=").map(decodeURIComponent);
      out[key] = FLAGS.has(key) ? true : value;
    }
    return out;
  }

  // The hash for a state, without the keys in `skip`.
  function hashOf(s, skip = []) {
    const parts = [];
    for (const [key, value] of Object.entries(s)) {
      if (skip.includes(key) || value === undefined || value === null || value === "" || value === false) continue;
      parts.push(value === true ? encodeURIComponent(key)
        : `${encodeURIComponent(key)}=${encodeURIComponent(value)}`);
    }
    return parts.length ? "#" + parts.join("&") : "";
  }

  function writeHash() {
    history.replaceState(null, "", hashOf(state) || location.pathname);
  }

  function set(changes) {
    Object.assign(state, changes);
    for (const filter of filters) if (filter.sync) filter.sync(state);
    writeHash();
    renderAll();
  }

  // The keys the top-bar filters own, cleared by Reset.
  const FILTER_KEYS = ["from", "to", "kinds", "without", "theme"];



  // ---- registry ---------------------------------------------------------------

  // filter: {id, init?(state), control(el, state, set), predicate?(state) -> (i) => bool,
  //          sync?(state), target?, secondary?, chips?(state)}; sync updates the
  //          control when another part of the page changes its state. A control
  //          with a `target` view id sits in that view instead of the top bar
  //          (settings, not filters). A `secondary` control waits behind "More
  //          filters". chips(state) lists [{text, clear}] for what the filter
  //          changes now; clear is the state patch that undoes it.
  function registerFilter(filter) { if (featureOn(filter)) filters.push(filter); }
  // A filter or view with a `feature` (e.g. "themes") exists only when
  // data.features turns it on.
  const featureOn = item => !item.feature || Boolean(data.features[item.feature]);
  // view: {id, title, order, tab, feature?, width?, bare?, noTable?, render(figure, ctx)};
  // ctx = {data, rows, rowsExcept(filterId), state, set}. Views appear by
  // `order` within their tab. width "half" pairs views on wide screens.
  // A bare view has no card or title.
  function registerView(view) { if (featureOn(view)) views.push(view); }

  // Tabs, in order; the first is the default. Only the open tab's views are
  // drawn.
  const TABS = [
    {id: "overview", label: "Overview"},
    {id: "people", label: "People"},
    {id: "themes", label: "Themes"},
  ];
  const tabOf = view => view.tab || TABS[0].id;
  function activeTab() {
    return TABS.some(t => t.id === state.tab && views.some(v => tabOf(v) === t.id)) ? state.tab : TABS[0].id;
  }
  function onStart(fn) { startHooks.push(fn); }

  // Activity row indexes passing every filter (except the one named `skip`).
  function filteredRows(skip) {
    const tests = filters.filter(f => f.id !== skip)
      .map(f => f.predicate && f.predicate(state)).filter(Boolean);
    const n = data.activity.day.length;
    const rows = [];
    outer: for (let i = 0; i < n; i++) {
      for (const test of tests) if (!test(i)) continue outer;
      rows.push(i);
    }
    return rows;
  }

  // One removable chip per filter that is narrowing the data, then Reset all.
  // The badge on "More filters" counts the chips of filters kept behind it.
  function renderChips() {
    const box = document.getElementById("filter-chips");
    const chips = filters.flatMap(f => (f.chips ? f.chips(state) : []).map(c => ({...c, secondary: f.secondary})));
    const badge = document.getElementById("more-badge");
    if (badge) {
      const hidden = chips.filter(c => c.secondary).length;
      badge.hidden = !hidden;
      badge.textContent = hidden;
    }
    box.hidden = !chips.length;
    box.replaceChildren();
    if (!chips.length) return;
    box.append(el("span", {class: "label"}, "Filtered by"));
    for (const c of chips) {
      box.append(el("span", {class: "chip"}, c.text, el("button", {
        type: "button", "aria-label": `Remove filter: ${c.text}`, onclick: () => set(c.clear),
      }, "×")));
    }
    box.append(el("button", {
      type: "button", class: "link",
      onclick: () => set(Object.fromEntries(FILTER_KEYS.map(k => [k, undefined]))),
    }, "Reset all"));
  }

  function renderAll() {
    const except = new Map();
    const rowsExcept = id => {
      if (!except.has(id)) except.set(id, filteredRows(id));
      return except.get(id);
    };
    const ctx = {data, rows: filteredRows(), rowsExcept, state, set};
    renderChips();
    const open = activeTab();
    for (const tab of TABS) {
      if (!tab.button) continue;
      const selected = tab.id === open;
      tab.button.setAttribute("aria-selected", String(selected));
      tab.button.tabIndex = selected ? 0 : -1;
      tab.panel.hidden = !selected;
    }
    for (const view of views) {
      if (tabOf(view) !== open) continue;
      try {
        view.render(view.figure, ctx);
      } catch (err) {
        console.error(err);
        view.figure.plot.replaceChildren(el("p", {class: "empty"}, `Error: ${err.message}`));
      }
    }
  }

  // ---- DOM helpers (text always goes in as textContent) -----------------------

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value === undefined || value === null || value === false) continue;
      if (key === "onclick" || key === "onchange" || key === "oninput") node[key] = value;
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  function makeFigure(view) {
    const tableButton = el("button", {type: "button", "aria-pressed": "false", "data-label": "Table"}, "Table");
    const classes = ["view", view.width, view.bare ? "bare" : null].filter(Boolean).join(" ");
    const howtoBody = el("div", {class: "howto-body"});
    const figure = {
      root: el("figure", {class: classes, id: `view-${view.id}`}),
      subtitle: el("p", {class: "subtitle"}),
      howto: el("details", {class: "howto", hidden: true}, el("summary", {}, "How to read this"), howtoBody),
      howtoBody,
      controls: el("div", {class: "controls"}),
      legend: el("div", {class: "legend"}),
      plot: el("div", {class: "plot"}),
      table: el("div", {class: "table-wrap", hidden: true}),
      details: el("div", {class: "details", id: `details-${view.id}`, hidden: true}),
      showTable: false,
    };
    tableButton.onclick = () => {
      figure.showTable = !figure.showTable;
      tableButton.setAttribute("aria-pressed", String(figure.showTable));
      figure.table.hidden = !figure.showTable;
      figure.plot.hidden = figure.showTable;
      figure.legend.hidden = figure.showTable;
    };
    if (view.bare) {
      figure.root.append(figure.plot);
      return figure;
    }
    figure.root.append(
      el("div", {class: "head"}, el("h3", {}, view.title), view.noTable ? null : tableButton),
      figure.subtitle, figure.howto, figure.controls, figure.legend, figure.plot, figure.table, figure.details,
    );
    return figure;
  }

  // The collapsed "How to read this" under a view's question: a list of
  // short definitions. Its open state survives re-renders.
  function fillHowto(figure, items) {
    figure.howto.hidden = !items.length;
    figure.howtoBody.replaceChildren(el("ul", {}, items.map(item => el("li", {}, item))));
  }

  // Open the tab holding a view or its details area (by element id), apply
  // any state `changes` (e.g. which list to show), and scroll there, clear of
  // the pinned bar.
  function jumpTo(id, changes = {}) {
    const view = views.find(v => id === `view-${v.id}` || id === `details-${v.id}`);
    const tab = view ? tabOf(view) : activeTab();
    if (tab !== activeTab() || Object.keys(changes).length) {
      set({...changes, tab: tab === TABS[0].id ? undefined : tab});
    }
    const node = document.getElementById(id);
    if (node) requestAnimationFrame(() => node.scrollIntoView({behavior: "smooth", block: "start"}));
  }

  function openTab(id) {
    set({tab: id === TABS[0].id ? undefined : id});
  }

  // columns: [{name, value(row)}]; a "Table" toggle shows it instead of the plot.
  function fillTable(figure, columns, rows) {
    const head = el("tr", {}, columns.map(c => el("th", {scope: "col"}, c.name)));
    const body = rows.map(r => el("tr", {}, columns.map(c => {
      const v = c.value(r);
      return el("td", {}, v === null || v === undefined ? "–" : v);
    })));
    figure.table.replaceChildren(el("table", {class: "data"}, el("thead", {}, head), el("tbody", {}, body)));
  }

  // keys: [{name, color, shape: "rect"|"line"}]
  function fillLegend(figure, keys) {
    figure.legend.replaceChildren(...keys.map(k => el("span", {class: "key"}, swatch(k), k.name)));
  }

  function swatch(key) {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("width", "14");
    svg.setAttribute("height", "10");
    const mark = document.createElementNS(ns, key.shape === "line" ? "line" : "rect");
    if (key.shape === "line") {
      Object.entries({x1: 0, x2: 14, y1: 5, y2: 5, stroke: key.color, "stroke-width": 2,
        "stroke-linecap": "round"}).forEach(([a, v]) => mark.setAttribute(a, v));
    } else {
      Object.entries({x: 1, y: 0, width: 12, height: 10, rx: 2, fill: key.color})
        .forEach(([a, v]) => mark.setAttribute(a, v));
    }
    svg.append(mark);
    return svg;
  }

  // Keyboard for a list of marks: one tab stop (at index `current`); the
  // prev/next keys, Home, and End move focus between them.
  function rovingFocus(nodes, current, prevKey, nextKey) {
    nodes.forEach((node, i) => {
      node.setAttribute("tabindex", i === current ? 0 : -1);
      node.addEventListener("keydown", event => {
        const to = {[prevKey]: i - 1, [nextKey]: i + 1, Home: 0, End: nodes.length - 1}[event.key];
        if (to === undefined) return;
        event.preventDefault();
        const j = Math.max(0, Math.min(nodes.length - 1, to));
        node.setAttribute("tabindex", -1);
        nodes[j].setAttribute("tabindex", 0);
        nodes[j].focus();
      });
    });
  }

  // A person's display name, and a GitHub profile link when a login is known.
  function personName(i) { return data.people.name[i] || data.people.login[i] || `#${i}`; }
  function personLink(i) {
    const login = data.people.login[i];
    return login ? el("a", {href: `https://github.com/${login}`}, personName(i)) : personName(i);
  }

  // The GitHub page of a document (PR, issue, or commit) of this project.
  function docUrl(d) {
    const repo = data.project.github;
    const ref = data.docs.ref[d];
    const source = data.docs.source[d];
    return source === "pr" ? `https://github.com/${repo}/pull/${ref}`
      : source === "issue" ? `https://github.com/${repo}/issues/${ref}`
      : `https://github.com/${repo}/commit/${ref}`;
  }

  // ---- tooltip ------------------------------------------------------------------

  const tooltip = document.getElementById("tooltip");

  // rows: [{name, value, color?}]; the value leads, the name follows.
  function showTooltip(anchor, title, rows) {
    tooltip.replaceChildren(
      el("div", {class: "title"}, title),
      ...rows.map(r => el("div", {class: "row"},
        r.color ? swatch({color: r.color, shape: "line"}) : el("span", {style: "width:14px"}),
        el("span", {class: "value"}, r.value),
        el("span", {class: "name"}, r.name))),
    );
    tooltip.style.display = "block";
    const box = tooltip.getBoundingClientRect();
    let x, y;
    if (anchor instanceof Event && "clientX" in anchor) {
      x = anchor.clientX + 14;
      y = anchor.clientY + 14;
    } else {
      const r = anchor.getBoundingClientRect();
      x = r.right + 8;
      y = r.top;
    }
    if (x + box.width > window.innerWidth - 8) x = Math.max(8, x - box.width - 28);
    if (y + box.height > window.innerHeight - 8) y = Math.max(8, window.innerHeight - box.height - 8);
    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${y}px`;
  }

  function hideTooltip() { tooltip.style.display = "none"; }

  // Hover hints. The browser's own `title` tooltip waits about a second and
  // often goes unseen, so the first hover moves the text to data-tip (and
  // aria-description) and shows it in the page tooltip after a short pause.
  function setupHints() {
    let current = null;
    let timer = null;
    const hide = () => {
      clearTimeout(timer);
      current = null;
      hideTooltip();
    };
    document.addEventListener("mouseover", event => {
      const target = event.target.closest("[title], [data-tip]");
      if (!target || target === current) return;
      hide();
      const text = target.dataset.tip || target.getAttribute("title");
      if (!text) return;
      if (target.hasAttribute("title")) {
        target.dataset.tip = text;
        target.setAttribute("aria-description", text);
        target.removeAttribute("title");
      }
      current = target;
      timer = setTimeout(() => showTooltip(event, text, []), 120);
    });
    document.addEventListener("mouseout", event => {
      if (current && !current.contains(event.relatedTarget)) hide();
    });
    document.addEventListener("mousedown", hide);
  }

  // Width in px of text drawn at `size` px in the page font, for fitting labels.
  const measure = document.createElement("canvas").getContext("2d");
  function textWidth(text, size) {
    measure.font = `${size}px ${getComputedStyle(document.body).fontFamily}`;
    return measure.measureText(text).width;
  }

  // ---- time: whole days since 1970-01-01 (UTC) -------------------------------

  function dayToDate(day) { return new Date(day * DAY_MS); }
  function dateToDay(text) { return Math.floor(Date.parse(`${text}T00:00:00Z`) / DAY_MS); }
  function dayToText(day) { return dayToDate(day).toISOString().slice(0, 10); }
  function monthIndex(day) { const d = dayToDate(day); return d.getUTCFullYear() * 12 + d.getUTCMonth(); }
  function monthStart(index) { return Date.UTC(Math.floor(index / 12), index % 12, 1) / DAY_MS; }

  function bisectRight(sorted, x) {
    let lo = 0, hi = sorted.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (x < sorted[mid]) hi = mid; else lo = mid + 1;
    }
    return lo;
  }

  const MONTHS = {month: 1, quarter: 3, year: 12};
  const PERIOD_NAMES = {month: "month", quarter: "quarter", year: "year", release: "release cycle"};

  // A period scheme maps a day to a period key, and keys to labels and bounds.
  // Months, quarters, and years match projstats/retention.py; release cycles
  // match projstats/documents.py release_periods().
  // "3.2" -> "3.3 dev" (matches projstats/releases.py next_version).
  function openName(version) {
    const [major, minor] = version.split(".");
    return /^\d+$/.test(major) && /^\d+$/.test(minor) ? `${major}.${Number(minor) + 1} dev` : `after ${version}`;
  }

  function periodScheme(kind) {
    if (kind === "release") {
      const days = data.releases.day;
      const versions = data.releases.version;
      const last = days.length;
      return {
        kind, name: PERIOD_NAMES[kind],
        key: day => bisectRight(days, day),
        // The cycle in progress is named for the next version, so it needs no "so far".
        label: k => (k < last ? versions[k] : openName(versions[last - 1])),
        short: k => (k < last ? versions[k] : openName(versions[last - 1])),
        soFar: false,
        bounds: k => [k === 0 ? null : days[k - 1], k < last ? days[k] : null],
      };
    }
    const n = MONTHS[kind];
    const label = k => (kind === "month"
      ? `${Math.floor(k / 12)}-${String((k % 12) + 1).padStart(2, "0")}`
      : kind === "quarter" ? `${Math.floor(k / 4)} Q${(k % 4) + 1}` : String(k));
    return {
      kind, name: PERIOD_NAMES[kind],
      key: day => Math.floor(monthIndex(day) / n),
      label, short: label, soFar: true,
      bounds: k => [monthStart(k * n), monthStart((k + 1) * n)],
    };
  }

  // Where each included activity kind's data starts (except the earliest),
  // so a jump caused by a new data source isn't read as growth.
  const KIND_NAMES = {commit: "commits", pr: "PRs", review: "reviews", issue: "issues", comment: "comments"};
  function sourceMarkers(kinds) {
    const byDay = new Map();
    for (const kind of kinds) {
      const day = data.sources[kind];
      if (day === undefined) continue;
      if (!byDay.has(day)) byDay.set(day, []);
      byDay.get(day).push(KIND_NAMES[kind] || kind);
    }
    // Sources starting within a month of each other share one marker.
    const merged = [];
    for (const day of [...byDay.keys()].sort((a, b) => a - b)) {
      const prev = merged[merged.length - 1];
      if (prev && day - prev.day < 31) prev.names.push(...byDay.get(day));
      else merged.push({day, names: [...byDay.get(day)]});
    }
    return merged.slice(1).map(m => ({day: m.day, label: `${m.names.join(", ")} start`}));
  }

  // Labels for sourceMarkers(), stacked 14px apart from y0 and kept between
  // minX and maxX (next to their line when there is room).
  function markerLabels(g, markers, x, y0, minX, maxX) {
    markers.forEach((m, i) => {
      const w = textWidth(m.label, 11);
      const left = Math.max(minX, Math.min(x(m.key) + 4, maxX - w));
      g.append("text").attr("x", left).attr("y", y0 + i * 14).text(m.label);
    });
  }

  // Text cut with "…" to fit `max` px at `size` px.
  function fitText(text, size, max) {
    if (textWidth(text, size) <= max) return text;
    let n = text.length;
    while (n > 1 && textWidth(`${text.slice(0, n)}…`, size) > max) n -= 1;
    return `${text.slice(0, n)}…`;
  }

  function selectedKinds() {
    return state.kinds ? state.kinds.split(",").filter(k => data.kinds.includes(k)) : data.kinds.slice();
  }

  // ---- start ----------------------------------------------------------------------

  // Color theme: one button showing the current choice's icon; each click
  // moves to the next of system (auto), light, and dark.
  const THEMES = ["auto", "light", "dark"];
  const THEME_ICONS = {
    light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4' +
      'M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    auto: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
    dark: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  };
  const THEME_NAMES = {light: "Light", auto: "System", dark: "Dark"};
  function applyTheme() {
    const theme = THEMES.includes(state.colors) ? state.colors : "auto";
    if (theme === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = theme;
    const next = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    const button = document.getElementById("theme");
    const label = `${THEME_NAMES[theme]} theme (click for ${THEME_NAMES[next].toLowerCase()})`;
    button.setAttribute("aria-label", label);
    button.title = label;
    // Fixed icon markup from THEME_ICONS, never data.
    button.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" ` +
      `stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${THEME_ICONS[theme]}</svg>`;
  }

  // Other projects' pages sit next to this one (data.siblings, set when the
  // page is built). The title ends with the dropdown: Project Analytics: [name].
  // Switching keeps the view except what belongs to one project.
  const PROJECT_ONLY = ["theme", "without", "who", "pwho"];
  function setupProjectSwitch() {
    const select = document.getElementById("project");
    const projects = data.siblings || [];
    if (projects.length < 2) return;
    select.append(...projects.map((s, i) => el("option", {value: i}, s.name)));
    const current = projects.findIndex(s => s.current);
    select.value = current;
    const title = document.getElementById("title");
    const pick = el("span", {class: "project-pick"});
    select.replaceWith(pick);
    pick.append(select);
    if (title.textContent.startsWith(projects[current].name)) {
      // "Project Analytics: [name]", so the fixed text never moves between projects.
      title.replaceChildren(`${title.textContent.slice(projects[current].name.length).trim()}:`, pick);
      // Fit the select to the open project's name, not the longest one:
      // text, left padding, the arrow's room on the right, and the border.
      const ctx = document.createElement("canvas").getContext("2d");
      ctx.font = `600 20px ${getComputedStyle(document.body).fontFamily}`;
      select.style.width = `${Math.ceil(ctx.measureText(projects[current].name).width) + 44}px`;
    }
    select.onchange = () => {
      const target = projects[select.value];
      if (target.current) return;
      location.href = target.href + hashOf(state, PROJECT_ONLY);
    };
    select.hidden = false;
  }

  function start() {
    state = readHash();
    const p = data.project;
    const longDate = d => new Date(d * DAY_MS).toLocaleDateString("en-US",
      {year: "numeric", month: "short", day: "numeric", timeZone: "UTC"});
    const about = document.getElementById("about");
    about.title = `Page built ${longDate(dateToDay(p.generated))}`;
    about.append(`Data from `, el("a", {href: `https://github.com/${p.github}`}, p.label || p.github),
      `, through ${p.data_end === null ? "–" : longDate(p.data_end)}`);
    document.getElementById("theme").onclick = () => {
      const theme = THEMES.includes(state.colors) ? state.colors : "auto";
      const next = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
      state.colors = next === "auto" ? undefined : next;
      applyTheme();
      writeHash();
      renderAll();
    };
    applyTheme();
    setupHints();
    setupProjectSwitch();

    // Tabs: a tab list at the bottom of the pinned bar, right above the
    // panels. Arrow keys, Home, and End move between tabs and open them.
    const main = document.getElementById("views");
    const tabList = document.getElementById("tabs");
    views.sort((a, b) => (a.order || 0) - (b.order || 0));
    const tabs = TABS.filter(tab => views.some(v => tabOf(v) === tab.id));
    tabs.forEach((tab, i) => {
      const grid = el("div", {class: "grid"});
      tab.button = el("button", {
        type: "button", role: "tab", class: "tab", id: `tab-${tab.id}`,
        "aria-controls": `panel-${tab.id}`, "data-label": tab.label,
      }, tab.label);
      tab.button.onclick = () => openTab(tab.id);
      tab.button.addEventListener("keydown", event => {
        const to = {ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1}[event.key];
        if (to === undefined) return;
        event.preventDefault();
        const next = tabs[(to + tabs.length) % tabs.length];
        openTab(next.id);
        next.button.focus();
      });
      tab.panel = el("section", {
        class: "panel", id: `panel-${tab.id}`, role: "tabpanel", "aria-labelledby": `tab-${tab.id}`,
      }, grid);
      for (const view of views.filter(v => tabOf(v) === tab.id)) {
        view.figure = makeFigure(view);
        grid.append(view.figure.root);
      }
      tabList.append(tab.button);
      main.append(tab.panel);
    });

    const bar = document.getElementById("filter-controls");
    const more = document.getElementById("filter-more");
    for (const filter of filters) {
      if (filter.init) filter.init(state);
      const box = el("div", {class: "filter", id: `filter-${filter.id}`});
      filter.control(box, state, set);
      const target = filter.target && views.find(v => v.id === filter.target);
      if (target) target.figure.controls.append(box);
      else if (filter.secondary) {
        if (box.childElementCount) more.append(box);
      } else bar.append(box);
    }
    if (more.childElementCount) {
      const toggle = el("button", {
        type: "button", id: "more-toggle", "aria-expanded": "true", "aria-controls": "filter-more",
      }, "More filters", el("span", {class: "badge", id: "more-badge", hidden: true}), el("span", {class: "chev", "aria-hidden": "true"}));
      more.hidden = false;
      toggle.onclick = () => {
        const opening = more.hidden;
        more.hidden = !opening;
        toggle.setAttribute("aria-expanded", String(opening));
      };
      bar.append(toggle);
    }

    // Sections scroll clear of the pinned bar, which grows when the extra
    // filters open or chips appear.
    const barNode = document.getElementById("filters");
    new ResizeObserver(() => {
      document.documentElement.style.setProperty("--bar-h", `${barNode.offsetHeight}px`);
    }).observe(barNode);
    writeHash();
    renderAll();
    for (const hook of startHooks) hook();

    let pending = null;
    window.addEventListener("resize", () => {
      clearTimeout(pending);
      pending = setTimeout(renderAll, 150);
    });
    window.addEventListener("scroll", hideTooltip, {passive: true});
  }

  return {
    data, get state() { return state; }, set, start,
    registerFilter, registerView, onStart,
    el, fillTable, fillLegend, swatch, fillHowto, jumpTo, openTab, showTooltip, hideTooltip, textWidth, rovingFocus,
    personName, personLink, docUrl, dayToDate,
    dayToText, dateToDay, periodScheme, sourceMarkers, markerLabels, fitText, selectedKinds, KIND_NAMES,
  };
})();

</script>
<script>
/* metrics.js */
// Retention math in the browser, mirroring projstats/retention.py at day
// precision. #check compares these results with Python's reference numbers.

PS.metrics = (() => {
  // rows: activity indexes; scheme: PS.periodScheme(...); gapDays: return gap.
  // Returns one row per period from the first to the last with activity,
  // empty periods included. Mirrors retention.period_counts().
  function periodCounts(rows, data, scheme, gapDays) {
    if (!rows.length) return [];
    const A = data.activity;
    const days = new Map();  // person -> days
    let minKey = Infinity, maxKey = -Infinity, dataEnd = -Infinity;
    for (const i of rows) {
      const day = A.day[i];
      const person = A.person[i];
      if (!days.has(person)) days.set(person, []);
      days.get(person).push(day);
      const key = scheme.key(day);
      if (key < minKey) minKey = key;
      if (key > maxKey) maxKey = key;
      if (day > dataEnd) dataEnd = day;
    }
    const out = new Map();
    for (let key = minKey; key <= maxKey; key++) {
      const [start, end] = scheme.bounds(key);
      out.set(key, {
        key, label: scheme.label(key), short: scheme.short(key), start, end,
        active: 0, new: 0, returning: 0, continuing: 0, lastSeen: null,
        activity: 0, partial: key === maxKey, people: [],
      });
    }
    const lastSeen = new Map();
    for (const [person, list] of days) {
      list.sort((a, b) => a - b);
      let prev = null;
      let i = 0;
      while (i < list.length) {
        const key = scheme.key(list[i]);
        let j = i;
        while (j + 1 < list.length && scheme.key(list[j + 1]) === key) j++;
        const row = out.get(key);
        row.active += 1;
        row.activity += j - i + 1;
        const kind = prev === null ? "new" : list[i] - prev >= gapDays ? "returning" : "continuing";
        row[kind] += 1;
        row.people.push({person, kind, activity: j - i + 1});
        prev = list[j];
        i = j + 1;
      }
      const lastKey = scheme.key(list[list.length - 1]);
      lastSeen.set(lastKey, (lastSeen.get(lastKey) || 0) + 1);
    }
    for (const row of out.values()) {
      if (row.end !== null && dataEnd - row.end >= gapDays) {
        row.lastSeen = lastSeen.get(row.key) || 0;
      }
    }
    return [...out.values()];
  }

  // rules: {core, regular} shares of all activity (e.g. 0.8, 0.95). Returns a
  // function from a person's activity count to their segment. Mirrors
  // retention.segments(): one-time is exactly one activity; ranked by
  // activity, core is the top group that reaches the core share and regular
  // the next group up to the regular share, ties at a cutoff included.
  function segmenter(counts, rules) {
    const total = counts.reduce((sum, n) => sum + n, 0);
    const ranked = [...counts].sort((a, b) => b - a);
    const cutoff = share => {
      let run = 0;
      for (const n of ranked) {
        run += n;
        if (run >= share * total) return n;
      }
      return 0;
    };
    const coreMin = cutoff(rules.core), regularMin = cutoff(rules.regular);
    return n => (n === 1 ? "one-time" : n >= coreMin ? "core" : n >= regularMin ? "regular" : "casual");
  }

  // Cadence per person over `rows`. Mirrors retention.person_stats():
  // segments come from each person's share of the activity in `segmentRows`
  // (default: `rows`), and "current" means active within gapDays of the last
  // day in `rows`. Passing the rows with everyone counted keeps the same
  // people in each segment when someone is left out of `rows`.
  // Returns {stats, dataEnd}.
  function personStats(rows, data, rules, gapDays, segmentRows = rows) {
    const A = data.activity;
    const days = new Map();
    let dataEnd = -Infinity;
    for (const i of rows) {
      const person = A.person[i];
      if (!days.has(person)) days.set(person, []);
      days.get(person).push(A.day[i]);
      if (A.day[i] > dataEnd) dataEnd = A.day[i];
    }
    const counts = new Map();
    for (const i of segmentRows) counts.set(A.person[i], (counts.get(A.person[i]) || 0) + 1);
    const segmentOf = segmenter([...counts.values()], rules);
    const quarterOf = PS.periodScheme("quarter").key;
    const yearOf = PS.periodScheme("year").key;
    const stats = [];
    for (const [person, list] of days) {
      list.sort((a, b) => a - b);
      const quarters = new Set(list.map(quarterOf)).size;
      const years = [...new Set(list.map(yearOf))].sort((a, b) => a - b);
      let longestGap = 0, returns = 0;
      for (let k = 1; k < list.length; k++) {
        const gap = list[k] - list[k - 1];
        if (gap > longestGap) longestGap = gap;
        if (gap >= gapDays) returns += 1;
      }
      const last = list[list.length - 1];
      stats.push({
        person, first: list[0], last, activity: list.length, quarters, years,
        longestGap, returns, segment: segmentOf(list.length),
        current: dataEnd - last < gapDays,
      });
    }
    stats.sort((a, b) => b.activity - a.activity || a.person - b.person);
    return {stats, dataEnd};
  }

  // Document index -> its theme indexes, and which documents are tagged.
  let docIndex = null;
  function themeIndex(data) {
    if (docIndex) return docIndex;
    const themesOf = new Map();
    for (let k = 0; k < data.themes.doc.length; k++) {
      const d = data.themes.doc[k];
      if (!themesOf.has(d)) themesOf.set(d, []);
      themesOf.get(d).push(data.themes.theme[k]);
    }
    const tagged = new Uint8Array(data.docs.day.length);
    for (const d of data.themes.tagged) tagged[d] = 1;
    docIndex = {themesOf, tagged};
    return docIndex;
  }

  // Theme stats per period, rising/fading labels, and top contributors.
  // Mirrors trends.analyze(): activity counts toward its document's themes,
  // shares are of activity on tagged documents, and only periods with at
  // least half their documents tagged ("covered") get shares and trends.
  // Trends compare the last covered period with all earlier covered ones.
  function themeTrends(rows, data, scheme, {
    skipInProgress = false, coverage = 0.5, rise = 1.5, fade = 0.67, minDocs = 5, top = 5,
  } = {}) {
    const D = data.docs, A = data.activity;
    const {themesOf, tagged} = themeIndex(data);
    const nThemes = data.themes.name.length;
    const noThemes = [];

    // Periods run from the first document's to the last's; anything outside
    // falls in the nearest one, as trends.period_indexes() does.
    let minKey = Infinity, maxKey = -Infinity;
    const docKey = D.day.map(day => scheme.key(day));
    for (const k of docKey) { if (k < minKey) minKey = k; if (k > maxKey) maxKey = k; }
    if (scheme.kind === "release") { minKey = 0; maxKey = data.releases.day.length; }
    const n = maxKey - minKey + 1;
    if (!(n > 0)) return {periods: [], recent: null, earlier: [], trends: new Map(), contributors: new Map()};
    const indexOf = day => Math.max(0, Math.min(n - 1, scheme.key(day) - minKey));
    const grid = () => Array.from({length: nThemes}, () => new Array(n).fill(0));

    const docsIn = new Array(n).fill(0), taggedIn = new Array(n).fill(0);
    const themeDocs = grid();
    const firstDoc = new Array(nThemes).fill(null);  // {day, p}
    for (let d = 0; d < D.day.length; d++) {
      const p = Math.max(0, Math.min(n - 1, docKey[d] - minKey));
      docsIn[p] += 1;
      if (!tagged[d]) continue;
      taggedIn[p] += 1;
      for (const t of themesOf.get(d) || noThemes) {
        themeDocs[t][p] += 1;
        if (firstDoc[t] === null || D.day[d] < firstDoc[t].day) firstDoc[t] = {day: D.day[d], p};
      }
    }

    const commit = data.kinds.indexOf("commit");
    const activityIn = new Array(n).fill(0);
    const code = grid(), discussion = grid();
    const people = new Map();  // t * n + p -> Set of people
    const byPerson = Array.from({length: nThemes}, () => new Map());
    const lastDay = new Array(nThemes).fill(null);
    for (const i of rows) {
      const d = A.doc[i];
      if (d < 0 || !tagged[d]) continue;
      const p = indexOf(A.day[i]);
      activityIn[p] += 1;
      const isCode = A.kind[i] === commit;
      for (const t of themesOf.get(d) || noThemes) {
        (isCode ? code : discussion)[t][p] += 1;
        const cell = t * n + p;
        if (!people.has(cell)) people.set(cell, new Set());
        people.get(cell).add(A.person[i]);
        const c = byPerson[t].get(A.person[i]) || {code: 0, discussion: 0};
        if (isCode) c.code += 1; else c.discussion += 1;
        byPerson[t].set(A.person[i], c);
        if (lastDay[t] === null || A.day[i] > lastDay[t]) lastDay[t] = A.day[i];
      }
    }

    const covered = docsIn.map((docs, p) => docs > 0 && taggedIn[p] / docs >= coverage);
    const present = [];
    for (let t = 0; t < nThemes; t++) {
      if (themeDocs[t].some(Boolean) || code[t].some(Boolean) || discussion[t].some(Boolean)) present.push(t);
    }
    const name = t => data.themes.name[t];

    const periods = [];
    for (let p = 0; p < n; p++) {
      const key = p + minKey;
      const stats = [];
      for (const t of present) {
        const c = code[t][p], dsc = discussion[t][p];
        if (!(c || dsc || themeDocs[t][p])) continue;
        stats.push({
          theme: t, docs: themeDocs[t][p], code: c, discussion: dsc,
          people: people.has(t * n + p) ? people.get(t * n + p).size : 0,
          share: covered[p] && activityIn[p] ? (c + dsc) / activityIn[p] : null,
        });
      }
      stats.sort((a, b) => (b.code + b.discussion) - (a.code + a.discussion) || name(a.theme).localeCompare(name(b.theme)));
      const newKnown = covered.slice(0, p).some(Boolean);
      periods.push({
        key, label: scheme.label(key), short: scheme.short(key),
        partial: scheme.kind === "release" ? key === data.releases.day.length : p === n - 1,
        docs: docsIn[p], tagged: taggedIn[p], covered: covered[p], activity: activityIn[p],
        themes: stats,
        newThemes: newKnown ? present.filter(t => firstDoc[t] && firstDoc[t].p === p).map(name).sort() : [],
        newKnown,
      });
    }

    const candidates = periods.map((x, p) => p)
      .filter(p => covered[p] && activityIn[p] > 0 && !(skipInProgress && periods[p].partial));
    const recent = candidates.length ? candidates[candidates.length - 1] : null;
    const earlier = candidates.slice(0, -1);
    const trends = new Map();
    if (recent !== null && earlier.length) {
      const base = earlier.reduce((sum, p) => sum + activityIn[p], 0);
      for (const t of present) {
        const total = code[t][recent] + discussion[t][recent];
        const before = earlier.reduce((sum, p) => sum + code[t][p] + discussion[t][p], 0);
        const recentShare = activityIn[recent] ? total / activityIn[recent] : 0;
        const earlierShare = base ? before / base : 0;
        const docs = [...earlier, recent].reduce((sum, p) => sum + themeDocs[t][p], 0);
        let label;
        if (docs < minDocs) label = "too few";
        else if (earlierShare === 0) label = recentShare > 0 ? "rising" : "steady";
        else if (recentShare >= rise * earlierShare) label = "rising";
        else if (recentShare <= fade * earlierShare) label = "fading";
        else label = "steady";
        trends.set(t, {label, recentShare, earlierShare, docs});
      }
    }

    const contributors = new Map();
    for (const t of present) {
      const ranked = [...byPerson[t]].sort((a, b) =>
        (b[1].code + b[1].discussion) - (a[1].code + a[1].discussion) ||
        PS.personName(a[0]).localeCompare(PS.personName(b[0])));
      contributors.set(t, ranked.slice(0, top).map(([person, c]) => ({person, ...c})));
    }
    return {periods, recent, earlier, trends, contributors, present, firstDoc, lastDay};
  }

  return {
    periodCounts, personStats, themeIndex, themeTrends,
    SEGMENTS: ["core", "regular", "casual", "one-time"],
  };
})();

</script>
<script>
/* filters/dates.js */
// Filter: date range (inclusive), with presets. Dates are UTC days. An empty
// start or end means open-ended, so the fields show the first day of data and
// today's date.

PS.registerFilter({
  id: "dates",
  control(box, state, set) {
    const end = PS.data.project.data_end;
    const github = PS.data.sources.pr;
    const endText = end === null ? null : PS.dayToText(end);
    const yearsBack = n => endText && `${Number(endText.slice(0, 4)) - n}${endText.slice(4)}`;
    // n whole months before the end, with the day cut to the month's length.
    const monthsBack = n => {
      if (!endText) return null;
      const [y, m, d] = endText.split("-").map(Number);
      const lastDay = new Date(Date.UTC(y, m - 1 - n + 1, 0)).getUTCDate();
      return new Date(Date.UTC(y, m - 1 - n, Math.min(d, lastDay))).toISOString().slice(0, 10);
    };
    const now = new Date();
    const today = [now.getFullYear(), now.getMonth() + 1, now.getDate()]
      .map((n, i) => String(n).padStart(i ? 2 : 4, "0")).join("-");
    const days = PS.data.activity.day;
    const first = days.length ? PS.dayToText(days.reduce((a, b) => (b < a ? b : a))) : "";
    const presets = [
      {id: "all", name: "All time", from: undefined, to: undefined},
      github !== undefined && {
        id: "github", name: "Since GitHub PRs",
        from: PS.dayToText(github), to: undefined,
      },
      endText && {id: "3y", name: "Last 3 years", from: yearsBack(3), to: undefined},
      endText && {id: "1y", name: "Last 1 year", from: yearsBack(1), to: undefined},
      endText && {id: "3m", name: "Last 3 months", from: monthsBack(3), to: undefined},
    ].filter(Boolean);

    const select = PS.el("select", {"aria-label": "Date range"},
      ...presets.map(p => PS.el("option", {value: p.id}, p.name)),
      // Shown only while typed dates match no preset; never offered as a choice.
      PS.el("option", {value: "custom", hidden: true, disabled: true}, "Custom"));
    const from = PS.el("input", {type: "date", "aria-label": "From", min: first, max: today});
    const to = PS.el("input", {type: "date", "aria-label": "To", min: first, max: today});

    function sync() {
      from.value = state.from || first;
      to.value = state.to || today;
      const match = presets.find(p => (p.from || "") === (state.from || "") && !state.to);
      select.value = match ? match.id : "custom";
    }
    select.onchange = () => {
      const preset = presets.find(p => p.id === select.value);
      if (preset) set({from: preset.from, to: preset.to});
      sync();
    };
    from.onchange = () => { set({from: from.value && from.value !== first ? from.value : undefined}); sync(); };
    to.onchange = () => { set({to: to.value && to.value !== today ? to.value : undefined}); sync(); };

    box.append(PS.el("span", {class: "label"}, "Dates"), select, from, PS.el("span", {}, "to"), to);
    sync();
    this.syncControl = sync;
    this.presets = presets;
  },
  sync() { if (this.syncControl) this.syncControl(); },
  chips(state) {
    if (!state.from && !state.to) return [];
    const match = this.presets.find(p => (p.from || "") === (state.from || "") && !state.to);
    const text = match ? match.name
      : state.from && state.to ? `${state.from} to ${state.to}`
      : state.from ? `From ${state.from}` : `Until ${state.to}`;
    return [{text, clear: {from: undefined, to: undefined}}];
  },
  predicate(state) {
    if (!state.from && !state.to) return null;
    const lo = state.from ? PS.dateToDay(state.from) : -Infinity;
    const hi = state.to ? PS.dateToDay(state.to) : Infinity;
    const day = PS.data.activity.day;
    return i => day[i] >= lo && day[i] <= hi;
  },
});

</script>
<script>
/* filters/kind.js */
// Filter: which activity counts, as one choice: All, Code, or Discussion.
// The hash keeps the individual kinds (#kinds=commit,pr). Older links with
// other combinations are widened to the whole group (or to All) on load.

const KIND_GROUPS = {
  code: ["commit", "pr"],
  discussion: ["review", "issue", "comment"],
};

PS.registerFilter({
  id: "kind",
  init(state) {
    if (!state.kinds) return;
    const on = state.kinds.split(",").filter(k => PS.data.kinds.includes(k));
    const within = group => on.length && on.every(k => KIND_GROUPS[group].includes(k));
    const pick = within("code") ? "code" : within("discussion") ? "discussion" : null;
    state.kinds = pick ? KIND_GROUPS[pick].filter(k => PS.data.kinds.includes(k)).join(",") : undefined;
  },
  control(box, state, set) {
    const has = k => PS.data.kinds.includes(k);
    const code = KIND_GROUPS.code.filter(has);
    const discussion = KIND_GROUPS.discussion.filter(has);
    if (!code.length || !discussion.length) return;
    const options = [
      {name: "All", title: "Commits, PRs opened, reviews, issues opened, and comments", kinds: undefined},
      {name: "Code", title: "Commits and PRs opened", kinds: code},
      {name: "Discussion", title: "Reviews, issues opened, and comments", kinds: discussion},
    ];
    const current = () => {
      const on = PS.selectedKinds();
      if (on.every(k => code.includes(k))) return 1;
      if (on.every(k => discussion.includes(k))) return 2;
      return 0;
    };
    const choose = i => {
      if (i === current()) return;
      set({kinds: options[i].kinds && options[i].kinds.join(",")});
      sync();
    };
    box.append(PS.el("span", {class: "label", id: "kind-label"}, "Activity"));
    const group = PS.el("span", {class: "choice", role: "radiogroup", "aria-labelledby": "kind-label"});
    const buttons = options.map((o, i) => {
      const button = PS.el("button", {type: "button", role: "radio", title: o.title, "data-label": o.name}, o.name);
      button.onclick = () => choose(i);
      button.onfocus = () => choose(i);
      return button;
    });
    function sync() {
      const now = current();
      buttons.forEach((b, i) => {
        b.setAttribute("aria-checked", String(i === now));
        b.setAttribute("tabindex", i === now ? 0 : -1);
      });
    }
    group.append(...buttons);
    box.append(group);
    PS.rovingFocus(buttons, current(), "ArrowLeft", "ArrowRight");
    sync();
    this.syncControl = sync;
    this.pick = () => (current() ? options[current()].name : null);
  },
  sync() { if (this.syncControl) this.syncControl(); },
  chips() {
    const name = this.pick && this.pick();
    return name ? [{text: `Activity: ${name}`, clear: {kinds: undefined}}] : [];
  },
  predicate(state) {
    const on = new Set(PS.selectedKinds());
    if (on.size === PS.data.kinds.length) return null;
    const allowed = PS.data.kinds.map(k => on.has(k));
    const kind = PS.data.activity.kind;
    return i => allowed[kind[i]];
  },
});

</script>
<script>
/* filters/people.js */
// Filter: a checkbox per person listed in [people] leave_out_option, so one
// very active person can be left out of every count. The URL lists the
// logins left out (without=lgritz). The page calls each one by its label from
// [people] leave_out_option, not by name.

const optionalPeople = () => PS.data.project.leave_out_option || [];

// Indexes of the optional people currently left out.
PS.leftOut = state => {
  const logins = new Set((state.without || "").split(",").filter(Boolean));
  return optionalPeople().filter(p => logins.has(PS.data.people.login[p]));
};

// The label for an optional person (same order as optionalPeople).
const labelOf = p => PS.data.project.leave_out_label[optionalPeople().indexOf(p)];

// Generic labels for the people currently left out.
PS.leftOutLabels = state => PS.leftOut(state).map(labelOf);

PS.registerFilter({
  id: "people",
  secondary: true,
  control(box, state, set) {
    const people = optionalPeople();
    if (!people.length) return;
    this.boxes = people.map(p => {
      const input = PS.el("input", {type: "checkbox"});
      input.onchange = () => {
        const out = people.filter((_, i) => !this.boxes[i].checked).map(q => PS.data.people.login[q]);
        set({without: out.length ? out.join(",") : undefined});
      };
      box.append(PS.el("label", {class: "check"}, input, `Include ${labelOf(p)}`));
      return input;
    });
    this.sync(state);
  },
  sync(state) {
    if (!this.boxes) return;
    const out = new Set(PS.leftOut(state));
    optionalPeople().forEach((p, i) => { this.boxes[i].checked = !out.has(p); });
  },
  chips(state) {
    const out = PS.leftOut(state);
    return out.map(p => {
      const rest = out.filter(q => q !== p).map(q => PS.data.people.login[q]);
      return {text: `Without ${labelOf(p)}`, clear: {without: rest.length ? rest.join(",") : undefined}};
    });
  },
  predicate(state) {
    const out = new Set(PS.leftOut(state));
    if (!out.size) return null;
    const person = PS.data.activity.person;
    return i => !out.has(person[i]);
  },
});

</script>
<script>
/* filters/period.js */
// Setting: the period the contributors chart and the timeline group by. It
// filters no rows, but two tabs use it, so it sits in the top bar.

PS.registerFilter({
  id: "period",
  init(state) {
    const valid = ["month", "quarter", "year", "release"];
    if (!valid.includes(state.period)) state.period = "quarter";
    if (state.period === "release" && !PS.data.releases.day.length) state.period = "quarter";
  },
  control(box, state, set) {
    const options = [["month", "Month"], ["quarter", "Quarter"], ["year", "Year"]];
    if (PS.data.releases.day.length) options.push(["release", "Release cycle"]);
    const select = PS.el("select", {"aria-label": "Group by"},
      ...options.map(([value, name]) => PS.el("option", {value}, name)));
    select.value = state.period;
    select.onchange = () => set({period: select.value});
    this.select = select;
    box.append(PS.el("span", {class: "label"}, "Group by"), select);
  },
  sync(state) { if (this.select) this.select.value = state.period; },
});
