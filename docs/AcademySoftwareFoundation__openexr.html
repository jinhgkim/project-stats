<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openexr Project Analytics</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --wash: rgba(11, 11, 11, 0.05);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --kind-code: #e87ba4;
    --kind-discussion: #6250d6;
    --series-1-faint: #86b6ef;
    /* One-hue blue ramps: seq-* for the theme heatmap (top three take the
       inverse ink), ord-* for timeline marks (lightest still clears 2:1). */
    --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec;
    --seq-4: #256abf; --seq-5: #184f95; --seq-6: #0d366b;
    --seq-ink-inverse: #ffffff;
    --ord-1: #86b6ef; --ord-2: #3987e5; --ord-3: #1c5cab; --ord-4: #0d366b;
    --critical: #d03b3b;
    --good: #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface-1: #1a1a19;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.06);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --kind-code: #d55181;
      --kind-discussion: #9085e9;
      --series-1-faint: #184f95;
      --seq-1: #0d366b; --seq-2: #184f95; --seq-3: #256abf;
      --seq-4: #6da7ec; --seq-5: #9ec5f4; --seq-6: #cde2fb;
      --seq-ink-inverse: #0b0b0b;
      --ord-1: #184f95; --ord-2: #2a78d6; --ord-3: #6da7ec; --ord-4: #b7d3f6;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.06);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --kind-code: #d55181;
    --kind-discussion: #9085e9;
    --series-1-faint: #184f95;
    --seq-1: #0d366b; --seq-2: #184f95; --seq-3: #256abf;
    --seq-4: #6da7ec; --seq-5: #9ec5f4; --seq-6: #cde2fb;
    --seq-ink-inverse: #0b0b0b;
    --ord-1: #184f95; --ord-2: #2a78d6; --ord-3: #6da7ec; --ord-4: #b7d3f6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header, #filter-inner, #views, #check-panel, #about { max-width: 1440px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 20px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 20px; font-weight: 600; margin: 0; }
  /* The project name in the title: a dim box with an arrow on the right (drawn
     here so it matches the More filters arrow). */
  .project-pick { position: relative; display: inline-block; margin-left: 8px; }
  .project-pick::before {
    content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
    border: solid var(--text-secondary); border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg); pointer-events: none;
  }
  #project {
    cursor: pointer; background-image: none;
    background-color: var(--wash); padding: 2px 28px 2px 10px;
  }
  #project:hover { border-color: var(--text-muted); }
  #theme {
    margin-left: auto; align-self: center; display: grid; place-items: center;
    width: 34px; height: 34px; padding: 0; border-radius: 999px; color: var(--text-secondary);
  }
  #theme:hover { color: var(--text-primary); }
  #about { color: var(--text-secondary); font-size: 13px; padding-top: 14px; padding-bottom: 40px; border-top: 1px solid var(--grid); }
  #about a { color: inherit; }
  button, select, input {
    font: inherit; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
  }
  button { cursor: pointer; }
  /* One drawn arrow on every select (a native one sits tight against the edge):
     two thin diagonals forming a chevron, the same shape as the More filters one. */
  select {
    appearance: none; -webkit-appearance: none; padding-right: 28px;
    background-image:
      linear-gradient(to top right, transparent calc(50% - 0.75px), var(--text-muted) calc(50% - 0.75px),
        var(--text-muted) calc(50% + 0.75px), transparent calc(50% + 0.75px)),
      linear-gradient(to top left, transparent calc(50% - 0.75px), var(--text-muted) calc(50% - 0.75px),
        var(--text-muted) calc(50% + 0.75px), transparent calc(50% + 0.75px));
    background-repeat: no-repeat; background-size: 5px 5px; background-position: right 15px center, right 10px center;
  }
  button:hover { background: var(--wash); }
  button[aria-pressed="true"], button[aria-checked="true"] { border-color: var(--text-secondary); font-weight: 600; }
  /* Toggles reserve their bold width (data-label repeats the text), so pressing one doesn't resize it. */
  button[data-label] { display: inline-grid; justify-items: center; }
  button[data-label]::after { content: attr(data-label); font-weight: 600; height: 0; overflow: hidden; visibility: hidden; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
  /* The top bar holds the filters that change every view; it stays pinned
     while scrolling, except on narrow screens where it would cover too much. */
  #filters {
    position: sticky; top: 0; z-index: 5; margin-top: 12px;
    background: var(--page); border-bottom: 1px solid var(--grid);
  }
  @media (max-width: 700px) { #filters { position: static; } }
  #filter-controls, #filter-more { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
  #filter-more { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--grid); }
  #more-toggle { display: inline-flex; gap: 6px; align-items: center; }
  .badge {
    min-width: 18px; padding: 0 5px; border-radius: 999px; text-align: center;
    font-size: 11px; line-height: 18px; background: var(--series-1); color: #fff;
  }
  .chev {
    width: 6px; height: 6px; margin: -3px 2px 0; border: solid var(--text-muted);
    border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); transition: transform 0.15s;
  }
  button[aria-expanded="true"] .chev, .chev.up { margin-top: 3px; transform: rotate(-135deg); }
  button.sort { display: inline-flex; gap: 6px; align-items: center; border: none; background: none; padding: 0; font-weight: 600; color: inherit; }
  button.sort:hover { background: none; color: var(--text-primary); }
  /* A sortable column that isn't the sorted one: an up and a down arrow side by side,
     faded, a different shape from the single chevron that shows the direction. */
  .sort-none { flex: none; opacity: 0.55; color: var(--text-muted); font-size: 12px; font-weight: 400; line-height: 1; }
  .sort-none::before { content: "\2191\2193"; letter-spacing: -1px; }
  button.sort:hover .sort-none, button.sort:focus-visible .sort-none { opacity: 1; }
  .menu { position: relative; display: inline-block; }
  .menu-button { display: inline-flex; gap: 10px; align-items: center; justify-content: space-between; min-width: 170px; }
  .menu-list {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 10; display: grid; gap: 1px;
    width: max-content; min-width: 100%; max-width: 360px; max-height: 320px; overflow-y: auto;
    padding: 6px; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  }
  .menu-list .option {
    display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center;
    padding: 3px 6px; border-radius: 4px; cursor: pointer;
  }
  .menu-list .option:hover { background: var(--wash); }
  .menu-list input { margin: 0; width: 16px; height: 16px; accent-color: var(--series-1); }
  .menu-list .count { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  #filter-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 8px; }
  #filter-chips .label { color: var(--text-muted); margin-right: 2px; }
  .chip {
    display: inline-flex; align-items: center; padding: 1px 3px 1px 10px;
    border-radius: 999px; background: var(--wash); border: 1px solid var(--border);
  }
  .chip button {
    border: none; background: none; padding: 0 6px; border-radius: 999px;
    color: var(--text-secondary); font-size: 16px; line-height: 1.2;
  }
  .chip button:hover { color: var(--text-primary); background: var(--wash); }
  #filter-chips button.link {
    border: none; background: none; margin-left: auto; padding: 2px 4px;
    color: var(--text-secondary); text-decoration: underline;
  }
  #filter-chips button.link:hover { color: var(--text-primary); }
  #filter-inner { padding-top: 10px; }
  #tabs { display: flex; gap: 4px; margin-top: 10px; }
  #tabs .tab {
    border: none; border-radius: 6px 6px 0 0; background: none; padding: 8px 14px 7px;
    color: var(--text-secondary); font-size: 15px; border-bottom: 3px solid transparent;
  }
  #tabs .tab:hover { color: var(--text-primary); background: var(--wash); }
  #tabs .tab[aria-selected="true"] { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--series-1); }
  section.panel { padding-top: 14px; }
  figure.view, .details { scroll-margin-top: calc(var(--bar-h, 0px) + 12px); }
  .plot .hit.clickable { cursor: pointer; }
  .details .table-wrap { max-height: 440px; margin-top: 8px; }
  .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1100px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid > figure.view { grid-column: 1 / -1; }
  }
  .filter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .filter > .label { color: var(--text-secondary); margin-right: 2px; }
  .choice { display: inline-flex; gap: 6px; }
  .filter label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .filter label.check input { margin: 0; width: 16px; height: 16px; accent-color: var(--series-1); }
  #views { padding-bottom: 40px; }
  figure.view {
    margin: 0; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; min-width: 0;
  }
  figure.view .head { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  figure.view h3 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; min-width: 200px; }
  figure.view .subtitle { color: var(--text-primary); margin: 4px 0 6px; max-width: 80ch; }
  figure.view.bare { background: none; border: none; padding: 0; }
  details.howto { color: var(--text-secondary); margin: 0 0 8px; max-width: 80ch; }
  details.howto summary { cursor: pointer; color: var(--text-muted); width: fit-content; }
  details.howto ul { margin: 6px 0 4px; padding-left: 18px; }
  details.howto li { margin: 2px 0; }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .tile {
    text-align: left; padding: 12px 14px; border-radius: 10px; background: var(--surface-1);
    border: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px;
  }
  .tile .value { font-size: 26px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .tile .what { color: var(--text-secondary); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--text-secondary); margin: 4px 0 8px; }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { display: block; }
  .legend .unit { margin-left: auto; }
  .legend .total { color: var(--text-primary); font-weight: 600; }
  .plot { position: relative; width: 100%; }
  .plot svg { display: block; width: 100%; overflow: visible; }
  .plot text { fill: var(--text-muted); font-size: 11px; }
  .plot .grid line { stroke: var(--grid); }
  .plot .axis path, .plot .axis line { stroke: var(--axis); }
  .plot .label { fill: var(--text-secondary); font-size: 12px; }
  .plot .halo { paint-order: stroke; stroke: var(--surface-1); stroke-width: 3px; stroke-linejoin: round; }
  .plot .marker line { stroke: var(--text-muted); }
  .plot .hit { fill: transparent; outline: none; }
  .plot .hit:hover, .plot .hit:focus { fill: var(--wash); }
  .plot .hit:focus-visible { stroke: var(--series-1); stroke-width: 2px; }
  .empty { color: var(--text-secondary); padding: 24px 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 8px; }
  .controls:empty { display: none; }
  .controls > .label { color: var(--text-secondary); margin-right: 2px; }
  input.short { width: 4.5em; }
  .filter .error { color: var(--critical); }
  .filter .error:empty { display: none; }
  .plot .name { fill: var(--text-secondary); font-size: 13px; }
  .plot .name.current { fill: var(--text-primary); font-weight: 600; }
  .plot .cell-ink { fill: var(--text-primary); font-size: 12px; }
  .plot .cell-ink-inverse { fill: var(--seq-ink-inverse); font-size: 12px; }
  .plot .scroll { max-height: 480px; overflow-y: auto; }
  .plot .label.current { fill: var(--text-primary); font-weight: 600; }
  .filter .note { color: var(--text-muted); }
  table.data.themes th, table.data.themes td { text-align: left; vertical-align: top; }
  /* Fixed column widths, as shares of the table; narrow screens scroll sideways. */
  table.data.themes { table-layout: fixed; min-width: 900px; }
  table.data.themes th:nth-child(1) { width: 20%; }
  table.data.themes th:nth-child(2) { width: 10%; }
  table.data.themes th:nth-child(3), table.data.themes th:nth-child(4) { width: 9%; }
  table.data.themes th:nth-child(5) { width: 13%; }
  table.data.themes td:first-child, table.data.themes td:first-child .link-button { white-space: nowrap; }
  table.data.themes td.nowrap { white-space: nowrap; }
  table.data.themes td.people { color: var(--text-secondary); }
  table.themes tr.selected td { background: var(--wash); }
  .link-button { border: none; background: none; padding: 0; color: var(--series-1); font-weight: 600; text-align: left; }
  .link-button:hover { background: none; text-decoration: underline; }
  .link-button[aria-expanded="true"] { text-decoration: underline; }
  .details { margin-top: 12px; border-top: 1px solid var(--grid); padding-top: 12px; }
  .details-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .details-head h3 { font-size: 15px; margin: 0; flex: 1; min-width: 200px; }
  .details .meta { color: var(--text-secondary); }
  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 8px; }
  .groups h4 { margin: 0 0 4px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .groups ul { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
  .groups li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--grid); }
  .groups .count { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .groups .empty { margin: 0; padding: 3px 0; }
  table.data { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data th { color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; background: var(--surface-1); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .status {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
    border: 1.5px solid var(--text-muted); vertical-align: 1px; box-sizing: border-box;
  }
  .status.on { background: var(--series-1); border-color: var(--series-1); }
  .status-key { margin: 6px 0 0; color: var(--text-secondary); font-size: 13px; }
  .status-key .status { margin-left: 2px; margin-right: 5px; }
  .status-key .status:not(:first-child) { margin-left: 14px; }
  table.data.activity th, table.data.activity td { text-align: left; }
  /* Fixed widths, so the columns stay put when a sort changes which rows are shown. */
  table.data.activity { table-layout: fixed; }
  table.data.activity th:nth-child(1) { width: 130px; }
  table.data.activity th:nth-child(2) { width: 170px; }
  table.data.activity.with-person th:nth-child(3) { width: 200px; }
  table.data.activity.with-person td:nth-child(3) { overflow: hidden; text-overflow: ellipsis; }
  table.data.activity td:nth-child(-n+2) { white-space: nowrap; color: var(--text-secondary); padding-right: 20px; }
  table.data.activity.with-person td:nth-child(3) { white-space: nowrap; color: var(--text-secondary); padding-right: 20px; }
  table.data.activity td a { color: var(--text-primary); }
  .legend .key .status { margin-right: 0; }
  table.data.activity th:first-child, table.data.activity td:first-child { padding-left: 0; }
  figure[id*="activity"] .table-wrap { max-height: min(60vh, 520px); }
  table.data.people th.left, table.data.people td.left { text-align: left; }
  table.data.people td:first-child { white-space: nowrap; }
  .cellbar { display: flex; align-items: center; gap: 8px; }
  .cellbar .num { min-width: 6ch; text-align: right; }
  .cellbar .track { flex: 0 1 120px; min-width: 40px; height: 10px; }
  .cellbar .bar { display: block; height: 100%; min-width: 1px; background: var(--series-1); border-radius: 0 2px 2px 0; }
  /* Positioned, so the absolutely placed .sr-only text inside is clipped and scrolls with the box
     instead of stretching the page. */
  .table-wrap { max-height: 420px; overflow: auto; position: relative; }
  #tooltip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); min-width: 160px;
  }
  #tooltip .title { color: var(--text-secondary); margin-bottom: 4px; }
  #tooltip .title:only-child { margin-bottom: 0; max-width: 300px; }
  .has-tip select:disabled { pointer-events: none; }
  #tooltip .row { display: flex; align-items: center; gap: 8px; }
  #tooltip .row .value { font-weight: 600; min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
  #tooltip .row .name { color: var(--text-secondary); }
  #check-panel:empty { display: none; }
  #check-panel .box { margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface-1); }
  #check-panel .ok { color: var(--good); font-weight: 600; }
  #check-panel .bad { color: var(--critical); font-weight: 600; }
  #check-panel pre { white-space: pre-wrap; margin: 6px 0 0; color: var(--text-secondary); }
</style>
</head>
<body>
<header>
  <h1 id="title">openexr Project Analytics</h1>
  <select id="project" aria-label="Project" hidden></select>
  <button id="theme" type="button"></button>
</header>
<div id="check-panel"></div>
<div id="filters" role="region" aria-label="Filters">
  <div id="filter-inner">
    <div id="filter-controls" role="toolbar" aria-label="Filters for every tab"></div>
    <div id="filter-more" hidden></div>
    <div id="filter-chips" hidden></div>
    <div id="tabs" role="tablist" aria-label="Views"></div>
  </div>
</div>
<main id="views"></main>

eWarrior","updated to 1.1 source, added RefNumIO to use native IO routines rather than ANSI C++ streams","* Add Wojciech to developers list.","* Changes for rounding modes.  (Florian Kainz)","* Print rounding mode and preview image size.  (Florian Kainz)","* A utility to edit OpenEXR standard attributes in one file and save   the changes out to a new file.  (Florian Kainz)","* A utility for making OpenEXR environment maps.  (Florian Kainz)","* A utility for making preview images.  (Florian Kainz)","* Added all files to EXTRA_DIST to make sure they're included in   tarballs.","* New utilities.","* Updates for all the new utilities. * Point users at openexr.com for downloads until Savannah downloads   are functional again.","* New documentation, catch up with all the recent changes (tiles,   standard attributes, etc.).  (Florian Kainz, Wojciech Jarosz)","* Updated to latest versions.","* Fixed a typo.","* IlmImfExamples updates.","* Fixed a typo.","* Use libtool -version-info now to generate libs.  This will help with   binary compatibility. * Rev'ed to libtool version to 1:0:0.","* Handle \"restrict\" keyword via ImathPlatform.h so that it works   for user compiles.  (Drew Hess)","* Remove carriage returns, cosmetic change only.","* Fix for compilers with missing ios_base.  (Drew Hess)","* Need to include <algorithm> to get std::min/max.  (Drew Hess)","* Need to include <string.h> to get strcmp.  (Drew Hess)","* Fixes for gcc 2.96.  (Drew Hess)","* Missing ImathMath.h include.","* Changes for zlib 1.2.1.","* Indicate preference for zlib 1.2.1, and note that zlib VC project files   now require 1.2.1.","* Bug fix for built-in fragment shader case.","* Added new source files.","* Some picky compilers need a cast for the pixel math.","* More updates pre-1.1.0.","* Point people at openexr.com for downloads until Savannah is fixed.","* Properly report status of Nvidia SDK even if FLTK libs are absent.","* Added targets for exrenvmap, exrmakepreview, exrmaketiled, exrstdattr.","* Dist vc7 project files for new exr* utils.","* Changes for 1.2.1 version of zlib.","* More Win32 fixes.  Yay.","* Foo","* New file.  Use this to track gotchas for a particular release of OpenEXR.","* Added ReleaseNotes to the extra dist.","fixed confidence test building for OS X","* Added a note about exrdisplay's frag shader viewer not working with   display windows.","* Add a reference to the ReleaseNotes file.","fixed CW build after fixing OS X gcc build","fixed build for OS X gcc","Cleaned up Abstract IO for Photoshop plugin, added 64-bit file support for Mac","fixed Win32 build after NOMINMAX was added","* Fixed a couple of typos in the \"YUV\" section.","* Use Math<float>::pow instead of pow.  (Drew Hess)","* Fixed a subtle bug where signaling 32-bit NaNs, where the 10 MSBs   of the mantissa are zero, were converted to infinity in half   representation.  Note that this bug is difficult to reproduce on   x86 because copying a signaling NaN may change its value by   setting the MSB of the mantissa to 1.  (Florian Kainz)","* Fixes for gcc 3.4.  (Garrick Meeker)","* Initialized offset to stop compiler from complaining.","* Compiler warning cleanups.","* Compile fix for 64-bit architectures.  (Florian Kainz)","* Couple of cosmetic changes.","* Some comment cleanups, and a slightly clearer THROW message.","* gcc 3.4 fixes.  (Garrick Meeker)","* Bug fix (& instead of &&).  (Florian Kainz)","* OpenEXR now supports YCA (luminance/chroma/alpha) images with   subsampled chroma channels.  When an image is written with the   RGBA convenience interface, selecting WRITE_YCA instead of   WRITE_RGBA causes the library to convert the pixels to YCA format.   If WRITE_Y is selected, only luminance is stored in the file   (for black and white images).","* Bug fix, which changes the OpenEXR tiled format.","* Changed the license to allow for other copyright holders in the   source tree.","* Modified the text about the license a bit.  (Drew Hess)","* Forgot to check these in as part of the YCA support.","* Added Pixar's new \"slightly lossy\" image compression method.  This   new method, called PXR24, preserves HALF and UINT data without loss,   but FLOAT pixels are converted to a 24-bit representation.   (Loren Carpenter, Florian Kainz)","* Part of PXR24 changes.","* Changes to tests for YCA support and PXR24 compressor.","* Add some new options:","* Add command-line support for selectable compression method. * makeCubeMap.cpp: eliminate an unused variable.","* Add support for PXR24 compression.  (Florian Kainz)","* Added a command-line option to select compression.  (Florian Kainz)","* Added copyright notice.","* Added Loren Carpenter.","* Foo","* Bump SONAME to 1.1.0.","* A line from the deprecated internal v1 support got into the last   checkin.  Eliminate it.","* Bug fix, findKneeF is part of ImageView namespace.","* Use Imath::limits rather than FLT_MAX.","* Added information on reading and writing YCA files.","* Describe PXR24 compression scheme. * Details on YCA files.","* Added new files.","* The compression and decompression code for HALF was causing gcc 3.3.3   3.4 to generate bad code, so I re-implemented them using fewer casts,   similar to the implementations for UINT and FLOAT.  The new code   appears to work fine on all compilers I've tested.   (Drew Hess)","* Last \"fix\" for gcc 3.3.3 and 3.4 compilers broke HALF decompressor   for big endian machines.  Rewrote it yet again, it should be work   for any endian now.","* Remove the #define NOMINMAX for Win32 platforms.  It doesn't do any   good, anyway, if the user includes windows.h before including   ImathLimits.h.  Have to define NOMINMAX in the project in order to   get this to work properly.","* A bunch of Win32 and Metrowerks compile-time fixes.","* The ImathEuler.h bug with .NET 2003 seems to have gone away.","* When a block of scanlines is stored uncompressed in the file,   and the user makes several calls to readPixels to read them, we   must preserve across calls gnment when modifying an exception's   what() string.  This works around an issue with Visual C++ 7.1.   (Florian Kainz, Nick Porcino)","added BROKEN_ISTREAM_HACK check to routines that bypass StdIO","* Disable long double warnings on OS X.  (Drew Hess)","*** empty log message ***","Eliminated most warnings messages when OpenEXR is compiled with Visual C++.  The OpenEXR code uses lots of (intentional and unintended) implicit type conversions.  By default, Visual C++ warns about almost all of them.  Most implicit conversions have been removed from the .h files, so that including them should not generate warnings even at warning level 3.  Most .cpp files are now compiled with warning level 1.","Added \"Miscellaneous\" section to api.html document. Added custom low-level file I/O examples to IlmImfExamples.","*** empty log message ***","Fixed typos in comments.","This commit merges in all the submits to Imath currently existing in the ILM Perforce repository since the last merge with the OpenExr cvs savannah repo","Added -I and -L pathing to Half.","Removed duplicate \"using\" constructs from a bad merge.","gcc34 compilation fix.","Typenaming the Euler Order enum parameter for extractSHRT() produced an ICE with VC++7.1.   C:\\Program Files\\Microsoft Visual Studio .NET 2003\\Vc7\\include\\xstring(521) : fatal error C1001: INTERNAL COMPILER ERROR  (compiler file 'msc1.cpp', line 2712)","Updated to reflect updates to Imath that were merged in from the ILM Perforce repository.","Added a comment to explain the #ifdef for extractSHRT; i.e. VC++7.1 ICE.","Tried to fix possibly confusing references to version numbers for Visual Studio and the Intel C++ compiler.","Bug fix: PXR24 compression did not work properly for channels with ySampling != 1.","Fill uninitialized dummy frame buffer in testStandardAttributes.cpp, to make valgrind happy.","Bug fix: alpha channel in preview images generated by exrmakepreview was not set correctly","* Added functions to IlmImf for quickly test re-throw the caught exception multiple times.","Added recent changes to ChangeLog.","Fixed typo in comment.","Fixed typos in comments.","Updated documentation (doc/*) and sample code (IlmImfExamples/*):","Fixed typo in documentation.","Bug fixes:","* Bug fix: exceptions caused by reading incomplete files were not   handled correctly; the reading process would deadlock while waiting   on a semaphore.","Updated ChangeLog","Added warnings to comments about breakTile() and breakScanLine() functions.","Added a section about memory-mapped file input to the ReadingAndWritingImageFiles document.","Improved wording of a few sentences.","Fixed typo (\"ssert\" instead of \"assert\").","Fixed typo in comment.","Added a section about \"layers\".","Added an \"OpenEXR File Layout\" document.","Minor fixups in OpenEXRFileLayout document.","Fixed typo.","Fix for Savannah bug #1451","Bug fix: Imath::Matrix33<T>::operator /= (T a) had a stray reference to m[2][3] (found by Cary Phillips).","Fixed a couple of typos in documentation.","Added description of isComplete() method. Moved description of low-level file I/O out of \"Miscellaneous\" and into its own section.","Added explicit cast to the destination type to eliminate a warning for cross-type matrix/vector multiplies.","Explicitly path test images with the source directory to allow make check to succeed with the build root different than the source root.","Added .cvsignore files to the directories that were missing them.","Fix a compile error because UINT and FLOAT are typedefs in windef.h. We use 'using Imf::UINT' to be explicit about the Imf enums.","Misc fixes for win32 compilation: * replaced the used of 'ThreadHandle' with 'HANDLE';   not sure where this came from but it appears to be an oversight. * We undef NOMINMAX if it is defined else we will get a   'macro redefinition warning' when we attempt to redefine it.","Misc win32 warnings and compilation fixes: * names 'near' and 'far' are #defines under windows. So these need   (Drew Hess)","* Removed a stray HAVE_STL_IOS_BASE macro.","* HAVE_* macros are now defined in the OpenEXRConfig.h header file   instead of via compiler flags.  There are a handful of public   headers which rely on the value of these macros, and projects   including these headers have previously needed to define the same   macros and values as used by OpenEXR's 'configure', which is bad   form.  Now 'configure' writes these values to the OpenEXRConfig.h   header file, which is included by any OpenEXR source files that need   these macros.","* Added -no-undefined to LDFLAGS and required libs to LIBADD   for library projects with other library dependencies, per   Rex Dieter's patch.","* Added pthread support to OpenEXR pkg-config file.   (Drew Hess)","* Removed workaround for OS X istream::read bug, we don't support   these versions of OS X anymore.   (Drew Hess)","* Fix use of AC_ARG_ENABLE in configure.ac.  Closes   #13426.   (Drew Hess)","* Use host specification instead of target in configure.ac.   Closes #13427.   (Drew Hess)","* Fixed quoting for tests in configure.ac.  Closes #13428.   (Drew Hess)","* Removed CPU-specific optimizations from configure.ac,   autoconf's guess at the CPU type isn't very useful,   anyway.  Closes #13429.   (Drew Hess)","* Updates for the latest version.   (Drew Hess)","* More build/install documentation updates.   (Drew Hess)","* Support for building universal binaries on OS X 10.4.   (Drew Hess, Paul Schneider) * Minor configure.ac fix to accomodate OS X's automake.   (Drew Hess)","* Define OPENEXR_VERSION, I had removed this when I was upgrading the   configure.ac file.   (Drew Hess)","* Un-ifdef'ed this test for Windows, it works fine with the latest   Visual Studio 2003.","* A new version of createDLL.  Move the source up to the top-level vc   directory because we're going to use it for Visual Studio 2005, too.   (Nick Porcino)","* Windows build system changes:","* Removed HAVE_FRAGMENT_SHADERS from the Windows OpenEXRConfig.h,   it's set by the exrdisplay_fragshader project file.","* Oops, I accidentally removed the createDLL post-build step   for the DLL versions of these projects.  Restored.","* Fix up the createDLL post-build steps for the ReleaseDLL configurations   of these projects.","* exrdisplay_fragshader is currently broken on Windows (won't build),   make a note of it.","* Updates for upcoming release.","* Dist the .spec file, too.   (Drew Hess)","* dummy file for Makefile.am dist rule.","* Support for Visual Studio 2005 (i.e., Visual Studio 8).","* Removed trailing backslash on last line.","* Noted support for Visual Studio 2005.","* Ready for 1.3.0 release.","* Added a note about the VS 2005 IlmImf ReleaseDLL linking issue.","* Removed openexr.spec file, it's out of date and broken to   boot.","* Fixed the ReleaseDLL targets on Visual Studio 2005.   (Nick Porcino, Drew Hess)","Bug Fix: calling setFrameBuffer() for every scan line while reading a tiled file through the scan line API returns bad pixel data.","use shiftState() if compiling with metrowerks compiler","Bug fix: When zero-to-one exposure was enabled, RGB value 1.0 was mapped to OpenGl frame buffer value 253 instead of 255.","Package name is lower case now, use OpenEXR instead of @PACKAGE@","* Documentation updates. * Bump verison to 1.4.0 in preparation for release.","Fixed typo.","Fixed typos in comments.","* Fixes for ReleaseDLL builds.   (Barnaby Robson)","* Release version 1.4.0a (only .vcproj changes)","Added new lossy B44 compression method.  HALF channels are compressed with a fixed ratio of 2.66:1.  UINT and FLOAT channels are stored verbatim, without compression.","Fixed typo in comment.","Adding length checks on input data to B44Compressor::uncompress()","Fixed a couple of comments.","Added a brief description of B44 compression.","Added function Imath::srand() (Rick Hankins)","replaced mempcpy() with memcpy(), added missing \"#include <math.h>\"","Added parentheses to avoid MSVC warning.","Semaphores now raries properly * eliminated some warning messages during install","Fixed typos in comments.","Include ImathMath.h and call Imath::Math<T>::sqrt() instead of ::sqrt().","* Changed erand48() such that 0 <= erand48() <= 1 - DBL_EPSILON.   Previously the upper end of the value range was at 1 - 16*DBL_EPSILON.","Updated a comment.","Fixed a couple of comments.","Fixed typo in comment.","Added missing file testBoxAlgo.h.","Snapshot while making exrdisplay and playexr run on Mac OS X: - playexr runs, full-screen mode does not work, OS-dependent code   should be factored out into a separate source file. - exrdisplay runs, but its window hides behind other windows,   does not accept keyboard focus. - m4/path.flt.m4 does not find FLTK in its default /usr/local location","exrdisplay now appears to work correctly on Mac OS X.","Moved OS-dependent code and definitions into files osDependent.h and osDependent.cpp.","Bug fix: buffer overrun while building 3D lut from CTL transforms.","Added new -i command line option:  some types of graphic hardware, support floating-point texture maps, but the hardware does not interpolate between texture samples.  This causes contouring artifacts when the Cg shader uses a 3D texture map as a color lookup table.  Option -i switches to software-based texture sample interpolation in the Cg shader.","Removed install-exec-hook line; it caused \"make install\" to fail.","Fixing usage message.","Added a flag to configure.ac to enable or disable use of large auto arrays in the IlmImf library.  The default setting is \"enabled\" for Linux and \"disabled\" for everything else.","configure now prints setting of large_stack flag","* Added B44A compression, a minor variation of B44: in most cases,   the compression ratio is 2.28:1, the same as with B44, but in   uniform image areas where all pixels have the same value, the   compression ratio increases to 10.66:1.  Uniform areas occur, for   example, in an image's alpha channel, which typically contains   large patches that are solid black or white, or in computer-   generated images with a black background.","Documentation now mentions B44A compression.","Bug fix: excessive desaturation of small details with certain colors after repeatedly loading and saving luminance/chroma encoded images with B44 compression.","Improved rounding inside the B44 compressor in order to reduce generational loss for luminance/chroma-encoded images.","Bug fix: incorrect assertion.","Rounding during float-to-half conversion now implements \"round to nearest even\" mode: if the original float value is exactly in the middle between the two closest half values then rounding chooses the half value whose least significant bit is zero.","Fixed typo in comment.","Adding Nick Porcino's declspecs for Windows.","ImathRandom.h was included twice in testSharedFrameBuffer.cpp","New -S command line flag allows images to be displayed larger or smaller than their original size.","Bug fix: for pixels with luminance near HALF_MIN, conversion from RGB to luminance/chroma produces NaNs and infinities","Fixed typo in comment.","Added support for renderingTransform and adoptedNeutral attributes.","Added renderingTransform and adoptedNeutral to the list of optional standard attributes.","Added new optional standard attributes.","Make sure that adoptedNeutral value is available to CTL transforms.","Fixed typo in comment.","Added lookModTransform Standard Attribute.","Added \"look modification transform\" support to playexr and exrdisplay.","Moved sample CTL transforms from OpenEXR_Viewers to OpenEXR_CTL package.","Moved some .ctl files from the OpenEXR_Viewers to the OpenEXR_CTL package, changed naming conventions for image channels to match upcoming paper.","Updated documentation: changed naming conventions for CTL parameters, added look modification transform","Bumped version numbers in preparation for new release.","transform_RRT.ctl has been moved to the OpenEXR_CTL package","Updating files for vc7 & vc8 builds","Adding required Debug and Release folders","Adding .cvsignore files required by \"make dist\"","Adding missing directories and .cvsignore files","Updated Win32 README and Makefile for vc8","Added .cvsignore","Checking in files required for vc8 builds","Added vc8 build files","Adding missing vc8 project files","Updated files for vc7 & vc8 builds","Added .cvsignore and build files for vc7 & vc8","Updated to include the playexr and exrdisplay project files with ctl support","Patch submitted by James Burgess (Pixar): use GetTempPath() to determine the location of output files, instead of simply placing the files in C:\\. This is necessary when User Account Countrol is turned on.","Removed unnecessary #include statements.","Bug fix: reading damaged image files causes crashes.","* Added new IlmImfFuzzTest program to test how resilient the   IlmImf library is with respect broken input files: the program   first damages OpenEXR files by partially overwriting them with   random data; then it tries to read the damaged files.  If all   goes well, then the program doesn't crash.","* Make sure that IlmImfFuzzTest is only built when OpenEXR has been   configure with --enable-imffuzztest","Bug fix: exceptions thrown during construction of an input file or output file object can cause file descriptors to be leaked.","Run damaged-file tests in single-threaded and multi-threaded mode.","Bug fix: crash when reading a file with an invalid data window.","Added comment explaining what function fuzzFile() does.","Removed Visual Studio *.suo files","Updated ChangeLogs, increased version numbers.","Fixed typo in comment.","* Vec2<T>::length() and Vec3<T>::length() are more accurate for   vectors whose length is less than sqrt(limits<T>::smallest());","Updated ChangeLog","Rewrote function findEntryAndExitPoints() in ImathBoxAlgo.h. Results are now consistent with those from intersect(), also in ImathBoxAlgo.h.","* Rewrote function closestPointOnBox(point,box).  Shortened the code, improved   numerical accuracy, fixed a bug (closestPointOnBox(box.center(),box) would   always return the center of the +Z side of the box, even if the +/-X or +/-Y   sides were closer).","* Added Weta Digital's code to library support for multi-view   (i.e., stereo) images: StringVector attribute type, multiView   standard attribute of type StringVector, utility functions   related to grouping channels into separate views.","Added a new -L command-line flag to exrdisplay.  The flag specifies which layer in a multi-layer or multi-view image should be displayed on the screen.","Fixed incorrect comment.","Added initial version of multi-view documentation.","* Minor fixes in MultiViewOpenEXR document. * Added stringvector attribute type to OpenEXRFileLayout document. * Upgraded OpenEXRFileLayout document from .sxw to .odt format.","Added author's names to documents, changed ReadingAndWritingImageFiles and TechnicalIntroduction from .sxw to .odt format.","Fixed mis-spelled name.","Added experimental version of I/O classes for ACES file format (restricted OpenEXR format with special primaries and white point); added exr2aces file converter.","Added \"hemispherical blur\" option to exrenvmap. (Command line flag \"-b\")","Bug fix: incorrect form factor calculation for the input image pixels.","On output, store an adoptedNeutral attribute in the file header. On input, use the adoptedNeutral attribute instead of chromaticities.white to construct the color adaptation transform for conversion to ACES.","Refactored environment map resampling to reduce cut-and-paste code.","Silence a bogus compiler warning.","Bug fix: missing template arguments in     T& typedAttribute<T>(const string &) and     T* findTypedAttribute<T>(const string &) (found by Jim Hourihan)","Bug fix: InputFile::setFrameBuffer() dereferences an invalid iterator. (found by Jon Wadelton)","Added setLayerName() function to class RgbaInputFile and class TiledRgbaInputFile.","Added missing \"#include <string.h>\" line const PS = (() => {

  // ---- state in the URL hash: #kinds=commit,pr&period=year&check -------------

  // ---- registry ---------------------------------------------------------------

  //          sync?(state), target?, secondary?, chips?(state)}; sync updates the
  //          control when another part of the page changes its state. A control
  //          with a `target` view id sits in that view instead of the top bar
  //          (settings, not filters). A `secondary` control waits behind "More
  //          filters". chips(state) lists [{text, clear}] for what the filter
  //          changes now; clear is the state patch that undoes it.
  function registerFilter(filter) { if (featureOn(filter)) filters.push(filter); }

  // data.features turns it on.
  const featureOn = item => !item.feature || Boolean(data.features[item.feature]);

  // A bare view has no card or title.
  function registerView(view) { if (featureOn(view)) views.push(view); }

  const TABS = [

    {id: "people", label: "People"},

  // Activity row indexes passing every filter (except the one named `skip`).
  function filteredRows(skip) {
    const tests = filters.filter(f => f.id !== skip)

    const n = data.activity.day.length;
    const rows = [];
    outer: for (let i = 0; i < n; i++) {
      for (const test of tests) if (!test(i)) continue outer;
      rows.push(i);
    }

  function renderChips() {

      controls: el("div", {class: "controls"}),
      legend: el("div", {class: "legend"}),
      tableNote: el("div", {class: "legend", hidden: true}),
      plot: el("div", {class: "plot"}),
      table: el("div", {class: "table-wrap", hidden: true}),
      details: el("div", {class: "details", id: `details-${view.id}`, hidden: true}),

      figure.subtitle, figure.howto, figure.controls, figure.legend, figure.tableNote, figure.plot, figure.table,
      figure.details,

    return figure;
  }

  // The collapsed "How to read this" under a view's question: a list of
  // short definitions. Its open state survives re-renders.
  function fillHowto(figure, items) {
    figure.howto.hidden = !items.length;
    figure.howtoBody.replaceChildren(el("ul", {}, items.map(item => el("li", {}, item))));
  }

  // any state `changes` (e.g. which list to show), and scroll there, clear of
  // the pinned bar.
  function jumpTo(id, changes = {}) {
    const view = views.find(v => id === `view-${v.id}` || id === `details-${v.id}`);
    const tab = view ? tabOf(view) : activeTab();
    if (tab !== activeTab() || Object.keys(changes).length) {
      set({...changes, tab: tab === TABS[0].id ? undefined : tab});

    const node = document.getElementById(id);

    set({tab: id === TABS[0].id ? undefined : id});

  // unit: shown at the right above the table, in place of units in the cells.
  function fillTable(figure, columns, rows, unit) {
    figure.tableNote.replaceChildren(...(unit ? [el("span", {class: "unit"}, unit)] : []));
    figure.tableNote.hidden = !figure.showTable || !unit;
    const head = el("tr", {}, columns.map(c => el("th", {scope: "col"}, c.name)));
    const body = rows.map(r => el("tr", {}, columns.map(c => {
      const v = c.value(r);
      return el("td", {}, v === null || v === undefined ? "–" : v);
    })));
    figure.table.replaceChildren(el("table", {class: "data"}, el("thead", {}, head), el("tbody", {}, body)));
