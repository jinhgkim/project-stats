    if (key.shape === "line") {
      Object.entries({x1: 0, x2: 14, y1: 5, y2: 5, stroke: key.color, "stroke-width": 2,
        "stroke-linecap": "round"}).forEach(([a, v]) => mark.setAttribute(a, v));
    } else {
      Object.entries({x: 1, y: 0, width: 12, height: 10, rx: 2, fill: key.color})
        .forEach(([a, v]) => mark.setAttribute(a, v));
    }
    svg.append(mark);
    return svg;
  }

  // Keyboard for a list of marks: one tab stop (at index `current`); the
  // prev/next keys, Home, and End move focus between them.
  function rovingFocus(nodes, current, prevKey, nextKey) {
    nodes.forEach((node, i) => {
      node.setAttribute("tabindex", i === current ? 0 : -1);
      node.addEventListener("keydown", event => {
        const to = {[prevKey]: i - 1, [nextKey]: i + 1, Home: 0, End: nodes.length - 1}[event.key];
        if (to === undefined) return;
        event.preventDefault();
        const j = Math.max(0, Math.min(nodes.length - 1, to));
        node.setAttribute("tabindex", -1);
        nodes[j].setAttribute("tabindex", 0);
        nodes[j].focus();
      });
    });
  }

  // A person's display name, and a GitHub profile link when a login is known.
  function personName(i) { return data.people.name[i] || data.people.login[i] || `#${i}`; }
  function personLink(i) {
    const login = data.people.login[i];
    return login ? el("a", {href: `https://github.com/${login}`}, personName(i)) : personName(i);
  }

  // The GitHub page of a document (PR, issue, or commit) of this project.
  function docUrl(d) {
    const repo = data.project.github;
    const ref = data.docs.ref[d];
    const source = data.docs.source[d];
    return source === "pr" ? `https://github.com/${repo}/pull/${ref}`
      : source === "issue" ? `https://github.com/${repo}/issues/${ref}`
      : `https://github.com/${repo}/commit/${ref}`;
  }

  // ---- tooltip ------------------------------------------------------------------

  const tooltip = document.getElementById("tooltip");

  // rows: [{name, value, color?}]; the value leads, the name follows.
  function showTooltip(anchor, title, rows) {
    tooltip.replaceChildren(
      el("div", {class: "title"}, title),
      ...rows.map(r => el("div", {class: "row"},
        r.color ? swatch({color: r.color, shape: "line"}) : el("span", {style: "width:14px"}),
        el("span", {class: "value"}, r.value),
        el("span", {class: "name"}, r.name))),
    );
    tooltip.style.display = "block";
    const box = tooltip.getBoundingClientRect();
    let x, y;
    if (anchor instanceof Event && "clientX" in anchor) {
      x = anchor.clientX + 14;
      y = anchor.clientY + 14;
    } else {
      const r = anchor.getBoundingClientRect();
      x = r.right + 8;
      y = r.top;
    }
    if (x + box.width > window.innerWidth - 8) x = Math.max(8, x - box.width - 28);
    if (y + box.height > window.innerHeight - 8) y = Math.max(8, window.innerHeight - box.height - 8);
    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${y}px`;
  }

  function hideTooltip() { tooltip.style.display = "none"; }

  // Hover hints. The browser's own `title` tooltip waits about a second and
  // often goes unseen, so the first hover moves the text to data-tip (and
  // aria-description) and shows it in the page tooltip after a short pause.
  function setupHints() {
    let current = null;
    let timer = null;
    const hide = () => {
      clearTimeout(timer);
      current = null;
      hideTooltip();
    };
    document.addEventListener("mouseover", event => {
      const target = event.target.closest("[title], [data-tip]");
      if (!target || target === current) return;
      hide();
      const text = target.dataset.tip || target.getAttribute("title");
      if (!text) return;
      if (target.hasAttribute("title")) {
        target.dataset.tip = text;
        target.setAttribute("aria-description", text);
        target.removeAttribute("title");
      }
      current = target;
      timer = setTimeout(() => showTooltip(event, text, []), 120);
    });
    document.addEventListener("mouseout", event => {
      if (current && !current.contains(event.relatedTarget)) hide();
    });
    document.addEventListener("mousedown", hide);
  }

  // Width in px of text drawn at `size` px in the page font, for fitting labels.
  const measure = document.createElement("canvas").getContext("2d");
  function textWidth(text, size) {
    measure.font = `${size}px ${getComputedStyle(document.body).fontFamily}`;
    return measure.measureText(text).width;
  }

  // ---- time: whole days since 1970-01-01 (UTC) -------------------------------

  function dayToDate(day) { return new Date(day * DAY_MS); }
  function dateToDay(text) { return Math.floor(Date.parse(`${text}T00:00:00Z`) / DAY_MS); }
  function dayToText(day) { return dayToDate(day).toISOString().slice(0, 10); }
  function monthIndex(day) { const d = dayToDate(day); return d.getUTCFullYear() * 12 + d.getUTCMonth(); }
  function monthStart(index) { return Date.UTC(Math.floor(index / 12), index % 12, 1) / DAY_MS; }

  function bisectRight(sorted, x) {
    let lo = 0, hi = sorted.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (x < sorted[mid]) hi = mid; else lo = mid + 1;
    }
    return lo;
  }

  const MONTHS = {month: 1, quarter: 3, year: 12};
  const PERIOD_NAMES = {month: "month", quarter: "quarter", year: "year", release: "release cycle"};

  // A period scheme maps a day to a period key, and keys to labels and bounds.
  // Months, quarters, and years match projstats/retention.py; release cycles
  // match projstats/documents.py release_periods().
  // "3.2" -> "3.3 dev" (matches projstats/releases.py next_version).
  function openName(version) {
    const [major, minor] = version.split(".");
    return /^\d+$/.test(major) && /^\d+$/.test(minor) ? `${major}.${Number(minor) + 1} dev` : `after ${version}`;
  }

  function periodScheme(kind) {
    if (kind === "release") {
      const days = data.releases.day;
      const versions = data.releases.version;
      const last = days.length;
      return {
        kind, name: PERIOD_NAMES[kind],
        key: day => bisectRight(days, day),
        // The cycle in progress is named for the next version, so it needs no "so far".
        label: k => (k < last ? versions[k] : openName(versions[last - 1])),
        short: k => (k < last ? versions[k] : openName(versions[last - 1])),
        soFar: false,
        bounds: k => [k === 0 ? null : days[k - 1], k < last ? days[k] : null],
      };
    }
    const n = MONTHS[kind];
    const label = k => (kind === "month"
      ? `${Math.floor(k / 12)}-${String((k % 12) + 1).padStart(2, "0")}`
      : kind === "quarter" ? `${Math.floor(k / 4)} Q${(k % 4) + 1}` : String(k));
    return {
      kind, name: PERIOD_NAMES[kind],
      key: day => Math.floor(monthIndex(day) / n),
      label, short: label, soFar: true,
      bounds: k => [monthStart(k * n), monthStart((k + 1) * n)],
    };
  }

  // Where each included activity kind's data starts (except the earliest),
  // so a jump caused by a new data source isn't read as growth.
  const KIND_NAMES = {commit: "commits", pr: "PRs", review: "reviews", issue: "issues", comment: "comments"};
  function sourceMarkers(kinds) {
    const byDay = new Map();
    for (const kind of kinds) {
      const day = data.sources[kind];
      if (day === undefined) continue;
      if (!byDay.has(day)) byDay.set(day, []);
      byDay.get(day).push(KIND_NAMES[kind] || kind);
    }
    // Sources starting within a month of each other share one marker.
    const merged = [];
    for (const day of [...byDay.keys()].sort((a, b) => a - b)) {
      const prev = merged[merged.length - 1];
      if (prev && day - prev.day < 31) prev.names.push(...byDay.get(day));
      else merged.push({day, names: [...byDay.get(day)]});
    }
    return merged.slice(1).map(m => ({day: m.day, label: `${m.names.join(", ")} start`}));
  }

  // Labels for sourceMarkers(), stacked 14px apart from y0 and kept between
  // minX and maxX (next to their line when there is room).
  function markerLabels(g, markers, x, y0, minX, maxX) {
    markers.forEach((m, i) => {
      const w = textWidth(m.label, 11);
      const left = Math.max(minX, Math.min(x(m.key) + 4, maxX - w));
      g.append("text").attr("x", left).attr("y", y0 + i * 14).text(m.label);
    });
  }

  // Text cut with "…" to fit `max` px at `size` px.
  function fitText(text, size, max) {
    if (textWidth(text, size) <= max) return text;
    let n = text.length;
    while (n > 1 && textWidth(`${text.slice(0, n)}…`, size) > max) n -= 1;
    return `${text.slice(0, n)}…`;
  }

  function selectedKinds() {
    return state.kinds ? state.kinds.split(",").filter(k => data.kinds.includes(k)) : data.kinds.slice();
  }

  // ---- start ----------------------------------------------------------------------

  // Color theme: one button showing the current choice's icon; each click
  // moves to the next of system (auto), light, and dark.
  const THEMES = ["auto", "light", "dark"];
  const THEME_ICONS = {
    light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4' +
      'M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    auto: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
    dark: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  };
  const THEME_NAMES = {light: "Light", auto: "System", dark: "Dark"};
  function applyTheme() {
    const theme = THEMES.includes(state.colors) ? state.colors : "auto";
    if (theme === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = theme;
    const next = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    const button = document.getElementById("theme");
    const label = `${THEME_NAMES[theme]} theme (click for ${THEME_NAMES[next].toLowerCase()})`;
    button.setAttribute("aria-label", label);
    button.title = label;
    // Fixed icon markup from THEME_ICONS, never data.
    button.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" ` +
      `stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${THEME_ICONS[theme]}</svg>`;
  }

  // Other projects' pages sit next to this one (data.siblings, set when the
  // page is built). The title ends with the dropdown: Project Analytics: [name].
  // Switching keeps the view except what belongs to one project.
  const PROJECT_ONLY = ["theme", "without", "who", "pwho"];
  function setupProjectSwitch() {
    const select = document.getElementById("project");
    const projects = data.siblings || [];
    if (projects.length < 2) return;
    select.append(...projects.map((s, i) => el("option", {value: i}, s.name)));
    const current = projects.findIndex(s => s.current);
    select.value = current;
    const title = document.getElementById("title");
    const pick = el("span", {class: "project-pick"});
    select.replaceWith(pick);
    pick.append(select);
    if (title.textContent.startsWith(projects[current].name)) {
      // "Project Analytics: [name]", so the fixed text never moves between projects.
      title.replaceChildren(`${title.textContent.slice(projects[current].name.length).trim()}:`, pick);
      // Fit the select to the open project's name, not the longest one:
      // text, left padding, the arrow's room on the right, and the border.
      const ctx = document.createElement("canvas").getContext("2d");
      ctx.font = `600 20px ${getComputedStyle(document.body).fontFamily}`;
      select.style.width = `${Math.ceil(ctx.measureText(projects[current].name).width) + 44}px`;
    }
    select.onchange = () => {
      const target = projects[select.value];
      if (target.current) return;
      location.href = target.href + hashOf(state, PROJECT_ONLY);
    };
    select.hidden = false;
  }

  function start() {
    state = readHash();
    const p = data.project;
    const longDate = d => new Date(d * DAY_MS).toLocaleDateString("en-US",
      {year: "numeric", month: "short", day: "numeric", timeZone: "UTC"});
    const about = document.getElementById("about");
    about.title = `Page built ${longDate(dateToDay(p.generated))}`;
    about.append(`Data from `, el("a", {href: `https://github.com/${p.github}`}, p.label || p.github),
      `, through ${p.data_end === null ? "–" : longDate(p.data_end)}`);
    document.getElementById("theme").onclick = () => {
      const theme = THEMES.includes(state.colors) ? state.colors : "auto";
      const next = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
      state.colors = next === "auto" ? undefined : next;
      applyTheme();
      writeHash();
      renderAll();
    };
    applyTheme();
    setupHints();
    setupProjectSwitch();

    // Tabs: a tab list at the bottom of the pinned bar, right above the
    // panels. Arrow keys, Home, and End move between tabs and open them.
    const main = document.getElementById("views");
    const tabList = document.getElementById("tabs");
    views.sort((a, b) => (a.order || 0) - (b.order || 0));
    const tabs = TABS.filter(tab => views.some(v => tabOf(v) === tab.id));
    tabs.forEach((tab, i) => {
      const grid = el("div", {class: "grid"});
      tab.button = el("button", {
        type: "button", role: "tab", class: "tab", id: `tab-${tab.id}`,
        "aria-controls": `panel-${tab.id}`, "data-label": tab.label,
      }, tab.label);
      tab.button.onclick = () => openTab(tab.id);
      tab.button.addEventListener("keydown", event => {
        const to = {ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1}[event.key];
        if (to === undefined) return;
        event.preventDefault();
        const next = tabs[(to + tabs.length) % tabs.length];
        openTab(next.id);
        next.button.focus();
      });
      tab.panel = el("section", {
        class: "panel", id: `panel-${tab.id}`, role: "tabpanel", "aria-labelledby": `tab-${tab.id}`,
      }, grid);
      for (const view of views.filter(v => tabOf(v) === tab.id)) {
        view.figure = makeFigure(view);
        grid.append(view.figure.root);
      }
      tabList.append(tab.button);
      main.append(tab.panel);
    });

    const bar = document.getElementById("filter-controls");
    const more = document.getElementById("filter-more");
    for (const filter of filters) {
      if (filter.init) filter.init(state);
      const box = el("div", {class: "filter", id: `filter-${filter.id}`});
      filter.control(box, state, set);
      const target = filter.target && views.find(v => v.id === filter.target);
      if (target) target.figure.controls.append(box);
      else if (filter.secondary) {
        if (box.childElementCount) more.append(box);
      } else bar.append(box);
    }
    if (more.childElementCount) {
      const toggle = el("button", {
        type: "button", id: "more-toggle", "aria-expanded": "true", "aria-controls": "filter-more",
      }, "More filters", el("span", {class: "badge", id: "more-badge", hidden: true}), el("span", {class: "chev", "aria-hidden": "true"}));
      more.hidden = false;
      toggle.onclick = () => {
        const opening = more.hidden;
        more.hidden = !opening;
        toggle.setAttribute("aria-expanded", String(opening));
      };
      bar.append(toggle);
    }

    // Sections scroll clear of the pinned bar, which grows when the extra
    // filters open or chips appear.
    const barNode = document.getElementById("filters");
    new ResizeObserver(() => {
      document.documentElement.style.setProperty("--bar-h", `${barNode.offsetHeight}px`);
    }).observe(barNode);
    writeHash();
    renderAll();
    for (const hook of startHooks) hook();

    let pending = null;
    window.addEventListener("resize", () => {
      clearTimeout(pending);
      pending = setTimeout(renderAll, 150);
    });
    window.addEventListener("scroll", hideTooltip, {passive: true});
  }

  return {
    data, get state() { return state; }, set, start,
    registerFilter, registerView, onStart,
    el, fillTable, fillLegend, swatch, fillHowto, jumpTo, openTab, showTooltip, hideTooltip, textWidth, rovingFocus,
    personName, personLink, docUrl, dayToDate,
    dayToText, dateToDay, periodScheme, sourceMarkers, markerLabels, fitText, selectedKinds, KIND_NAMES,
  };
})();

</script>
<script>
/* metrics.js */
// Retention math in the browser, mirroring projstats/retention.py at day
// precision. #check compares these results with Python's reference numbers.

PS.metrics = (() => {
  // rows: activity indexes; scheme: PS.periodScheme(...); gapDays: return gap.
  // Returns one row per period from the first to the last with activity,
  // empty periods included. Mirrors retention.period_counts().
  function periodCounts(rows, data, scheme, gapDays) {
    if (!rows.length) return [];
    const A = data.activity;
    const days = new Map();  // person -> days
    let minKey = Infinity, maxKey = -Infinity, dataEnd = -Infinity;
    for (const i of rows) {
      const day = A.day[i];
      const person = A.person[i];
      if (!days.has(person)) days.set(person, []);
      days.get(person).push(day);
      const key = scheme.key(day);
      if (key < minKey) minKey = key;
      if (key > maxKey) maxKey = key;
      if (day > dataEnd) dataEnd = day;
    }
    const out = new Map();
    for (let key = minKey; key <= maxKey; key++) {
      const [start, end] = scheme.bounds(key);
      out.set(key, {
        key, label: scheme.label(key), short: scheme.short(key), start, end,
        active: 0, new: 0, returning: 0, continuing: 0, lastSeen: null,
        activity: 0, partial: key === maxKey, people: [],
      });
    }
    const lastSeen = new Map();
    for (const [person, list] of days) {
      list.sort((a, b) => a - b);
      let prev = null;
      let i = 0;
      while (i < list.length) {
        const key = scheme.key(list[i]);
        let j = i;
        while (j + 1 < list.length && scheme.key(list[j + 1]) === key) j++;
        const row = out.get(key);
        row.active += 1;
        row.activity += j - i + 1;
        const kind = prev === null ? "new" : list[i] - prev >= gapDays ? "returning" : "continuing";
        row[kind] += 1;
        row.people.push({person, kind, activity: j - i + 1});
        prev = list[j];
        i = j + 1;
      }
      const lastKey = scheme.key(list[list.length - 1]);
      lastSeen.set(lastKey, (lastSeen.get(lastKey) || 0) + 1);
    }
    for (const row of out.values()) {
      if (row.end !== null && dataEnd - row.end >= gapDays) {
        row.lastSeen = lastSeen.get(row.key) || 0;
      }
    }
    return [...out.values()];
  }

  // rules: {core, regular} shares of all activity (e.g. 0.8, 0.95). Returns a
  // function from a person's activity count to their segment. Mirrors
  // retention.segments(): one-time is exactly one activity; ranked by
  // activity, core is the top group that reaches the core share and regular
  // the next group up to the regular share, ties at a cutoff included.
  function segmenter(counts, rules) {
    const total = counts.reduce((sum, n) => sum + n, 0);
    const ranked = [...counts].sort((a, b) => b - a);
    const cutoff = share => {
      let run = 0;
      for (const n of ranked) {
        run += n;
        if (run >= share * total) return n;
      }
      return 0;
    };
    const coreMin = cutoff(rules.core), regularMin = cutoff(rules.regular);
    return n => (n === 1 ? "one-time" : n >= coreMin ? "core" : n >= regularMin ? "regular" : "casual");
  }

  // Cadence per person over `rows`. Mirrors retention.person_stats():
  // segments come from each person's share of the activity in `segmentRows`
  // (default: `rows`), and "current" means active within gapDays of the last
  // day in `rows`. Passing the rows with everyone counted keeps the same
  // people in each segment when someone is left out of `rows`.
  // Returns {stats, dataEnd}.
  function personStats(rows, data, rules, gapDays, segmentRows = rows) {
    const A = data.activity;
    const days = new Map();
    let dataEnd = -Infinity;
    for (const i of rows) {
      const person = A.person[i];
      if (!days.has(person)) days.set(person, []);
      days.get(person).push(A.day[i]);
      if (A.day[i] > dataEnd) dataEnd = A.day[i];
    }
    const counts = new Map();
    for (const i of segmentRows) counts.set(A.person[i], (counts.get(A.person[i]) || 0) + 1);
    const segmentOf = segmenter([...counts.values()], rules);
    const quarterOf = PS.periodScheme("quarter").key;
    const yearOf = PS.periodScheme("year").key;
    const stats = [];
    for (const [person, list] of days) {
      list.sort((a, b) => a - b);
      const quarters = new Set(list.map(quarterOf)).size;
      const years = [...new Set(list.map(yearOf))].sort((a, b) => a - b);
      let longestGap = 0, returns = 0;
      for (let k = 1; k < list.length; k++) {
        const gap = list[k] - list[k - 1];
        if (gap > longestGap) longestGap = gap;
        if (gap >= gapDays) returns += 1;
      }
      const last = list[list.length - 1];
      stats.push({
        person, first: list[0], last, activity: list.length, quarters, years,
        longestGap, returns, segment: segmentOf(list.length),
        current: dataEnd - last < gapDays,
      });
    }
    stats.sort((a, b) => b.activity - a.activity || a.person - b.person);
    return {stats, dataEnd};
  }

  // Document index -> its theme indexes, and which documents are tagged.
  let docIndex = null;
  function themeIndex(data) {
    if (docIndex) return docIndex;
    const themesOf = new Map();
    for (let k = 0; k < data.themes.doc.length; k++) {
      const d = data.themes.doc[k];
      if (!themesOf.has(d)) themesOf.set(d, []);
      themesOf.get(d).push(data.themes.theme[k]);
    }
    const tagged = new Uint8Array(data.docs.day.length);
    for (const d of data.themes.tagged) tagged[d] = 1;
    docIndex = {themesOf, tagged};
    return docIndex;
  }

  // Theme stats per period, rising/fading labels, and top contributors.
  // Mirrors trends.analyze(): activity counts toward its document's themes,
  // shares are of activity on tagged documents, and only periods with at
  // least half their documents tagged ("covered") get shares and trends.
  // Trends compare the last covered period with all earlier covered ones.
  function themeTrends(rows, data, scheme, {
    skipInProgress = false, coverage = 0.5, rise = 1.5, fade = 0.67, minDocs = 5, top = 5,
  } = {}) {
    const D = data.docs, A = data.activity;
    const {themesOf, tagged} = themeIndex(data);
    const nThemes = data.themes.name.length;
    const noThemes = [];

    // Periods run from the first document's to the last's; anything outside
    // falls in the nearest one, as trends.period_indexes() does.
    let minKey = Infinity, maxKey = -Infinity;
    const docKey = D.day.map(day => scheme.key(day));
    for (const k of docKey) { if (k < minKey) minKey = k; if (k > maxKey) maxKey = k; }
    if (scheme.kind === "release") { minKey = 0; maxKey = data.releases.day.length; }
    const n = maxKey - minKey + 1;
    if (!(n > 0)) return {periods: [], recent: null, earlier: [], trends: new Map(), contributors: new Map()};
    const indexOf = day => Math.max(0, Math.min(n - 1, scheme.key(day) - minKey));
    const grid = () => Array.from({length: nThemes}, () => new Array(n).fill(0));

    const docsIn = new Array(n).fill(0), taggedIn = new Array(n).fill(0);
    const themeDocs = grid();
    const firstDoc = new Array(nThemes).fill(null);  // {day, p}
    for (let d = 0; d < D.day.length; d++) {
      const p = Math.max(0, Math.min(n - 1, docKey[d] - minKey));
      docsIn[p] += 1;
      if (!tagged[d]) continue;
      taggedIn[p] += 1;
      for (const t of themesOf.get(d) || noThemes) {
        themeDocs[t][p] += 1;
        if (firstDoc[t] === null || D.day[d] < firstDoc[t].day) firstDoc[t] = {day: D.day[d], p};
      }
    }

    const commit = data.kinds.indexOf("commit");
    const codeKinds = new Set([commit, data.kinds.indexOf("pr")]);
    const activityIn = new Array(n).fill(0);
    const code = grid(), discussion = grid(), commits = grid();
    const people = new Map();  // t * n + p -> Set of people
    const byPerson = Array.from({length: nThemes}, () => new Map());
    const lastDay = new Array(nThemes).fill(null);
    for (const i of rows) {
      const d = A.doc[i];
      if (d < 0 || !tagged[d]) continue;
      const p = indexOf(A.day[i]);
      activityIn[p] += 1;
      const isCode = codeKinds.has(A.kind[i]);
      for (const t of themesOf.get(d) || noThemes) {
        (isCode ? code : discussion)[t][p] += 1;
        if (A.kind[i] === commit) commits[t][p] += 1;
        const cell = t * n + p;
        if (!people.has(cell)) people.set(cell, new Set());
        people.get(cell).add(A.person[i]);
        const c = byPerson[t].get(A.person[i]) || {code: 0, discussion: 0};
        if (isCode) c.code += 1; else c.discussion += 1;
        byPerson[t].set(A.person[i], c);
        if (lastDay[t] === null || A.day[i] > lastDay[t]) lastDay[t] = A.day[i];
      }
    }

    const covered = docsIn.map((docs, p) => docs > 0 && taggedIn[p] / docs >= coverage);
    const present = [];
    for (let t = 0; t < nThemes; t++) {
      if (themeDocs[t].some(Boolean) || code[t].some(Boolean) || discussion[t].some(Boolean)) present.push(t);
    }
    const name = t => data.themes.name[t];

    const periods = [];
    for (let p = 0; p < n; p++) {
      const key = p + minKey;
      const stats = [];
      for (const t of present) {
        const c = code[t][p], dsc = discussion[t][p];
        if (!(c || dsc || themeDocs[t][p])) continue;
        stats.push({
          theme: t, docs: themeDocs[t][p], code: c, discussion: dsc, commits: commits[t][p],
          people: people.has(t * n + p) ? people.get(t * n + p).size : 0,
          share: covered[p] && activityIn[p] ? (c + dsc) / activityIn[p] : null,
        });
      }
      stats.sort((a, b) => (b.code + b.discussion) - (a.code + a.discussion) || name(a.theme).localeCompare(name(b.theme)));
      const newKnown = covered.slice(0, p).some(Boolean);
      periods.push({
        key, label: scheme.label(key), short: scheme.short(key),
        partial: scheme.kind === "release" ? key === data.releases.day.length : p === n - 1,
        docs: docsIn[p], tagged: taggedIn[p], covered: covered[p], activity: activityIn[p],
        themes: stats,
        newThemes: newKnown ? present.filter(t => firstDoc[t] && firstDoc[t].p === p).map(name).sort() : [],
        newKnown,
      });
    }

    const candidates = periods.map((x, p) => p)
      .filter(p => covered[p] && activityIn[p] > 0 && !(skipInProgress && periods[p].partial));
    const recent = candidates.length ? candidates[candidates.length - 1] : null;
    const earlier = candidates.slice(0, -1);
    const trends = new Map();
    if (recent !== null && earlier.length) {
      const base = earlier.reduce((sum, p) => sum + activityIn[p], 0);
      for (const t of present) {
        const total = code[t][recent] + discussion[t][recent];
        const before = earlier.reduce((sum, p) => sum + code[t][p] + discussion[t][p], 0);
        const recentShare = activityIn[recent] ? total / activityIn[recent] : 0;
        const earlierShare = base ? before / base : 0;
        const docs = [...earlier, recent].reduce((sum, p) => sum + themeDocs[t][p], 0);
        let label;
        if (docs < minDocs) label = "too few";
        else if (earlierShare === 0) label = recentShare > 0 ? "rising" : "steady";
        else if (recentShare >= rise * earlierShare) label = "rising";
        else if (recentShare <= fade * earlierShare) label = "fading";
        else label = "steady";
        trends.set(t, {label, recentShare, earlierShare, docs});
      }
    }

    const contributors = new Map();
    for (const t of present) {
      const ranked = [...byPerson[t]].sort((a, b) =>
        (b[1].code + b[1].discussion) - (a[1].code + a[1].discussion) ||
        PS.personName(a[0]).localeCompare(PS.personName(b[0])));
      contributors.set(t, ranked.slice(0, top).map(([person, c]) => ({person, ...c})));
    }
    return {periods, recent, earlier, trends, contributors, present, firstDoc, lastDay, periodOf: indexOf};
  }

  return {
    periodCounts, personStats, themeIndex, themeTrends,
    SEGMENTS: ["core", "regular", "casual", "one-time"],
  };
})();

</script>
<script>
/* filters/dates.js */
// Filter: date range (inclusive), with presets. Dates are UTC days. An empty
// start or end means open-ended, so the fields show the first day of data and
// today's date.

PS.registerFilter({
  id: "dates",
  control(box, state, set) {
    const end = PS.data.project.data_end;
    const github = PS.data.sources.pr;
    const endText = end === null ? null : PS.dayToText(end);
    const yearsBack = n => endText && `${Number(endText.slice(0, 4)) - n}${endText.slice(4)}`;
    // n whole months before the end, with the day cut to the month's length.
    const monthsBack = n => {
      if (!endText) return null;
      const [y, m, d] = endText.split("-").map(Number);
      const lastDay = new Date(Date.UTC(y, m - 1 - n + 1, 0)).getUTCDate();
      return new Date(Date.UTC(y, m - 1 - n, Math.min(d, lastDay))).toISOString().slice(0, 10);
    };
    const now = new Date();
    const today = [now.getFullYear(), now.getMonth() + 1, now.getDate()]
      .map((n, i) => String(n).padStart(i ? 2 : 4, "0")).join("-");
    const days = PS.data.activity.day;
    const first = days.length ? PS.dayToText(days.reduce((a, b) => (b < a ? b : a))) : "";
    const presets = [
      {id: "all", name: "All time", from: undefined, to: undefined},
      github !== undefined && {
        id: "github", name: "Since GitHub PRs",
        from: PS.dayToText(github), to: undefined,
      },
      endText && {id: "3y", name: "Last 3 years", from: yearsBack(3), to: undefined},
      endText && {id: "1y", name: "Last 1 year", from: yearsBack(1), to: undefined},
      endText && {id: "3m", name: "Last 3 months", from: monthsBack(3), to: undefined},
    ].filter(Boolean);

    const select = PS.el("select", {"aria-label": "Date range"},
      ...presets.map(p => PS.el("option", {value: p.id}, p.name)),
      // Shown only while typed dates match no preset; never offered as a choice.
      PS.el("option", {value: "custom", hidden: true, disabled: true}, "Custom"));
    const from = PS.el("input", {type: "date", "aria-label": "From", min: first, max: today});
    const to = PS.el("input", {type: "date", "aria-label": "To", min: first, max: today});

    function sync() {
      from.value = state.from || first;
      to.value = state.to || today;
      const match = presets.find(p => (p.from || "") === (state.from || "") && !state.to);
      select.value = match ? match.id : "custom";
    }
    select.onchange = () => {
      const preset = presets.find(p => p.id === select.value);
      if (preset) set({from: preset.from, to: preset.to});
      sync();
    };
    from.onchange = () => { set({from: from.value && from.value !== first ? from.value : undefined}); sync(); };
    to.onchange = () => { set({to: to.value && to.value !== today ? to.value : undefined}); sync(); };

    box.append(PS.el("span", {class: "label"}, "Dates"), select, from, PS.el("span", {}, "to"), to);
    sync();
    this.syncControl = sync;
    this.presets = presets;
  },
  sync() { if (this.syncControl) this.syncControl(); },
  chips(state) {
    if (!state.from && !state.to) return [];
    const match = this.presets.find(p => (p.from || "") === (state.from || "") && !state.to);
    const text = match ? match.name
      : state.from && state.to ? `${state.from} to ${state.to}`
      : state.from ? `From ${state.from}` : `Until ${state.to}`;
    return [{text, clear: {from: undefined, to: undefined}}];
  },
  predicate(state) {
    if (!state.from && !state.to) return null;
    const lo = state.from ? PS.dateToDay(state.from) : -Infinity;
    const hi = state.to ? PS.dateToDay(state.to) : Infinity;
    const day = PS.data.activity.day;
    return i => day[i] >= lo && day[i] <= hi;
  },
});

</script>
<script>
/* filters/kind.js */
// Filter: which activity counts, as one choice: All, Code, or Discussion.
// The hash keeps the individual kinds (#kinds=commit,pr). Older links with
// other combinations are widened to the whole group (or to All) on load.

const KIND_GROUPS = {
  code: ["commit", "pr"],
  discussion: ["review", "issue", "comment"],
};

PS.registerFilter({
  id: "kind",
  init(state) {
    if (!state.kinds) return;
    const on = state.kinds.split(",").filter(k => PS.data.kinds.includes(k));
    const within = group => on.length && on.every(k => KIND_GROUPS[group].includes(k));
    const pick = within("code") ? "code" : within("discussion") ? "discussion" : null;
    state.kinds = pick ? KIND_GROUPS[pick].filter(k => PS.data.kinds.includes(k)).join(",") : undefined;
  },
  control(box, state, set) {
    const has = k => PS.data.kinds.includes(k);
    const code = KIND_GROUPS.code.filter(has);
    const discussion = KIND_GROUPS.discussion.filter(has);
    if (!code.length || !discussion.length) return;
    const options = [
      {name: "All", title: "Commits, PRs opened, reviews, issues opened, and comments", kinds: undefined},
      {name: "Code", title: "Commits and PRs opened", kinds: code},
      {name: "Discussion", title: "Reviews, issues opened, and comments", kinds: discussion},
    ];
    const current = () => {
      const on = PS.selectedKinds();
      if (on.every(k => code.includes(k))) return 1;
      if (on.every(k => discussion.includes(k))) return 2;
      return 0;
    };
    const choose = i => {
      if (i === current()) return;
      set({kinds: options[i].kinds && options[i].kinds.join(",")});
      sync();
    };
    box.append(PS.el("span", {class: "label", id: "kind-label"}, "Activity"));
    const group = PS.el("span", {class: "choice", role: "radiogroup", "aria-labelledby": "kind-label"});
    const buttons = options.map((o, i) => {
      const button = PS.el("button", {type: "button", role: "radio", title: o.title, "data-label": o.name}, o.name);
      button.onclick = () => choose(i);
      button.onfocus = () => choose(i);
      return button;
    });
    function sync() {
      const now = current();
      buttons.forEach((b, i) => {
        b.setAttribute("aria-checked", String(i === now));
        b.setAttribute("tabindex", i === now ? 0 : -1);
      });
    }
    group.append(...buttons);
    box.append(group);
    PS.rovingFocus(buttons, current(), "ArrowLeft", "ArrowRight");
    sync();
    this.syncControl = sync;
    this.pick = () => (current() ? options[current()].name : null);
  },
  sync() { if (this.syncControl) this.syncControl(); },
  chips() {
    const name = this.pick && this.pick();
    return name ? [{text: `Activity: ${name}`, clear: {kinds: undefined}}] : [];
  },
  predicate(state) {
    const on = new Set(PS.selectedKinds());
    if (on.size === PS.data.kinds.length) return null;
    const allowed = PS.data.kinds.map(k => on.has(k));
    const kind = PS.data.activity.kind;
    return i => allowed[kind[i]];
  },
});

</script>
<script>
/* filters/people.js */
// Filter: a checkbox per person listed in [people] leave_out_option, so one
// very active person can be left out of every count. The URL lists the
// logins left out (without=lgritz). The page calls each one by its label from
// [people] leave_out_option, not by name.

const optionalPeople = () => PS.data.project.leave_out_option || [];

// Indexes of the optional people currently left out.
PS.leftOut = state => {
  const logins = new Set((state.without || "").split(",").filter(Boolean));
  return optionalPeople().filter(p => logins.has(PS.data.people.login[p]));
};

// The label for an optional person (same order as optionalPeople).
const labelOf = p => PS.data.project.leave_out_label[optionalPeople().indexOf(p)];

// Generic labels for the people currently left out.
PS.leftOutLabels = state => PS.leftOut(state).map(labelOf);

PS.registerFilter({
  id: "people",
  secondary: true,
  control(box, state, set) {
    const people = optionalPeople();
    if (!people.length) return;
    this.boxes = people.map(p => {
      const input = PS.el("input", {type: "checkbox"});
      input.onchange = () => {
        const out = people.filter((_, i) => !this.boxes[i].checked).map(q => PS.data.people.login[q]);
        set({without: out.length ? out.join(",") : undefined});
      };
      box.append(PS.el("label", {class: "check"}, input, `Include ${labelOf(p)}`));
      return input;
    });
    this.sync(state);
  },
  sync(state) {
    if (!this.boxes) return;
    const out = new Set(PS.leftOut(state));
    optionalPeople().forEach((p, i) => { this.boxes[i].checked = !out.has(p); });
  },
  chips(state) {
    const out = PS.leftOut(state);
    return out.map(p => {
      const rest = out.filter(q => q !== p).map(q => PS.data.people.login[q]);
      return {text: `Without ${labelOf(p)}`, clear: {without: rest.length ? rest.join(",") : undefined}};
    });
  },
  predicate(state) {
    const out = new Set(PS.leftOut(state));
    if (!out.size) return null;
    const person = PS.data.activity.person;
    return i => !out.has(person[i]);
  },
});

</script>
<script>
/* filters/period.js */
// Setting: the period the contributors chart and the timeline group by. It
// filters no rows, but two tabs use it, so it sits in the top bar.

PS.registerFilter({
  id: "period",
  init(state) {
    const valid = ["month", "quarter", "year", "release"];
    if (!valid.includes(state.period)) state.period = "quarter";
    if (state.period === "release" && !PS.data.releases.day.length) state.period = "quarter";
  },
  control(box, state, set) {
    const options = [["month", "Month"], ["quarter", "Quarter"], ["year", "Year"]];
    if (PS.data.releases.day.length) options.push(["release", "Release cycle"]);
    const select = PS.el("select", {"aria-label": "Group by"},
      ...options.map(([value, name]) => PS.el("option", {value}, name)));
    select.value = state.period;
    select.onchange = () => set({period: select.value});
    this.select = select;
    box.append(PS.el("span", {class: "label"}, "Group by"), select);
  },
  sync(state) { if (this.select) this.select.value = state.period; },
});
