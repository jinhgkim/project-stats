[project]
name = "projstats"
version = "0.1.0"
description = "Contributor retention and topic trends from a project's git and GitHub history"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
projstats = "projstats.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["projstats"]

[tool.setuptools.package-data]
projstats = ["page/*.html", "page/*.js", "page/filters/*.js", "page/views/*.js"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
